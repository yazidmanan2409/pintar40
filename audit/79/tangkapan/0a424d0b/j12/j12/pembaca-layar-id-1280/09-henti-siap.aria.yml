          - strong: Berakhir
          - text: "· Terencana · Seluruh platform Rabu, 25 Nov 2026, 07.12 WIB sampai Rabu, 25 Nov 2026, 09.12 WIB Dijadwalkan oleh Hendra Kusuma Alasan: Pemeliharaan rutin"
