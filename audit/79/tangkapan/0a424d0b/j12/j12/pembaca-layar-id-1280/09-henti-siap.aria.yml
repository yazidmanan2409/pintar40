    - region "Hentikan sekarang":
      - heading "Hentikan sekarang" [level=2]
      - paragraph: "Hanya untuk masalah keamanan, integritas atau infrastruktur yang membuat PINTAR tidak aman dilanjutkan. Semua kegiatan yang terdampak berhenti seketika, termasuk asesmen yang sedang dikerjakan. Tidak ada yang dikumpulkan, dinilai atau dihapus: yang sudah tersimpan tetap seperti adanya. Akhiri dari daftar pemeliharaan bila sudah aman."
      - group "Untuk":
        - text: Untuk
        - checkbox "Seluruh platform" [checked]
        - text: Seluruh platform
      - text: Alasan (dicatat)
      - textbox "Alasan (dicatat)": "Uji henti darurat (dunia audit J12): gangguan basis data disimulasikan."
      - text: Ketik HENTIKAN SEKARANG untuk mengonfirmasi
      - textbox "Ketik HENTIKAN SEKARANG untuk mengonfirmasi": HENTIKAN SEKARANG
