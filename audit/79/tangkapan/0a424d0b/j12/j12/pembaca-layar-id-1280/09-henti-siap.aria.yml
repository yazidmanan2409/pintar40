  - heading "Pemeliharaan dan pengumuman" [level=1]
  - paragraph: Seluruh platform
  - region "Pemeliharaan dan pengumuman":
    - paragraph: Jadwalkan pemeliharaan supaya orang yang terdampak tahu lebih dulu. Mulai 60 menit sebelumnya, pita peringatan tampil; mulai 15 menit sebelumnya, asesmen baru tidak dapat dimulai. Pemeliharaan untuk sekolah atau kelas menahan perubahan pada pekerjaannya, dan bagian PINTAR yang lain tetap dapat dipakai. Pemeliharaan seluruh platform membuat PINTAR tidak dapat dipakai. Asesmen yang sedang dikerjakan tetap dapat diselesaikan dan dikumpulkan.
    - region "Jadwalkan pemeliharaan":
      - heading "Jadwalkan pemeliharaan" [level=2]
      - group "Untuk":
        - text: Untuk
        - checkbox "Seluruh platform"
        - text: Seluruh platform
      - text: Mulai (WIB; kosongkan untuk sekarang)
      - textbox "Mulai (WIB; kosongkan untuk sekarang)"
      - paragraph: Belum ada tanggal.
      - text: Perkiraan selesai (WIB)
      - textbox "Perkiraan selesai (WIB)"
      - paragraph: Belum ada tanggal.
