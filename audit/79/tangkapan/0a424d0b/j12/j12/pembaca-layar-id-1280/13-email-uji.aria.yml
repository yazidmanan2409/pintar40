  - paragraph: Email
  - heading "Kirim email uji" [level=1]
  - paragraph: Kirim satu email uji ke kotak masuk yang Anda pilih, untuk memastikan email PINTAR sampai. Email ini melewati jalur dan batas pengiriman yang sama dengan email PINTAR lainnya.
  - text: Alamat email tujuan
  - textbox "Alamat email tujuan": admin1.pintar@dunia.pintar.test
  - button "Kirim email uji"
  - alert: "Belum terkirim: permintaan ini tidak datang dari halaman PINTAR di alamat ini. Buka halaman ini lagi dari alamat PINTAR, lalu kirim ulang."
  - region "Apa yang terjadi pada sebuah email?":
    - heading "Apa yang terjadi pada sebuah email?" [level=2]
    - paragraph: "Setiap pengiriman berada di salah satu dari empat keadaan: «Dalam antrean» (belum ada jawaban dari server email), «Diserahkan» (server email sudah menerimanya), «Gagal» (ditolak atau server tidak terjangkau), atau «Tidak dikirim» (batas pengiriman). PINTAR tidak menerima kabar dari kotak masuk penerima, jadi tidak pernah tahu apakah sebuah email sudah sampai."
    - paragraph: Ketik alamat email atau rujukan sebuah pengiriman. PINTAR tidak menyimpan alamat email; ia mencocokkan sidik alamat yang Anda ketik dengan catatan pengirimannya.
    - text: Alamat email atau rujukan
    - textbox "Alamat email atau rujukan"
    - button "Lihat riwayat"
    - status
  - region "Pengiriman tertahan":
    - heading "Pengiriman tertahan" [level=2]
    - paragraph: Email dalam antrean yang belum dijawab server email lebih dari 10 menit. «Diserahkan» berarti server email sudah menerimanya; itu belum berarti sampai di kotak masuk.
    - paragraph: Tidak ada pengiriman yang tertahan.
  - text: Dr. dr. Gladys DT Tubarad, M.Pd.Ked PT ZAYD PINTAR SELALU
