  - paragraph: Pimpinan
  - heading "Apa yang menunggu Anda" [level=1]
  - paragraph: Yang muncul di sini memerlukan wewenang, koordinasi, atau penafsiran untuk sekolah secara keseluruhan. Selebihnya tidak muncul.
  - region "Bagian A Keputusan":
    - heading "Bagian A Keputusan" [level=2]
    - paragraph: Tidak ada keputusan yang menunggu Anda.
    - paragraph: PINTAR mengusulkan, manusia memutuskan.
  - region "Bagian B Yang didukung bukti":
    - heading "Bagian B Yang didukung bukti" [level=2]
    - text: Peserta 14 Banyaknya murid yang mengerjakan asesmen di sekolah ini. dari 14 Capaian kompetensi
    - list:
      - listitem: Menyebutkan organ pertama pencernaan. 90% · 10 murid
      - listitem: Menjelaskan fungsi lambung. 70% · 10 murid
      - listitem: Menjelaskan tempat penyerapan sari makanan. 40% · 10 murid
      - listitem: Mengenali persamaan linear satu variabel. — · 1 murid
      - listitem: Menghitung hasil perkalian dua bilangan satu angka. — · 3 murid
      - listitem: Menjelaskan pengertian dan satuan gaya. — · 10 murid
      - listitem: Menjelaskan sifat cahaya merambat lurus. — · 3 murid
      - listitem: Menyelesaikan persamaan linear satu variabel. — · 1 murid
    - text: Rata-rata penguasaan pada tiap ranah yang diukur. dari 10 Kenaikan Angka gabungan ini tidak ditampilkan agar hasil bagian yang dikerjakan sedikit murid tidak dapat dihitung darinya. Sudah 14 murid punya Pemetaan Awal dan Uji Penguasaan; ada kelas yang baru punya kurang dari 5 murid seperti itu. Soal wajib Belum cukup data untuk menampilkan angka ini. Dari hasil Uji Penguasaan yang memuat soal wajib, baru 1 murid; perlu 10. 27 hasil Uji Penguasaan lain berasal dari uji tanpa soal wajib, jadi tidak dihitung, baik sebagai lulus maupun tidak. Angka ini muncul setelah cukup murid mengerjakan Uji Penguasaan yang memuat soal wajib.
