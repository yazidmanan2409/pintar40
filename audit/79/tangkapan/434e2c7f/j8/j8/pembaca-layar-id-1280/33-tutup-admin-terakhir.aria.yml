    - paragraph: PINTAR ID bukan rahasia. Nomor ini menunjukkan siapa Anda di PINTAR, dan tidak bisa dipakai untuk masuk.
  - region "Buat PIN baru":
    - heading "Buat PIN baru" [level=2]
    - paragraph: "PIN lama Anda tidak berlaku lagi. Buat PIN baru 4 angka: PIN ini dipakai untuk memulihkan akun dengan PINTAR ID Anda. Jangan berikan kepada siapa pun."
    - text: PIN baru (4 angka)
