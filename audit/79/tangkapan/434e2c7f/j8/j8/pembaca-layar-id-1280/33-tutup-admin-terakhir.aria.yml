    - heading "Keluar dari semua perangkat" [level=2]
    - paragraph: Akun Anda keluar dari setiap komputer dan perangkat tempat Anda masuk, termasuk yang ini. Setelah itu Anda masuk lagi di perangkat yang Anda pakai.
    - button "Keluar dari semua perangkat"
