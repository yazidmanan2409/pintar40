    - heading "Kartu PINTAR" [level=2]
    - paragraph: Kirim Kartu PINTAR Anda ke email Anda, untuk disimpan atau ditunjukkan.
    - button "Kirim kartu ke email saya"
  - region "Foto profil":
    - heading "Foto profil" [level=2]
    - paragraph: Foto ini hanya tampil di profil Anda. Foto tidak dicetak di sertifikat.
    - text: Pilih foto
    - button "Pilih foto"
    - paragraph: Belum dipilih
    - paragraph: PNG, JPEG, atau WebP; paling besar 2 MB.
  - region "Komputer ini":
    - heading "Komputer ini" [level=2]
    - paragraph: "Komputer pribadi Anda: Anda tetap masuk hingga 7 hari."
    - link "Ubah":
      - /url: /perangkat?lanjut=%2Fakun
  - region "Meninggalkan PINTAR":
    - heading "Meninggalkan PINTAR" [level=2]
    - paragraph: Anda boleh pergi kapan saja. Inilah yang terjadi bila akun ditutup atau data pribadi dihapus, sebagaimana PINTAR bekerja saat ini.
    - list:
      - listitem: "Akses: saat akun ditutup, semua perangkat keluar dan masuk tidak lagi bisa, di semua sekolah."
      - listitem: "Data pribadi: yang dihapus adalah foto profil beserta berkasnya, nama tampilan (diganti PINTAR ID), email untuk masuk, nama pengguna, alamat IP dan peramban yang tercatat saat masuk, dan salinan nama dan email di catatan pendaftaran PINTAR. Yang lain disimpan karena aturan, seperti di bawah."
      - listitem: "Catatan akademik: hasil dan pengerjaan tetap tersimpan di sekolahnya. Setelah penghapusan, catatan itu tanpa nama Anda."
      - listitem: "Sertifikat: tetap dapat diperiksa. Nama yang tertulis di sertifikat adalah catatan sertifikat itu sendiri dan tidak diubah."
      - listitem: "Jejak audit: tidak pernah ditulis ulang. Bila nama atau email Anda pernah dikoreksi, baris koreksi itu tetap menyimpan nama atau email yang lama."
      - listitem: "Cadangan dan log layanan: data yang dihapus dari PINTAR masih ada di cadangan sampai cadangan itu berakhir, saat ini 7 hari. Log penyedia layanan yang menjalankan PINTAR juga mencatat email dan alamat IP saat masuk; log itu terhapus menurut masa simpan penyedia tersebut, dan PINTAR tidak dapat menghapusnya lebih awal."
    - alert: "Permintaan ini tidak diajukan: Anda satu-satunya Admin sekolah yang masih aktif di sekolah Anda, jadi akun Anda belum dapat ditutup. Tunjuk Admin sekolah lain lebih dulu di Peran & akses, lalu ajukan lagi. Bila tidak ada orang lain, hubungi Admin PINTAR."
    - heading "Tutup akun saya" [level=3]
    - paragraph: "Akun ditutup saat itu juga: semua perangkat keluar dan Anda tidak dapat masuk lagi, juga untuk melihat permintaan Anda. Catatan tetap tersimpan. Untuk kembali, buka «Minta dibuka kembali» di halaman masuk; Admin PINTAR membuka akun hanya setelah memastikan identitas Anda."
    - checkbox "Saya memahami bahwa akun saya ditutup sekarang."
    - text: Saya memahami bahwa akun saya ditutup sekarang.
    - button "Tutup akun saya"
    - status
    - heading "Hapus data pribadi saya" [level=3]
    - paragraph: Data pribadi dihapus hanya setelah akun ditutup. Permintaan ini dicatat sekarang, dan Admin PINTAR mengerjakannya setelah Anda menutup akun. Keadaannya terlihat di sini selama akun belum ditutup; setelah ditutup, Anda tidak dapat masuk untuk melihatnya.
    - checkbox "Saya meminta data pribadi saya dihapus."
    - text: Saya meminta data pribadi saya dihapus.
    - button "Kirim permintaan"
    - status
