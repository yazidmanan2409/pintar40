- main:
  - link "← Peran & akses":
    - /url: /konfigurasi/roles
  - paragraph: Peran dan tanggung jawab
  - heading "Wahyu Nugroho" [level=1]
  - paragraph: Peran yang dipegang orang ini di sekolah ini, dan tanggung jawab yang dibawa tiap peran. Di PINTAR, wewenang datang dari peran yang diberikan di sini, bukan dari jabatan di sekolah.
  - region "Peran sekarang":
    - heading "Peran sekarang" [level=2]
    - list:
      - listitem: "Admin sekolah Tempat: SD Sintetis Anggrek Berlaku sampai Selasa, 25 Nov 2036 Tanggung jawab: Menyediakan materi untuk kelas, Menyetujui perpindahan murid, Menyusun paket di Studio, Membuat dan mengunci terbitan, Mengelola templat laporan, Mengatur sesi asesmen murid, Mendata orang dan mengaktifkan akun, Menerbitkan paket dan mengelola sertifikat, Membuat Uji Cepat, Menyetujui isi paket, Meninjau catatan integritas, Meninjau sinyal mutu soal, Melihat daftar murid"
  - region "Ubah peran & tanggung jawab":
    - heading "Ubah peran & tanggung jawab" [level=2]
    - paragraph: Tambah satu peran, lepaskan peran yang tidak lagi dipegang, atau keduanya sekaligus. Tidak ada yang berubah sebelum Anda meninjau dan mengonfirmasi.
    - group "Lepaskan":
      - text: Lepaskan
      - list:
        - listitem:
          - checkbox "Admin sekolah · SD Sintetis Anggrek" [checked]
          - text: Admin sekolah · SD Sintetis Anggrek
    - group "Tambah peran":
      - text: Tambah peran Tambah peran
      - combobox "Tambah peran":
        - option "Tidak menambah peran" [selected]
        - option "Guru"
        - option "Kepala departemen"
        - option "Dekan"
        - option "Admin sekolah"
      - text: Tempat
      - combobox "Tempat":
        - option "SD Sintetis Anggrek" [selected]
        - option "Jenjang"
        - option "Guru dan Staf"
        - option "Kelas Rendah"
        - option "Reguler"
        - option "Reguler"
        - option "Kelas 1"
        - option "1A"
        - option "1B"
      - text: Berlaku sampai
      - textbox "Berlaku sampai"
      - paragraph: Belum ada tanggal.
    - text: Alasan
    - textbox "Alasan": "Uji: admin terakhir melepas perannya sendiri."
    - paragraph: 10 sampai 300 karakter. Tercatat di jejak audit sekolah.
    - button "Tinjau perubahan"
    - alert: Peran Anda sendiri diubah atau diakhiri oleh admin lain.
  - region "Akhiri tugas di sekolah ini":
    - heading "Akhiri tugas di sekolah ini" [level=2]
    - paragraph: Semua peran orang ini di sekolah ini berakhir saat dicatat. Akunnya, peran di sekolah lain, dan semua karya serta catatannya tetap ada.
    - text: Kategori
    - combobox "Kategori":
      - option "—" [disabled] [selected]
      - option "Pensiun"
      - option "Mengundurkan diri"
      - option "Pindah tugas ke sekolah lain"
      - option "Masa tugas selesai"
      - option "Diberhentikan"
      - option "Lainnya"
    - text: Tanggal kejadian
    - textbox "Tanggal kejadian": 2026-11-25
    - paragraph: Rabu, 25 Nov 2026
    - paragraph: Hari ini atau sebelumnya. Wewenangnya berakhir saat Anda menyimpan, apa pun tanggalnya.
    - text: Alasan
    - textbox "Alasan"
    - paragraph: 10 sampai 300 karakter. Tercatat di jejak audit sekolah.
    - button "Akhiri tugas di sekolah ini"
