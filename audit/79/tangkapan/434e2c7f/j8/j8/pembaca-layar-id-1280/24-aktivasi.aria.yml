- main:
  - paragraph: Akun
  - heading "Aktifkan akun" [level=1]
  - paragraph:
    - text: "Orang yang sudah didata sekolah Anda tetapi belum bisa masuk. Pilih caranya untuk masing-masing: dengan email, atau dengan kartu kelas dan PIN. Untuk guru dan staf, berikan perannya di Peran & akses lebih dulu, lalu aktifkan dengan email. PINTAR tidak mengirim email atau pesan apa pun saat akun dibuat. Untuk akun email, minta orangnya mengaktifkan akunnya di"
    - strong: 127.0.0.1:3999/aktifkan
    - text: .
  - paragraph:
    - link "Koreksi data orang":
      - /url: /aktivasi/orang
    - text: · Email yang salah, nama, atau username orang yang sudah punya akun.
  - heading "Kartu untuk satu kelas" [level=2]
  - paragraph: Buat kartu kelas untuk semua murid di satu kelas yang belum punya akun, dengan sekali tekan. Setiap kartu tetap dibuat dan dicatat untuk muridnya masing-masing.
  - text: Kelas
  - combobox "Kelas":
    - option "Kelas Rendah · Kelas 1 · 1A · 2026/2027 (5 murid belum punya akun)" [selected]
  - button "Buat kartu untuk kelas ini"
  - text: Cari nama atau no. registrasi sekolah
  - searchbox "Cari nama atau no. registrasi sekolah"
  - paragraph: Nomor registrasi orang ini di sekolah tersebut. Berbeda dari PINTAR ID dan NIS/NISN.
  - paragraph: 7 orang menunggu akun.
