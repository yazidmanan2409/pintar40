  - region "Kartu hilang atau rusak":
    - heading "Kartu hilang atau rusak" [level=2]
    - paragraph: Terbitkan kartu baru untuk murid yang kehilangan kartunya atau kartunya rusak. Kartu lama langsung berhenti berlaku; akun, kelas dan semua hasil belajarnya tetap.
    - paragraph: Belum ada murid yang punya kartu kelas.
  - region "Murid yang menjadi staf":
    - heading "Murid yang menjadi staf" [level=2]
    - paragraph: "Kartu kelas hanya untuk murid. Bila seorang murid menjadi staf, ubah kartunya menjadi akun email lebih dulu. Orangnya tetap sama: nomor registrasi sekolah, kelas dan semua hasil belajarnya tetap. Setelah ia mengaktifkan akun email itu, berikan perannya."
  - text: Dr. dr. Gladys DT Tubarad, M.Pd.Ked PT ZAYD PINTAR SELALU
