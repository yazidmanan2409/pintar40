- main:
  - paragraph: Administrasi sekolah
  - heading "Menambahkan orang" [level=1]
  - paragraph: Unggah daftar dari spreadsheet. PINTAR memeriksanya, menunjukkan apa yang akan terjadi, lalu meminta persetujuan Anda sebelum mencatat siapa pun.
  - region "Kode sekolah":
    - heading "Kode sekolah" [level=2]
    - paragraph: Kode ini menjadi bagian dari nomor registrasi sekolah yang dibuat PINTAR untuk setiap orang di sekolah ini.
    - paragraph: Setelah nomor registrasi sekolah pertama diterbitkan, kode ini tidak bisa diubah lagi.
    - text: Kode
    - paragraph: Tiga huruf atau angka.
    - textbox "Kode": A-1
    - button "Simpan kode"
    - status
    - paragraph: "Contoh No. Registrasi Sekolah: AGR000001AB"
    - paragraph: Nomor registrasi orang ini di sekolah tersebut. Berbeda dari PINTAR ID dan NIS/NISN. Nomor ini tidak menyatakan apakah orangnya murid, guru, atau pimpinan.
  - region "Pendataan sebelumnya":
    - heading "Pendataan sebelumnya" [level=2]
    - paragraph: Belum ada pendataan.
  - region "Daftar orang":
    - heading "Daftar orang" [level=2]
    - paragraph: Baris pertama berisi nama kolom. Koma, titik koma, atau tab sama-sama terbaca.
    - paragraph: "Satu daftar untuk satu kelas. Cukup satu kolom «nama». Setelah daftar terbaca, pilih kelasnya sekali untuk semua baris: pada Tempat, pilih «Satu pilihan untuk semua» lalu kelasnya. Dari spreadsheet, simpan sebagai CSV atau salin barisnya ke kotak di bawah."
    - text: nama Ani Lestari Budi Santoso Citra Dewi Pilih berkas
    - button "Pilih berkas"
    - paragraph: Belum dipilih
    - text: Atau tempelkan dari spreadsheet
    - textbox "Atau tempelkan dari spreadsheet"
    - paragraph: Belum ada baris yang terbaca.
