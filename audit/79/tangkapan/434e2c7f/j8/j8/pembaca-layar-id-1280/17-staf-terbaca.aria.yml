- main:
  - paragraph: Administrasi sekolah
  - heading "Menambahkan orang" [level=1]
  - paragraph: Unggah daftar dari spreadsheet. PINTAR memeriksanya, menunjukkan apa yang akan terjadi, lalu meminta persetujuan Anda sebelum mencatat siapa pun.
  - region "Kode sekolah":
    - heading "Kode sekolah" [level=2]
    - paragraph: AGR
    - paragraph: Kode ini sudah dipakai pada nomor registrasi sekolah yang diterbitkan, jadi tidak bisa diubah lagi.
    - paragraph: "Contoh No. Registrasi Sekolah: AGR000001AB"
    - paragraph: Nomor registrasi orang ini di sekolah tersebut. Berbeda dari PINTAR ID dan NIS/NISN. Nomor ini tidak menyatakan apakah orangnya murid, guru, atau pimpinan.
  - region "Pendataan sebelumnya":
    - heading "Pendataan sebelumnya" [level=2]
    - list:
      - listitem:
        - link "5 · 25 Nov 2026, 06.20 WIB Selesai":
          - /url: /pendataan/f2b5b405-0d53-4209-a050-b54851ca9f3d
      - listitem:
        - link "5 · 25 Nov 2026, 06.18 WIB Baru disusun":
          - /url: /pendataan/a0863a69-d179-4e51-a0f7-1ed00ff50422
  - region "Daftar orang":
    - heading "Daftar orang" [level=2]
    - paragraph: Baris pertama berisi nama kolom. Koma, titik koma, atau tab sama-sama terbaca.
    - paragraph: "Satu daftar untuk satu kelas. Cukup satu kolom «nama». Setelah daftar terbaca, pilih kelasnya sekali untuk semua baris: pada Tempat, pilih «Satu pilihan untuk semua» lalu kelasnya. Dari spreadsheet, simpan sebagai CSV atau salin barisnya ke kotak di bawah."
    - text: nama Ani Lestari Budi Santoso Citra Dewi Pilih berkas
    - button "Pilih berkas"
    - paragraph: Belum dipilih
    - text: Atau tempelkan dari spreadsheet
    - textbox "Atau tempelkan dari spreadsheet": nama Siti Rahma Dodi Firmansyah
    - paragraph: 2 baris terbaca
  - region "Kolom mana untuk apa":
    - heading "Kolom mana untuk apa" [level=2]
    - paragraph: "PINTAR menebak dari nama kolom. Ubah bila tebakannya keliru. Kelas dipilih pada Tempat dengan «Satu pilihan untuk semua»: satu daftar untuk setiap kelas."
    - term: Nama
    - definition:
      - combobox "Nama":
        - option "Tidak dipakai"
    - term: Orang yang sudah terdaftar
    - definition:
      - combobox "Orang yang sudah terdaftar":
        - option "Tidak dipakai" [selected]
    - term: Tempat
    - definition:
      - combobox "Tempat":
        - option "Tidak dipakai" [selected]
    - term: Peran
    - definition:
      - combobox "Peran":
        - option "Tidak dipakai" [selected]
    - term: Program
    - definition:
      - combobox "Program":
        - option "Tidak dipakai" [selected]
    - heading "Beberapa baris pertama" [level=3]
    - list:
      - listitem: 1 Siti Rahma
      - listitem: 2 Dodi Firmansyah
    - paragraph: 2 baris belum punya kelas. Murid tanpa kelas bisa masuk, tetapi tidak menerima materi apa pun. Untuk daftar murid, pilih kelasnya pada Tempat («Satu pilihan untuk semua»).
