name: Local Supabase stack
description: >
  Starts the local Supabase stack (pinned CLI from package-lock via npx),
  applies every migration in the given directory to a clean database and runs
  the synthetic seed. Exposes the stack's URL, keys and DB URL as outputs.
  When the job already runs a stack (the red cases share one per group, D-119
  S4), it reuses it: booting is most of a red case's cost. Every use still
  resets the database, and every reset is fingerprinted; a fingerprint that
  differs from the job's first fresh database fails the step, so a case never
  starts from what an earlier case left.
inputs:
  working-directory:
    description: Directory containing supabase/config.toml to start from
    required: false
    default: .
outputs:
  api-url:
    value: ${{ steps.status.outputs.api-url }}
  anon-key:
    value: ${{ steps.status.outputs.anon-key }}
  service-role-key:
    value: ${{ steps.status.outputs.service-role-key }}
  db-url:
    value: ${{ steps.status.outputs.db-url }}
runs:
  using: composite
  steps:
    - name: Start stack
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        npx --no-install supabase --version
        if [ -n "$(docker ps -q --filter name=supabase_db_)" ]; then
          echo "The job's stack is running: reused. The reset below gives this use a fresh database."
        else
          npx --no-install supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit || {
            # 7 Nov (CI 42376999983, 42377635978): on a fresh runner Docker refused the database's host port 54322 as
            # «already in use» before anything of ours ran. Say who holds it, clear the half-started stack, try once more;
            # a second refusal fails the step as before.
            echo "::warning::supabase start failed; the ports and containers as found, then one retry"
            (ss -ltnp 2>/dev/null | grep -E ':543[0-9][0-9]\b' || true)
            (docker ps -a --format '{{.Names}} {{.Status}} {{.Ports}}' || true)
            npx --no-install supabase stop --no-backup || true
            sleep 10
            npx --no-install supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit
          }
        fi
    - name: Reset database (clean install of every migration + synthetic seed)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx --no-install supabase db reset --local
    - name: Read stack credentials
      id: status
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        npx --no-install supabase status -o env > "$RUNNER_TEMP/stack.env"
        val() { grep -E "^$1=" "$RUNNER_TEMP/stack.env" | head -1 | cut -d= -f2- | tr -d '"'; }
        api="$(val API_URL)"; anon="$(val ANON_KEY)"; svc="$(val SERVICE_ROLE_KEY)"; db="$(val DB_URL)"
        [ -n "$anon" ] || anon="$(val PUBLISHABLE_KEY)"
        [ -n "$svc" ]  || svc="$(val SECRET_KEY)"
        for v in api anon svc db; do [ -n "${!v}" ] || { echo "::error::supabase status did not yield $v"; cat "$RUNNER_TEMP/stack.env" | sed 's/=.*/=…/'; exit 1; }; done
        echo "::add-mask::$svc"
        { echo "api-url=$api"; echo "anon-key=$anon"; echo "service-role-key=$svc"; echo "db-url=$db"; } >> "$GITHUB_OUTPUT"
    - name: Fresh database fingerprint (a shared stack never carries one case into the next)
      shell: bash
      env:
        DB_URL: ${{ steps.status.outputs.db-url }}
      run: |
        fp="$(psql -Atq -v ON_ERROR_STOP=1 -f "$GITHUB_ACTION_PATH/fingerprint.sql" "$DB_URL")"
        [ -n "$fp" ] || { echo "::error::the fresh database could not be fingerprinted"; exit 1; }
        first="$RUNNER_TEMP/fresh-database.fingerprint"
        if [ -f "$first" ]; then
          [ "$fp" = "$(cat "$first")" ] || { echo "::error::this database is not the job's fresh database ($fp, not $(cat "$first")): an earlier use left something a reset did not clear"; exit 1; }
          echo "fresh: the same fingerprint as the job's first fresh database ($fp)"
        else
          echo "$fp" > "$first"
          echo "the job's first fresh database: $fp"
        fi
