# STAGING ONLY. Part 2's hosted Auth probe (Sharon, PART2-EVIDENCE-RULING.md rows 6(b) and 2), by
# audit/staging/auth-probe-41.mjs: one synthetic learner at one «sekolah-uji-*» school, suspended before it has an
# account, given a class card, locked at its first read, refused once with its right PIN, reinstated, then removed
# through the product. Dispatch only, from main, by the Chief Architect, with a preservation pair taken around it.
#
# ON STAGING'S EXISTING SECRETS ONLY: STAGING_SUPABASE_DB_URL (reads only; the script writes nothing directly),
# STAGING_SUPABASE_ACCESS_TOKEN (staging's public key only, masked), GS_MAILBOX_PASSWORD (derives the two staff
# passwords, as every walk does). No password recovery. Never production.

name: staging · 4.1 Part 2, the hosted Auth probe (dispatch only)

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "The Golden School test school's slug (sekolah-uji-…)"
        type: string
        required: true
      kelas:
        description: "Its class that the synthetic learner joins, by the name /pendataan offers"
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: staging
  cancel-in-progress: false

env:
  STAGING_SUPABASE_PROJECT_REF: keijhmdtsgrfvnvocfvk
  PRODUCTION_SUPABASE_PROJECT_REF: trtlvibiybwixfumjrrx
  STAGING_ORIGIN: https://staging.pintarselalu.com
  OPERATOR_EMAIL: goldenschool+operator@pintarselalu.com

jobs:
  probe:
    name: one synthetic learner, locked and released, through the product
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: The school is a Golden School test school
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          printf '%s' "$SLUG" | grep -Eq '^sekolah-uji-[a-z0-9-]{1,30}$' || { echo "::error::«$SLUG» is not a sekolah-uji- school"; exit 1; }
      - name: Not while staging.yml runs; main's head is the dispatched commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/$1"; }
          for s in in_progress queued waiting requested pending; do
            n=$(api "actions/workflows/staging.yml/runs?status=$s&per_page=1" | python3 -c 'import json,sys; print(json.load(sys.stdin)["total_count"])')
            [ "$n" = "0" ] || { echo "::error::staging.yml is running: the probe does not start"; exit 1; }
          done
          head=$(api commits/main | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          [ "$head" = "$GITHUB_SHA" ] || { echo "::error::main's head is $head, not the dispatched commit $GITHUB_SHA"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Playwright (the audit harness's version)
        working-directory: audit/staging
        run: |
          npm init -y >/dev/null
          npm i --no-save --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Staging's public key (masked) and database URL (checked, never printed)
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [ "$STAGING_SUPABASE_PROJECT_REF" != "$PRODUCTION_SUPABASE_PROJECT_REF" ]
          case "$STAGING_SUPABASE_DB_URL" in *"$PRODUCTION_SUPABASE_PROJECT_REF"*) echo "::error::the database URL names production"; exit 1;; esac
          case "$STAGING_SUPABASE_DB_URL" in *"$STAGING_SUPABASE_PROJECT_REF"*) ;; *) echo "::error::the database URL does not name staging's project"; exit 1;; esac
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os, sys, urllib.request
          ref = os.environ['STAGING_SUPABASE_PROJECT_REF']
          req = urllib.request.Request(f'https://api.supabase.com/v1/projects/{ref}/api-keys?reveal=true',
                                       headers={'Authorization': 'Bearer ' + os.environ['STAGING_SUPABASE_ACCESS_TOKEN']})
          keys = json.load(urllib.request.urlopen(req, timeout=30))
          k = next(k['api_key'] for k in keys if k.get('name') == 'anon' and (k.get('api_key') or '').startswith('eyJ'))
          print('::add-mask::' + k, file=sys.stderr, flush=True)
          print(f'ANON_KEY={k}')
          print(f'SUPABASE_URL=https://{ref}.supabase.co')
          PY
      - name: The probe (P0 to P9; stops at the first difference)
        working-directory: audit/staging
        env:
          STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
          GS_MAILBOX_PASSWORD: ${{ secrets.GS_MAILBOX_PASSWORD }}
          GS_SLUG: ${{ inputs.slug }}
          GS_KELAS: ${{ inputs.kelas }}
          PROBE_BUILD: ${{ github.sha }}
          OUT_DIR: ${{ github.workspace }}/out
        run: node auth-probe-41.mjs
      # A kill cannot be caught by the script, so this runs whatever happened above: it READS any suspension this run
      # left open (its note carries "(run <last six digits>)") and the learner's state, prints them by id, and fails if a
      # suspension is open. Reinstating needs PA's session; a direct write is not allowed: the repair is the owner's.
      - name: Always - report what this run left
        if: always()
        env:
          STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          # it runs even when the checks above did not, so it checks again, before connecting, that the URL is staging's
          case "$STAGING_SUPABASE_DB_URL" in *"$PRODUCTION_SUPABASE_PROJECT_REF"*) echo "::error::the database URL names production: not connecting"; exit 1;; esac
          case "$STAGING_SUPABASE_DB_URL" in *"$STAGING_SUPABASE_PROJECT_REF"*) ;; *) echo "::error::the database URL does not name staging's project: not connecting"; exit 1;; esac
          db() { psql "$STAGING_SUPABASE_DB_URL" -qAtX -v ON_ERROR_STOP=1 -c "begin transaction read only" -c "$1" -c "commit"; }
          run6="${GITHUB_RUN_ID: -6}"
          nama="Sintetis Probe Auth $(printf '%s' "$run6" | tr '0123456789' 'abcdefghij')"
          db "select 'L ' || p.id || ': anonymised ' || (p.anonymized_at is not null) || ', account ' || (select count(*) from public.accounts a where a.person_id = p.id) || ', open suspensions ' || (select count(*) from public.person_suspensions s where s.person_id = p.id and s.ended_at is null) from public.persons p where p.display_name = '$nama' or p.id in (select person_id from public.person_suspensions where note like '%(run ${run6})%')" | grep -v '^BEGIN\|^COMMIT' || true
          open=$(db "select coalesce(string_agg(person_id::text, ' '), '') from public.person_suspensions where ended_at is null and note like '%(run ${run6})%'" | grep -v '^BEGIN\|^COMMIT')
          if [ -n "$open" ]; then echo "::error::suspension(s) this run left open, by person id: $open. Reinstating needs PA's session: the owner's"; exit 1; fi
          echo "no suspension of this run is left open"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: staging-auth-probe-41
          path: out/auth-probe-41.json
          if-no-files-found: ignore
          retention-days: 90
