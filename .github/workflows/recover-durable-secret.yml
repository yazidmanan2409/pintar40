# #150 WP-B (D-106(c) B5; closure plan A1, A4): ONE DURABLE SECRET, RECOVERED FROM ITS ESCROW INTO VERCEL.
#
# Only when Vercel has lost it. The escrow for the RECORDED fingerprint is read (C5, the reader), decrypted with one
# custodian's private key, which the custodian adds to the `production-recovery` environment for this run alone
# (RECOVERY_PRIVATE_KEY and its passphrase RECOVERY_KEY_PASSPHRASE) and removes afterwards; its fingerprint is checked;
# it is written to Vercel's production environment only where Vercel holds no value for it. A key rotation follows
# (closure plan A1). scripts/recovery/escrow.mjs does it; no value is printed. Dispatch only, from main; every run of the
# `production-recovery` environment is approved by the owner.

name: recover · one durable secret from its escrow

on:
  workflow_dispatch:
    inputs:
      name:
        type: choice
        options: [CARD_PEPPER, CERT_SECRET_KEY_V1]

permissions:
  contents: read

env:
  PRODUCTION_VERCEL_PROJECT_NAME: pintar40
  ESCROW_S3_REGION: ap-southeast-1

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    name: recover ${{ inputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-recovery
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/recovery
            scripts/release
            docs/recovery
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Recover ${{ inputs.name }}
        env:
          NAME: ${{ inputs.name }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ESCROW_S3_BUCKET: ${{ vars.PINTAR_BACKUP_BUCKET }}
          ESCROW_S3_KEY_ID: ${{ secrets.AWS_BACKUP_READER_KEY_ID }}
          ESCROW_S3_SECRET: ${{ secrets.AWS_BACKUP_READER_SECRET }}
          RECOVERY_PRIVATE_KEY: ${{ secrets.RECOVERY_PRIVATE_KEY }}
          RECOVERY_PASSPHRASE: ${{ secrets.RECOVERY_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          H=$(mktemp -d)
          trap 'gpgconf --homedir "$H" --kill all 2>/dev/null || true; rm -rf "$H"' EXIT
          printf '%s\n' "$RECOVERY_PRIVATE_KEY" | gpg --homedir "$H" --batch --import 2> /dev/null
          unset RECOVERY_PRIVATE_KEY
          RECOVERY_GNUPGHOME="$H" node scripts/recovery/escrow.mjs recover "$NAME"
