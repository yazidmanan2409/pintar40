# Does the GitHub secret PINTAR_SMTP_PASSWORD still open noreply@pintarselalu.com?
#
# staging.yml writes this secret into staging's Supabase Auth SMTP settings on
# every run, so a stale secret silently breaks staging's sign-in email at the
# next migration. This logs in once over TLS and quits: no email is sent, and
# the password is never printed. Runs on push of this file to the
# coordinator's branch, or by hand.

name: check · SMTP secret (login only, no send)

on:
  push:
    branches:
      - claude/awesome-rubin-bqxp6p
    paths:
      - .github/workflows/check-smtp-secret.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login:
    name: SMTP AUTH with PINTAR_SMTP_PASSWORD, then quit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Log in and quit
        env:
          PINTAR_SMTP_PASSWORD: ${{ secrets.PINTAR_SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, smtplib, ssl, sys
          pwd = os.environ.get('PINTAR_SMTP_PASSWORD', '')
          if not pwd:
              print('::error::PINTAR_SMTP_PASSWORD is missing or empty'); sys.exit(1)
          try:
              with smtplib.SMTP_SSL('pintarselalu.com', 465, context=ssl.create_default_context(), timeout=30) as s:
                  s.login('noreply@pintarselalu.com', pwd)
                  s.quit()
          except smtplib.SMTPAuthenticationError as e:
              print('::error::STALE: the mail server refused PINTAR_SMTP_PASSWORD for noreply@pintarselalu.com (%s)' % e.smtp_code)
              sys.exit(1)
          print('CURRENT: PINTAR_SMTP_PASSWORD opens noreply@pintarselalu.com (no email sent)')
          PY
