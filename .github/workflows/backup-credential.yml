# #150 WP-B (D-107(c), D-108(c)(3); closure plan A7): C2, pintar_backup's password: SET or REVOKE it. Nothing else.
#
#   set     the owner has put a new random password (32+ printable characters) in the `backup` environment's secret
#           (PRODUCTION_DB_BACKUP_PASSWORD or STAGING_DB_BACKUP_PASSWORD); this gives it to pintar_backup, sending the
#           database only its SCRAM-SHA-256 verifier, and proves it signs in, read-only by default.
#   revoke  IMMEDIATE: NOLOGIN and every open session of pintar_backup ended, then a sign-in shown refused. Backups fail
#           closed until a new password is set.
# scripts/recovery/credential.mjs does both; neither the password nor its verifier is ever printed. Dispatch only, from
# main; it runs where C2 lives (the `backup` environment) and uses the administrative connection the apply already has.

name: backup credential · set or revoke pintar_backup (C2)

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, production]
      action:
        type: choice
        options: [set, revoke]

permissions:
  contents: read

env:
  PRODUCTION_SUPABASE_PROJECT_REF: trtlvibiybwixfumjrrx
  PRODUCTION_POOLER_HOST: aws-0-ap-southeast-1.pooler.supabase.com

jobs:
  credential:
    if: github.ref == 'refs/heads/main'
    name: ${{ inputs.action }} pintar_backup on ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: backup
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/recovery
            scripts/release
            docs/recovery
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: ${{ inputs.action }}
        env:
          ACTION: ${{ inputs.action }}
          TARGET: ${{ inputs.target }}
          PROD_ADMIN_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
          STAGING_ADMIN_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
          PROD_BACKUP_PASSWORD: ${{ secrets.PRODUCTION_DB_BACKUP_PASSWORD }}
          STAGING_BACKUP_PASSWORD: ${{ secrets.STAGING_DB_BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = production ]; then
            export ADMIN_PGHOST="$PRODUCTION_POOLER_HOST" ADMIN_PGPORT=5432 ADMIN_PGUSER="postgres.$PRODUCTION_SUPABASE_PROJECT_REF" ADMIN_PGDATABASE=postgres
            export ADMIN_PGPASSWORD="$PROD_ADMIN_PASSWORD" ADMIN_PGSSLMODE=verify-full ADMIN_PGSSLROOTCERT=docs/recovery/supabase-root-2021-ca.crt
            export BACKUP_PASSWORD="$PROD_BACKUP_PASSWORD"
          else
            export ADMIN_DB_URL="$STAGING_ADMIN_URL" BACKUP_PASSWORD="$STAGING_BACKUP_PASSWORD"
          fi
          unset PROD_ADMIN_PASSWORD STAGING_ADMIN_URL PROD_BACKUP_PASSWORD STAGING_BACKUP_PASSWORD
          node scripts/recovery/credential.mjs "$ACTION"
