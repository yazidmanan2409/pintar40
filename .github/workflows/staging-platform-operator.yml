# STAGING ONLY. The staging Platform Operator (D-088(a), Yazid, 2 Oct): a platform-admin identity whose sign-in
# mail the automation can read (goldenschool+operator@, the staging test mailbox, read with GS_MAILBOX_PASSWORD),
# so the real-school journeys on staging do not wait on Yazid's own account. Runs audit/staging/platform-operator.mjs
# once per edit of .github/staging-platform-operator-request.txt on the coordinator's branch.
#
# The grant is made by staging's one recorded platform admin through PINTAR's own screens (Aktivasi → «Orang baru di
# luar pendataan», then Konfigurasi → Peran & akses), in a server-made session: SETUP on Yazid's authorisation,
# reported as such, never as a person's act. It ends by itself on OPERATOR_UNTIL. The operator then signs in like a
# person, with the real email link (ONE sign-in email; staging allows 30 an hour, D-092, shared with Yazid's own).
#
# NEVER: production (staging's ref and database URL are checked first; production's keys are never read); any direct
# write to the database (it is read in read-only transactions); any change to the product, its sign-in or settings.
# staging.yml checks on every run that the platform admins are the recorded person and, at most, this operator.

name: staging · Platform Operator (D-088(a))

on:
  push:
    branches:
      - claude/awesome-rubin-bqxp6p
    paths:
      - .github/staging-platform-operator-request.txt

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

env:
  STAGING_SUPABASE_PROJECT_REF: keijhmdtsgrfvnvocfvk
  PRODUCTION_SUPABASE_PROJECT_REF: trtlvibiybwixfumjrrx
  STAGING_ORIGIN: https://staging.pintarselalu.com
  ADMIN_SHA256: 52e5bbccb4be604c12b16dd38de06b0e1aa53f08d44f9356bb0759e0e47dd2a4
  OPERATOR_EMAIL: goldenschool+operator@pintarselalu.com
  OPERATOR_NAME: Operator Platform (staging)
  OPERATOR_UNTIL: "2026-12-31"

jobs:
  operator:
    name: the operator, granted by the recorded admin and signing in like a person
    # Batch 0 (B0-A): Playwright 1.55 has no browser build for ubuntu-latest = Ubuntu 26.04
    # («Playwright does not support chromium on ubuntu26.04-x64», run 41377378758); pinned to 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Playwright (the audit harness's version)
        working-directory: audit/staging
        run: |
          npm init -y >/dev/null
          npm i --no-save --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Staging's keys (masked) and database URL (checked, never printed)
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [ "$STAGING_SUPABASE_PROJECT_REF" != "$PRODUCTION_SUPABASE_PROJECT_REF" ]
          case "$STAGING_SUPABASE_DB_URL" in *"$PRODUCTION_SUPABASE_PROJECT_REF"*) echo "::error::the database URL names production"; exit 1;; esac
          case "$STAGING_SUPABASE_DB_URL" in *"$STAGING_SUPABASE_PROJECT_REF"*) echo "the database URL names staging's project";; *) echo "::error::the database URL does not name staging's project"; exit 1;; esac
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os, sys, urllib.request
          ref = os.environ['STAGING_SUPABASE_PROJECT_REF']
          req = urllib.request.Request(f'https://api.supabase.com/v1/projects/{ref}/api-keys?reveal=true',
                                       headers={'Authorization': 'Bearer ' + os.environ['STAGING_SUPABASE_ACCESS_TOKEN']})
          keys = json.load(urllib.request.urlopen(req, timeout=30))
          for name, var in (('service_role', 'SERVICE_KEY'), ('anon', 'ANON_KEY')):
              k = next(k['api_key'] for k in keys if k.get('name') == name and (k.get('api_key') or '').startswith('eyJ'))
              print('::add-mask::' + k, file=sys.stderr, flush=True)
              print(f'{var}={k}')
          print(f'SUPABASE_URL=https://{ref}.supabase.co')
          PY
      - name: The operator (setup grant by the recorded admin; the operator's own sign-in by email)
        working-directory: audit/staging
        env:
          STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
          GS_MAILBOX_PASSWORD: ${{ secrets.GS_MAILBOX_PASSWORD }}
          OUT_DIR: ${{ github.workspace }}/out
        run: node platform-operator.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: staging-platform-operator
          path: out/
          if-no-files-found: ignore
