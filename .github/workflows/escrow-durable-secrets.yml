# #150 WP-B (D-106(c) B5; closure plan A4; D-107 D8): CARD_PEPPER AND CERT_SECRET_KEY_V1, ESCROWED OUTSIDE VERCEL.
#
#   escrow  each durable secret production holds, ONLY when its fingerprint equals docs/recovery/durable-secrets.json's
#           record, encrypted to R1 and R2 (never R3) and uploaded to production/escrow/<NAME>/<fingerprint>.json.gpg with
#           an Object Lock legal hold: no expiry, no lifecycle rule (A4). Run once the fingerprints are recorded, and
#           again whenever a secret is deliberately rotated.
#   mint    the ONLY place a durable secret is minted, and only where G5's guard says MINT (an empty production): each
#           new value is escrowed FIRST and written to Vercel only once its escrow is uploaded. The production deploy
#           never mints (it stops on MINT and names this workflow).
# scripts/recovery/escrow.mjs does both; no value is printed. Dispatch only, from main, in the `escrow` environment
# (C4, the writer: put only). The first run is approved by the owner (O7).

name: escrow · the durable secrets, outside Vercel

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [escrow, mint]
        default: escrow

permissions:
  contents: read

env:
  PRODUCTION_SUPABASE_PROJECT_REF: trtlvibiybwixfumjrrx
  PRODUCTION_VERCEL_PROJECT_NAME: pintar40
  SUPABASE_URL: https://trtlvibiybwixfumjrrx.supabase.co
  ESCROW_S3_REGION: ap-southeast-1

jobs:
  escrow:
    if: github.ref == 'refs/heads/main'
    name: ${{ inputs.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: escrow
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/recovery
            scripts/release
            docs/recovery
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: (mint) the service-role key, taken and proven as the deploy takes it, for the guard's facts
        if: inputs.mode == 'mint'
        env:
          PRODUCTION_SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          KEYFILE="$RUNNER_TEMP/service-role-key"
          python3 - "$KEYFILE" <<'PY'
          import json, os, sys, urllib.request, urllib.error
          out = sys.argv[1]; ref = os.environ['PRODUCTION_SUPABASE_PROJECT_REF']; base = os.environ['SUPABASE_URL']
          req = urllib.request.Request(f"https://api.supabase.com/v1/projects/{ref}/api-keys?reveal=true",
                                       headers={'Authorization': f"Bearer {os.environ['PRODUCTION_SUPABASE_ACCESS_TOKEN']}", 'User-Agent': 'pintar-escrow'})
          try:
              with urllib.request.urlopen(req, timeout=30) as r: keys = json.load(r)
          except urllib.error.HTTPError as e:
              print(f"::error::the Management API refused to list the project's keys: HTTP {e.code}"); sys.exit(1)
          for k in keys:
              v = k.get('api_key') or ''
              if v: print(f"::add-mask::{v}")
          legacy = [k for k in keys if k.get('name') == 'service_role' and (k.get('api_key') or '').startswith('eyJ')]
          if not legacy: print("::error::no legacy service_role JWT is offered"); sys.exit(1)
          key = legacy[0]['api_key']
          req = urllib.request.Request(f"{base}/auth/v1/admin/users?per_page=1", headers={'apikey': key, 'Authorization': 'Bearer ' + key, 'User-Agent': 'pintar-escrow'})
          try:
              with urllib.request.urlopen(req, timeout=30) as r: code = r.status
          except urllib.error.HTTPError as e: code = e.code
          if code != 200: print("::error::the service-role key does not authenticate; nothing is minted"); sys.exit(1)
          open(out, 'w').write(key)
          PY
          echo "SERVICE_ROLE_KEY_FILE=$KEYFILE" >> "$GITHUB_ENV"
      - name: "(mint) G5's guard decides: MINT only into an empty production"
        if: inputs.mode == 'mint'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/release/durable-secrets.mjs guard docs/recovery/durable-secrets.json "$RUNNER_TEMP/durable-verdict"
      - name: ${{ inputs.mode }}
        env:
          MODE: ${{ inputs.mode }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ESCROW_RECIPIENTS: R1 R2   # D-109(c): both custodians' keys, never one alone
          ESCROW_S3_BUCKET: ${{ vars.PINTAR_BACKUP_BUCKET }}
          ESCROW_S3_KEY_ID: ${{ secrets.AWS_BACKUP_WRITER_KEY_ID }}
          ESCROW_S3_SECRET: ${{ secrets.AWS_BACKUP_WRITER_SECRET }}
        run: |
          set -euo pipefail
          if [ "$MODE" = mint ]; then node scripts/recovery/escrow.mjs mint "$RUNNER_TEMP/durable-verdict"
          else node scripts/recovery/escrow.mjs escrow; fi
