# READ-ONLY. Answers one question before §3b may even be considered: does
# the Auth identity the bootstrap would bind already exist?
#
# It lists users through the Supabase Admin API with the service-role key and
# compares each address, lower-cased, against a SHA-256 digest. The address
# itself is not in this repository and nothing identifying is printed: no
# email, no user id, no metadata. The output is the number of matching
# identities, the day each was created, and the total number of identities
# in the project. It writes nothing, creates nothing and consumes nothing.

name: verify · auth identity present (read only)

on:
  push:
    branches:
      - claude/quirky-meitner-a04smj
    paths:
      - .github/identity-request.txt
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_URL: https://trtlvibiybwixfumjrrx.supabase.co
  # sha256(lower(email)) of the identity §3b would bind
  TARGET_SHA256: 52e5bbccb4be604c12b16dd38de06b0e1aa53f08d44f9356bb0759e0e47dd2a4

jobs:
  verify:
    name: does the identity exist
    runs-on: ubuntu-latest
    steps:
      - name: List users (Admin API, GET only) and compare digests
        env:
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SERVICE_ROLE_KEY:-}" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY is not set"; exit 1; }
          python3 - <<'PY'
          import base64, hashlib, json, os, sys, urllib.request, urllib.error
          base = os.environ['SUPABASE_URL']; key = os.environ['SERVICE_ROLE_KEY'].strip()
          want = os.environ['TARGET_SHA256']; ref = base.split('//')[1].split('.')[0]

          # WHAT KIND OF KEY THIS IS -- shape and non-secret claims only, never
          # the value. Attempt 001 got 401 before comparing anything.
          if key.startswith('eyJ'):
              try:
                  seg = key.split('.')[1]; seg += '=' * (-len(seg) % 4)
                  claims = json.loads(base64.urlsafe_b64decode(seg))
                  print(f"key shape: JWT | role claim: {claims.get('role')} | ref matches this project: {claims.get('ref') == ref}")
              except Exception as e:
                  print(f"key shape: JWT-like but undecodable ({type(e).__name__})")
          elif key.startswith('sb_secret_'):
              print("key shape: sb_secret (new-style secret key)")
          else:
              print(f"key shape: unrecognised (starts with neither eyJ nor sb_secret_; length {len(key)})")

          def get(page, bearer):
              h = {'apikey': key, 'User-Agent': 'pintar-verify-identity'}
              if bearer: h['Authorization'] = 'Bearer ' + key
              req = urllib.request.Request(f"{base}/auth/v1/admin/users?page={page}&per_page=200", headers=h, method='GET')
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  body = e.read().decode(errors='replace')
                  try:
                      b = json.loads(body); why = b.get('error_code') or b.get('code') or b.get('error') or b.get('msg') or b.get('message')
                  except Exception:
                      why = body[:80]
                  return e.code, why

          mode = None
          for bearer in (True, False):
              code, body = get(1, bearer)
              print(f"GET admin/users with {'apikey + Bearer' if bearer else 'apikey only'} -> HTTP {code}" + ("" if code == 200 else f" ({body})"))
              if code == 200: mode = bearer; first = body; break
          if mode is None:
              print("::error::the Admin API refused both header forms; the identity question is unanswered, not negative")
              sys.exit(1)

          total = 0; hits = []; page = 1; users = first.get('users', [])
          while True:
              for u in users:
                  total += 1
                  e = (u.get('email') or '').strip().lower()
                  if e and hashlib.sha256(e.encode()).hexdigest() == want:
                      hits.append((u.get('created_at') or '')[:10])
              if len(users) < 200: break
              page += 1
              code, body = get(page, mode)
              if code != 200: print(f"::error::page {page} -> HTTP {code}"); sys.exit(1)
              users = body.get('users', [])
          print(f"identities in the project: {total}")
          print(f"identities matching the §3b target: {len(hits)}")
          for d in hits: print(f"  created on: {d}")
          if not hits: print("::warning::no Auth identity matches the §3b target")
          PY
