# Staging: which region PINTAR's server functions actually run in (BOB-18, D-046).
#
# WHY IT EXISTS
#   Both Supabase projects are in Singapore (ap-southeast-1). With no region in the repo,
#   Vercel ran the functions in its default US region: 344 of 406 calls in Yazid's session
#   crossed the Pacific, 277 ms each at the median against 19 ms from Singapore
#   (docs/coordination/perf/2026-09-27-staging-latency.md). vercel.json now sets
#   "regions": ["sin1"]. A config file is a claim, so this reads what the deployment does.
#
# WHAT IT DOES (read only: it deploys nothing, writes no setting, reads no secret value)
#   1. Vercel's record of the latest READY production deployment of pintar40-staging: its
#      commit and the regions it was deployed to.
#   2. Three dynamic requests to STAGING_ORIGIN (/masuk renders per request). Each answer's
#      x-vercel-id names the edge that took it and the region of the function that ran it
#      ("<edge>::<function region>::<id>"). Every function region must be sin1.
#
# WHEN IT RUNS
#   By hand, after a merge to main has deployed to staging.
name: staging · function region

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  STAGING_VERCEL_PROJECT_NAME: pintar40-staging
  STAGING_ORIGIN: https://staging.pintarselalu.com
  EXPECTED_REGION: sin1

jobs:
  region:
    name: where the functions run
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The deployment's regions, and the region that answers
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request
          tok = os.environ.get('VERCEL_TOKEN', ''); proj = os.environ['STAGING_VERCEL_PROJECT_NAME']
          origin = os.environ['STAGING_ORIGIN'].rstrip('/'); want = os.environ['EXPECTED_REGION']
          if proj != 'pintar40-staging':
              print('::error::this workflow only reads pintar40-staging'); sys.exit(1)
          summary = open(os.environ['GITHUB_STEP_SUMMARY'], 'a')
          def say(s): print(s); summary.write(s + '\n')
          bad = False

          # 1. what Vercel recorded
          if tok:
              def api(path):
                  req = urllib.request.Request('https://api.vercel.com' + path, headers={'Authorization': 'Bearer ' + tok})
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r: return r.status, json.load(r)
                  except urllib.error.HTTPError as e:
                      return e.code, {}
              code, p = api(f'/v9/projects/{proj}')
              if code == 200:
                  code, ds = api(f'/v6/deployments?projectId={p["id"]}&target=production&state=READY&limit=1')
                  if code == 200 and ds.get('deployments'):
                      uid = ds['deployments'][0]['uid']
                      code, d = api(f'/v13/deployments/{uid}')
                      sha = ((d.get('meta') or {}).get('githubCommitSha') or '?')[:7]
                      say(f'- latest READY deployment {uid} (commit {sha}): regions {d.get("regions")}')
                      if d.get('regions') != [want]:
                          say(f'::error::the deployment is recorded in {d.get("regions")}, not [{want}]'); bad = True
              else:
                  say(f'- Vercel project record: HTTP {code} (the answers below still decide)')
          else:
              say('- no VERCEL_TOKEN: the deployment record is not read; the answers below still decide')

          # 2. what answers
          regions = []
          for i in range(3):
              req = urllib.request.Request(f'{origin}/masuk?r={i}', headers={'Cache-Control': 'no-cache'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r: status, vid = r.status, r.headers.get('x-vercel-id', '')
              except urllib.error.HTTPError as e:
                  status, vid = e.code, e.headers.get('x-vercel-id', '')
              parts = [x for x in vid.split('::') if x]
              fn = parts[-2] if len(parts) >= 3 else None
              regions.append(fn)
              say(f'- GET /masuk → {status}; x-vercel-id {vid or "(none)"}; function region {fn or "(not named)"}')
          if not regions or any(r != want for r in regions):
              say(f'::error::the functions answered from {regions}, not {want}'); bad = True
          else:
              say(f'- every answer ran in {want}')
          sys.exit(1 if bad else 0)
          PY
