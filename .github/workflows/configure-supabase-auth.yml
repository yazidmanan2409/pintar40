# PINTAR production boundary — Supabase Auth configuration.
#
# SCOPE. This workflow writes exactly two Auth settings on the hosted project
# and proves they landed. It deploys nothing, builds nothing, changes no
# application code, no migration, no RLS, no Vercel setting, and it never
# touches an identity. It does not bootstrap and it does not consume the
# day-zero marker.
#
# THE LESSON FROM THE VERCEL INCIDENT IS THE DESIGN HERE. `vercel env add`
# returned success and stored nothing, and a `curl -L` status code reported a
# login page as the application. So: a 2xx from the write is not evidence.
# The configuration is written, then READ BACK in a separate request, and the
# read-back is asserted field by field against the canonical values. Anything
# else fails closed, before the functional check runs.

name: boundary · supabase auth production configuration

on:
  push:
    branches:
      - claude/quirky-meitner-a04smj
    paths:
      - .github/auth-request.txt
  workflow_dispatch:

concurrency:
  group: supabase-auth-configuration
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_SHA: 46fd4452ebc7b861abb5cb9b1963178088b978a7
  PROJECT_REF: trtlvibiybwixfumjrrx
  APP_ORIGIN: https://app.pintarselalu.com
  # Canonical, and deliberately the ONLY entry. The frozen application sends
  # emailRedirectTo = ${origin}/auth/callback?lanjut=..., which this covers;
  # nothing else is guessed, and no development origin survives as a
  # production substitute.
  REDIRECT_ALLOW: https://app.pintarselalu.com/auth/callback*

jobs:
  configure:
    name: write, read back, assert
    runs-on: ubuntu-latest
    steps:
      - name: Preflight — the management credential must exist
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::repository secret SUPABASE_ACCESS_TOKEN is not set. Supabase Auth cannot be configured without it. No substitute credential will be used."
            exit 1
          fi
          echo "management credential is present (value never printed)"

      - name: Preflight — the canonical origin serves PINTAR
        run: |
          set -euo pipefail
          for P in /masuk /auth/callback; do
            CODE=$(curl -sS -o /tmp/b.txt -D /tmp/h.txt -w '%{http_code}' "${APP_ORIGIN}${P}")
            ERR=$(grep -i '^x-vercel-error:' /tmp/h.txt | tr -d '\r' || true)
            if grep -qE 'pin-masuk|pin-auth' /tmp/b.txt; then MARK=yes; else MARK=no; fi
            echo "GET ${APP_ORIGIN}${P} -> status=$CODE marker=$MARK ${ERR:-}"
            test "$CODE" = "200" && test "$MARK" = "yes" && test -z "$ERR" || {
              echo "::error::${APP_ORIGIN}${P} does not serve PINTAR"; head -c 300 /tmp/b.txt; exit 1; }
          done
          echo "the canonical origin serves the sign-in screen and the callback route"

      - name: Preflight — Auth configuration BEFORE
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o /tmp/before.json -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth")
          test "$CODE" = "200" || { echo "::error::could not read Auth config (HTTP $CODE)"; cat /tmp/before.json; exit 1; }
          python3 -c "
          import json,os
          d=json.load(open('/tmp/before.json'))
          site=d.get('site_url'); allow=d.get('uri_allow_list')
          print('site_url BEFORE:      ', repr(site))
          print('uri_allow_list BEFORE:', repr(allow))
          want_site=os.environ['APP_ORIGIN']; want_allow=os.environ['REDIRECT_ALLOW']
          already = (site==want_site and allow==want_allow)
          print('already production-configured:', already)
          open('/tmp/already.txt','w').write('yes' if already else 'no')
          "
          echo "ALREADY=$(cat /tmp/already.txt)" >> "$GITHUB_ENV"

      - name: Write the production Auth configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 -c "
          import json,os
          print(json.dumps({'site_url': os.environ['APP_ORIGIN'],
                            'uri_allow_list': os.environ['REDIRECT_ALLOW']}))
          " > /tmp/body.json
          echo "writing: $(cat /tmp/body.json)"
          CODE=$(curl -sS -o /tmp/write.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' --data-binary @/tmp/body.json \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth")
          echo "PATCH -> HTTP $CODE"
          test "$CODE" = "200" || { echo "::error::Auth write failed"; cat /tmp/write.json; exit 1; }
          echo "the API reported success — which on its own proves nothing; see the read-back"

      # A SEPARATE REQUEST, NOT THE WRITE'S OWN RESPONSE. The write could echo
      # back what it was handed and still have stored nothing; that is exactly
      # how the missing anon key passed unnoticed on Vercel.
      - name: Read back independently and assert
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          sleep 5
          CODE=$(curl -sS -o /tmp/after.json -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth")
          test "$CODE" = "200" || { echo "::error::read-back failed (HTTP $CODE)"; exit 1; }
          python3 -c "
          import json,os,sys
          d=json.load(open('/tmp/after.json'))
          site=d.get('site_url'); allow=d.get('uri_allow_list')
          want_site=os.environ['APP_ORIGIN']; want_allow=os.environ['REDIRECT_ALLOW']
          print('site_url AFTER:      ', repr(site))
          print('uri_allow_list AFTER:', repr(allow))
          bad=[]
          if site!=want_site: bad.append('site_url is %r, expected %r'%(site,want_site))
          if allow!=want_allow: bad.append('uri_allow_list is %r, expected %r'%(allow,want_allow))
          low=(allow or '').lower()
          for f in ('localhost','127.0.0.1','0.0.0.0'):
              if f in low: bad.append('a development origin survives in uri_allow_list: %r'%f)
          if bad:
              print('::error::read-back does not match the canonical configuration')
              [print('  -',b) for b in bad]
              sys.exit(1)
          print('read-back matches the canonical production configuration exactly')
          "

      - name: Functional — application and Auth agree on the origin
        run: |
          set -euo pipefail
          # The callback route is fetched at the exact origin now present in
          # Supabase's allow-list. It is requested WITHOUT a code, so it
          # renders its own "link expired" state: no session is created, no
          # token is issued, and nothing is consumed.
          URL="${APP_ORIGIN}/auth/callback"
          CODE=$(curl -sS -o /tmp/cb.txt -D /tmp/cbh.txt -w '%{http_code}' "$URL")
          ERR=$(grep -i '^x-vercel-error:' /tmp/cbh.txt | tr -d '\r' || true)
          if grep -qE 'pin-auth|pin-masuk' /tmp/cb.txt; then MARK=yes; else MARK=no; fi
          echo "GET $URL -> status=$CODE marker=$MARK ${ERR:-}"
          test "$CODE" = "200" && test "$MARK" = "yes" && test -z "$ERR" || {
            echo "::error::the callback route does not serve PINTAR at the configured origin"; exit 1; }
          echo "the redirect target in Supabase's allow-list is served by the frozen application"

      - name: Summary
        run: |
          echo "release:        $RELEASE_SHA"
          echo "project:        $PROJECT_REF"
          echo "site_url:       $APP_ORIGIN"
          echo "redirect allow: $REDIRECT_ALLOW"
          echo "was already configured before this run: ${ALREADY:-unknown}"
          echo "NOT done: bootstrap, platform_environment transition, onboarding."
