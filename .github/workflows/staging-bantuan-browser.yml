# STAGING ONLY. The assistance check and the offline notice, seen in a real browser (owner ruling, 2 Oct: option A
# and «Tutup»; the event-driven check on main since 7d84637). One synthetic learner of «Kelas Uji Kinerja A» sits the
# class's latest chapter in Chromium with every request recorded: the help offer against the server's own due point,
# «Tutup», a real offline, PINTAR unreachable while the browser is online, the recovery check, and the saves. Runs
# audit/staging/bantuan-browser.mjs once per edit of .github/staging-bantuan-browser-request.txt on the coordinator's
# branch.
#
# NEVER: production (staging's ref and database URL are checked first; production's keys are never read); any direct
# write to the database (it is read in read-only transactions; every write is the learner's press in the page). The
# learner's session is made on the server (SETUP, as the L1 browser harness): it is not a person's sign-in.

name: staging · assistance and offline, in a real browser

on:
  push:
    branches:
      - claude/awesome-rubin-bqxp6p
    paths:
      - .github/staging-bantuan-browser-request.txt

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

env:
  STAGING_SUPABASE_PROJECT_REF: keijhmdtsgrfvnvocfvk
  PRODUCTION_SUPABASE_PROJECT_REF: trtlvibiybwixfumjrrx
  STAGING_ORIGIN: https://staging.pintarselalu.com

jobs:
  bantuan:
    name: one learner, in Chromium, with every request recorded
    # Batch 0 (B0-A): Playwright 1.55 has no browser build for ubuntu-latest = Ubuntu 26.04
    # («Playwright does not support chromium on ubuntu26.04-x64», run 41377378758); pinned to 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Playwright (the audit harness's version)
        working-directory: audit/staging
        run: |
          npm init -y >/dev/null
          npm i --no-save --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Staging's keys (masked) and database URL (checked, never printed)
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [ "$STAGING_SUPABASE_PROJECT_REF" != "$PRODUCTION_SUPABASE_PROJECT_REF" ]
          case "$STAGING_SUPABASE_DB_URL" in *"$PRODUCTION_SUPABASE_PROJECT_REF"*) echo "::error::the database URL names production"; exit 1;; esac
          case "$STAGING_SUPABASE_DB_URL" in *"$STAGING_SUPABASE_PROJECT_REF"*) echo "the database URL names staging's project";; *) echo "::error::the database URL does not name staging's project"; exit 1;; esac
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os, sys, urllib.request
          ref = os.environ['STAGING_SUPABASE_PROJECT_REF']
          req = urllib.request.Request(f'https://api.supabase.com/v1/projects/{ref}/api-keys?reveal=true',
                                       headers={'Authorization': 'Bearer ' + os.environ['STAGING_SUPABASE_ACCESS_TOKEN']})
          keys = json.load(urllib.request.urlopen(req, timeout=30))
          for name, var in (('service_role', 'SERVICE_KEY'), ('anon', 'ANON_KEY')):
              k = next(k['api_key'] for k in keys if k.get('name') == name and (k.get('api_key') or '').startswith('eyJ'))
              print('::add-mask::' + k, file=sys.stderr, flush=True)
              print(f'{var}={k}')
          print(f'SUPABASE_URL=https://{ref}.supabase.co')
          PY
      - name: The assistance check and the offline notice, in a real browser
        working-directory: audit/staging
        env:
          STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
          OUT_DIR: ${{ github.workspace }}/out
        run: node bantuan-browser.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: staging-bantuan-browser
          path: out/
          if-no-files-found: ignore
