# Read-only credential identification (credential incident, 24 Sep).
#
# WHY IT EXISTS
#   A GitHub secret was overwritten by mistake while staging's Supabase token
#   was being set up, so the secret NAMES can no longer be trusted to say what
#   they hold. This workflow identifies each credential by what it can
#   actually reach, never by its name.
#
# WHAT IT DOES (GET requests only)
#   For PRODUCTION_SUPABASE_ACCESS_TOKEN and STAGING_SUPABASE_ACCESS_TOKEN it
#   prints the token's kind (scoped or classic), an 8-character SHA-256
#   fingerprint, whether it is a new token (not one of the fingerprints seen
#   on 24 Sep), and the HTTP status of read-only calls against the production,
#   staging and 11-Sep projects: project settings, sign-in (auth) settings,
#   API keys, and API keys revealed. A job FAILS unless its token reaches its
#   own environment and nothing else. The two are probed three minutes apart,
#   so the "Last used" column on the Supabase access-token page shows which
#   named token sits in which secret. The other secrets are checked for
#   presence and shape only; the Vercel token makes read-only calls.
#
# WHAT IT NEVER DOES
#   No PATCH, POST, PUT or DELETE to any service. It deploys nothing, writes
#   no configuration, changes no secret, and opens no database connection.
#   Response bodies that could hold keys are discarded unread (-o /dev/null);
#   no value is printed. Passwords get no fingerprint.
#
# WHEN IT RUNS
#   By hand only.
name: audit · identify credentials (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identify-credentials
  cancel-in-progress: false

env:
  PRODUCTION_SUPABASE_PROJECT_REF: trtlvibiybwixfumjrrx
  STAGING_SUPABASE_PROJECT_REF: keijhmdtsgrfvnvocfvk
  SEP11_SUPABASE_PROJECT_REF: sknixmwkynzmrgbxzrvb
  # tokens seen in GitHub before the new ones were installed (run 35983254829):
  # 4b204b7d (was under SUPABASE_ACCESS_TOKEN), ca21bf52 (the old staging one)
  EARLIER_SUPABASE_TOKEN_FINGERPRINTS: "4b204b7d ca21bf52"
  PRODUCTION_VERCEL_PROJECT_NAME: pintar40
  STAGING_VERCEL_PROJECT_NAME: pintar40-staging

jobs:
  first:
    name: "1 of 3 · PRODUCTION_SUPABASE_ACCESS_TOKEN (must reach production only)"
    runs-on: ubuntu-latest
    steps:
      - name: Identify by reach (GET only)
        env:
          LABEL: PRODUCTION_SUPABASE_ACCESS_TOKEN
          EXPECT: PRODUCTION
          TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          echo "probed at $(date -u +%Y-%m-%dT%H:%M:%SZ) UTC; expected to reach $EXPECT only"
          {
            echo "| Secret | Kind | Fingerprint | New token | pintar-production | pintar-staging | 11-Sep project | Verdict | Result |"
            echo "|---|---|---|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::$LABEL is not set"
            echo "| \`$LABEL\` | absent | | | | | | ABSENT | **FAIL** |" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          case "$TOKEN" in sbp_fc*) kind=scoped;; sbp_*) kind=classic;; *) kind=unrecognised;; esac
          fp=$(printf %s "$TOKEN" | sha256sum | cut -c1-8)
          new=yes; for old in $EARLIER_SUPABASE_TOKEN_FINGERPRINTS; do [ "$fp" = "$old" ] && new="no, same as $old"; done
          echo "$LABEL: $kind, fingerprint $fp, new token: $new"
          # GET only; bodies are discarded unread, so no key can reach the log
          get() { curl -s -o /dev/null -w '%{http_code}' --max-time 30 -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1$1"; }
          cap() {  # $1 = environment, $2 = project ref; sets R (yes/no) and D (the four statuses)
            p=$(get "/projects/$2"); a=$(get "/projects/$2/config/auth"); k=$(get "/projects/$2/api-keys"); r=$(get "/projects/$2/api-keys?reveal=true")
            printf '  %-10s project settings %s   auth settings %s   api keys %s   api keys revealed %s\n' "$1" "$p" "$a" "$k" "$r"
            case "$p$a$k$r" in *200*) R=yes;; *) R=no;; esac
            D="settings $p, auth $a, keys $k, revealed $r"
          }
          cap production "$PRODUCTION_SUPABASE_PROJECT_REF"; prod=$R; prodd=$D
          cap staging "$STAGING_SUPABASE_PROJECT_REF"; stag=$R; stagd=$D
          cap 11-Sep "$SEP11_SUPABASE_PROJECT_REF"; sep=$R; sepd=$D
          echo "  account-wide: list projects $(get /projects)   list organizations $(get /organizations)"
          case "$prod$stag" in yesno) v=PRODUCTION;; noyes) v=STAGING;; yesyes) v=BOTH;; *) v=NEITHER;; esac
          result=PASS; why=""
          [ "$v" = "$EXPECT" ] || { result=FAIL; why="$why reaches $v, expected $EXPECT only;"; }
          [ "$sep" = no ] || { result=FAIL; why="$why also reaches the 11-Sep project;"; }
          [ "$new" = yes ] || { result=FAIL; why="$why not a new token ($new);"; }
          echo "VERDICT for $LABEL: $v (production: $prod; staging: $stag; 11-Sep: $sep) -> $result${why:+:$why}"
          echo "| \`$LABEL\` | $kind | \`$fp\` | $new | $prodd | $stagd | $sepd | $v | **$result** |" >> "$GITHUB_STEP_SUMMARY"
          [ "$result" = PASS ] || { echo "::error::$LABEL:$why"; exit 1; }

  second:
    name: "2 of 3 · STAGING_SUPABASE_ACCESS_TOKEN (must reach staging only; 3 minutes later)"
    needs: first
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait three minutes, so the two tokens' "Last used" times differ
        run: sleep 180
      - name: Identify by reach (GET only)
        env:
          LABEL: STAGING_SUPABASE_ACCESS_TOKEN
          EXPECT: STAGING
          TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          echo "probed at $(date -u +%Y-%m-%dT%H:%M:%SZ) UTC; expected to reach $EXPECT only"
          {
            echo "| Secret | Kind | Fingerprint | New token | pintar-production | pintar-staging | 11-Sep project | Verdict | Result |"
            echo "|---|---|---|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::$LABEL is not set"
            echo "| \`$LABEL\` | absent | | | | | | ABSENT | **FAIL** |" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          case "$TOKEN" in sbp_fc*) kind=scoped;; sbp_*) kind=classic;; *) kind=unrecognised;; esac
          fp=$(printf %s "$TOKEN" | sha256sum | cut -c1-8)
          new=yes; for old in $EARLIER_SUPABASE_TOKEN_FINGERPRINTS; do [ "$fp" = "$old" ] && new="no, same as $old"; done
          echo "$LABEL: $kind, fingerprint $fp, new token: $new"
          # GET only; bodies are discarded unread, so no key can reach the log
          get() { curl -s -o /dev/null -w '%{http_code}' --max-time 30 -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1$1"; }
          cap() {  # $1 = environment, $2 = project ref; sets R (yes/no) and D (the four statuses)
            p=$(get "/projects/$2"); a=$(get "/projects/$2/config/auth"); k=$(get "/projects/$2/api-keys"); r=$(get "/projects/$2/api-keys?reveal=true")
            printf '  %-10s project settings %s   auth settings %s   api keys %s   api keys revealed %s\n' "$1" "$p" "$a" "$k" "$r"
            case "$p$a$k$r" in *200*) R=yes;; *) R=no;; esac
            D="settings $p, auth $a, keys $k, revealed $r"
          }
          cap production "$PRODUCTION_SUPABASE_PROJECT_REF"; prod=$R; prodd=$D
          cap staging "$STAGING_SUPABASE_PROJECT_REF"; stag=$R; stagd=$D
          cap 11-Sep "$SEP11_SUPABASE_PROJECT_REF"; sep=$R; sepd=$D
          echo "  account-wide: list projects $(get /projects)   list organizations $(get /organizations)"
          case "$prod$stag" in yesno) v=PRODUCTION;; noyes) v=STAGING;; yesyes) v=BOTH;; *) v=NEITHER;; esac
          result=PASS; why=""
          [ "$v" = "$EXPECT" ] || { result=FAIL; why="$why reaches $v, expected $EXPECT only;"; }
          [ "$sep" = no ] || { result=FAIL; why="$why also reaches the 11-Sep project;"; }
          [ "$new" = yes ] || { result=FAIL; why="$why not a new token ($new);"; }
          echo "VERDICT for $LABEL: $v (production: $prod; staging: $stag; 11-Sep: $sep) -> $result${why:+:$why}"
          echo "| \`$LABEL\` | $kind | \`$fp\` | $new | $prodd | $stagd | $sepd | $v | **$result** |" >> "$GITHUB_STEP_SUMMARY"
          [ "$result" = PASS ] || { echo "::error::$LABEL:$why"; exit 1; }

  others:
    name: "3 of 3 · the other secrets (presence and shape; Vercel reach, GET only)"
    needs: second
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Presence and shape
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROD_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
          PINTAR_SMTP_PASSWORD: ${{ secrets.PINTAR_SMTP_PASSWORD }}
          STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -uo pipefail
          {
            echo ""
            echo "| Secret | Present | What it names or reaches |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          pres() { [ -n "${!1:-}" ] && echo yes || echo no; }
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then o=$(printf %s "$SUPABASE_ACCESS_TOKEN" | sha256sum | cut -c1-8); else o=absent; fi
          echo "SUPABASE_ACCESS_TOKEN (old generic name): fingerprint $o (not used: no calls are made with it)"
          echo "| \`SUPABASE_ACCESS_TOKEN\` (old name) | $(pres SUPABASE_ACCESS_TOKEN) | fingerprint \`$o\`; not used by this check |" >> "$GITHUB_STEP_SUMMARY"
          echo "SUPABASE_PROD_DB_PASSWORD: present $(pres SUPABASE_PROD_DB_PASSWORD) (a password: no fingerprint, not used)"
          echo "| \`SUPABASE_PROD_DB_PASSWORD\` | $(pres SUPABASE_PROD_DB_PASSWORD) | a password; not used by this check |" >> "$GITHUB_STEP_SUMMARY"
          echo "PINTAR_SMTP_PASSWORD: present $(pres PINTAR_SMTP_PASSWORD) (a password: no fingerprint, not used)"
          echo "| \`PINTAR_SMTP_PASSWORD\` | $(pres PINTAR_SMTP_PASSWORD) | a password; not used by this check |" >> "$GITHUB_STEP_SUMMARY"
          names=none
          case "${STAGING_SUPABASE_DB_URL:-}" in
            *"$PRODUCTION_SUPABASE_PROJECT_REF"*) names=PRODUCTION;;
            *"$STAGING_SUPABASE_PROJECT_REF"*) names=STAGING;;
            *"$SEP11_SUPABASE_PROJECT_REF"*) names=11-Sep;;
          esac
          echo "STAGING_SUPABASE_DB_URL: present $(pres STAGING_SUPABASE_DB_URL), names the $names project (no connection is made)"
          echo "| \`STAGING_SUPABASE_DB_URL\` | $(pres STAGING_SUPABASE_DB_URL) | names the **$names** project (no connection made) |" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            fp=$(printf %s "$VERCEL_TOKEN" | sha256sum | cut -c1-8)
            vget() { curl -s -o /dev/null -w '%{http_code}' --max-time 30 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com$1"; }
            vp=$(vget "/v9/projects/$PRODUCTION_VERCEL_PROJECT_NAME"); vs=$(vget "/v9/projects/$STAGING_VERCEL_PROJECT_NAME")
            echo "VERCEL_TOKEN: fingerprint $fp; project $PRODUCTION_VERCEL_PROJECT_NAME HTTP $vp; project $STAGING_VERCEL_PROJECT_NAME HTTP $vs"
            echo "| \`VERCEL_TOKEN\` | yes | fingerprint \`$fp\`; reads production project: HTTP $vp; reads staging project: HTTP $vs |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "VERCEL_TOKEN: ABSENT"; echo "| \`VERCEL_TOKEN\` | no | |" >> "$GITHUB_STEP_SUMMARY"
          fi
