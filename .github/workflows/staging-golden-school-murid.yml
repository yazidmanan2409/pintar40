# STAGING ONLY. The Golden School's students (docs/recovery/GOLDEN-SCHOOL-CONTRACT.md §5), after the admin walk
# (staging-golden-school-admin.yml) has the published chapter given to the class (GS-11). In ONE run: the school admin
# signs in by the real email link and makes the class's cards as a printable class set on Aktivasi (GS-07's second
# half); the primary student signs in with their card, sits the Pemetaan Awal, reads every lesson and sits the Uji
# Penguasaan by clicking (GS-12 to GS-15); the four others sit both tests (GS-16); the results are read back.
# A card's PIN is shown once and main has no re-issue (GS-21), so the cards are made and used in this run and never
# kept. Runs audit/staging/golden-school-murid.mjs once per edit of .github/staging-golden-school-murid-request.txt on
# the coordinator's branch; the request's last line names the school's slug ("slug: <slug>").
#
# NEVER: production (staging's ref and database URL are checked first; production's keys are never read); any direct
# write to the database (it is read in read-only transactions); any change to the product, its sign-in or settings.

name: staging · Golden School, the students (GS-07 cards, GS-12 to GS-16)

on:
  push:
    branches:
      - claude/awesome-rubin-bqxp6p
    paths:
      - .github/staging-golden-school-murid-request.txt

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

env:
  STAGING_SUPABASE_PROJECT_REF: keijhmdtsgrfvnvocfvk
  PRODUCTION_SUPABASE_PROJECT_REF: trtlvibiybwixfumjrrx
  STAGING_ORIGIN: https://staging.pintarselalu.com

jobs:
  students:
    name: the class's cards, then the students sign in with them and sit the chapter
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The school named by the request
        run: |
          set -euo pipefail
          slug=$(tail -n 1 .github/staging-golden-school-murid-request.txt | sed -n 's/^slug: *\([a-z0-9][a-z0-9-]*\) *$/\1/p')
          [ -n "$slug" ] || { echo "::error::the request's last line is not 'slug: <slug>'"; exit 1; }
          echo "GS_SLUG=$slug" >> "$GITHUB_ENV"
          echo "school: $slug"
      - name: Playwright (the audit harness's version)
        working-directory: audit/staging
        run: |
          npm init -y >/dev/null
          npm i --no-save --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Staging's keys (masked) and database URL (checked, never printed)
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [ "$STAGING_SUPABASE_PROJECT_REF" != "$PRODUCTION_SUPABASE_PROJECT_REF" ]
          case "$STAGING_SUPABASE_DB_URL" in *"$PRODUCTION_SUPABASE_PROJECT_REF"*) echo "::error::the database URL names production"; exit 1;; esac
          case "$STAGING_SUPABASE_DB_URL" in *"$STAGING_SUPABASE_PROJECT_REF"*) echo "the database URL names staging's project";; *) echo "::error::the database URL does not name staging's project"; exit 1;; esac
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os, sys, urllib.request
          ref = os.environ['STAGING_SUPABASE_PROJECT_REF']
          req = urllib.request.Request(f'https://api.supabase.com/v1/projects/{ref}/api-keys?reveal=true',
                                       headers={'Authorization': 'Bearer ' + os.environ['STAGING_SUPABASE_ACCESS_TOKEN']})
          keys = json.load(urllib.request.urlopen(req, timeout=30))
          for name, var in (('service_role', 'SERVICE_KEY'), ('anon', 'ANON_KEY')):
              k = next(k['api_key'] for k in keys if k.get('name') == name and (k.get('api_key') or '').startswith('eyJ'))
              print('::add-mask::' + k, file=sys.stderr, flush=True)
              print(f'{var}={k}')
          print(f'SUPABASE_URL=https://{ref}.supabase.co')
          PY
      - name: The students (cards made and used in this run; every write a press of PINTAR's buttons)
        working-directory: audit/staging
        env:
          STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
          GS_MAILBOX_PASSWORD: ${{ secrets.GS_MAILBOX_PASSWORD }}
          OUT_DIR: ${{ github.workspace }}/out
        run: node golden-school-murid.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: staging-golden-school-murid
          path: out/
          if-no-files-found: ignore
