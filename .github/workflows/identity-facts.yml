name: "identity · Gate 0 facts (read-only)"

# Gate 0 of the identity work (D-058): the facts that cannot be read from the
# repository. READ-ONLY. Nothing is written to Supabase, Vercel or DNS.
#
# - Supabase Auth settings for staging and production: only an allow-list of
#   non-secret keys is printed. Email template bodies are never printed, only
#   their length, a short hash and which placeholders they carry, so that
#   "default or edited" can be decided.
# - The mail domain's public records (SPF, DMARC, DKIM, MX) through `dig` on
#   the runner (the coordinator's sandbox cannot resolve them: egress 403).
#
# The production read runs only from main (D-004).
#
# BOB-26 (D-079 addendum): each project's Gate 3 Auth settings are also compared
# with the ONE canonical source, supabase/auth-identitas.json. Staging FAILS on
# any difference. Production fails once the file's production_applied is true
# (the release commit, C-11), and until then reports its differences only.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  STAGING_SUPABASE_PROJECT_REF: keijhmdtsgrfvnvocfvk
  PRODUCTION_SUPABASE_PROJECT_REF: trtlvibiybwixfumjrrx

jobs:
  auth-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Staging Gate 3 settings against supabase/auth-identitas.json (BOB-26)
        env:
          REF: ${{ env.STAGING_SUPABASE_PROJECT_REF }}
          TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS -f -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/$REF/config/auth" > /tmp/auth.json
          python3 scripts/auth-identitas-banding.py /tmp/auth.json staging
          rm -f /tmp/auth.json
      - name: Staging Auth settings (allow-listed, non-secret)
        env:
          REF: ${{ env.STAGING_SUPABASE_PROJECT_REF }}
          TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          req = urllib.request.Request(f"https://api.supabase.com/v1/projects/{os.environ['REF']}/config/auth",
                                       headers={"Authorization": "Bearer " + os.environ["TOKEN"]})
          d = json.load(urllib.request.urlopen(req, timeout=30))
          PREFIXES = ("password_", "mailer_", "sessions_", "rate_limit_", "smtp_", "security_", "refresh_token_",
                      "mfa_", "external_email_enabled", "disable_signup", "site_url", "uri_allow_list", "jwt_exp")
          SECRET = ("secret", "_key", "hmac", "token_hash")
          for k in sorted(d):
              if not k.startswith(PREFIXES):
                  continue
              v = d.get(k)
              if k.endswith("_content"):
                  s = v or ""
                  print(f"{k:58} len={len(s)} sha256={hashlib.sha256(s.encode()).hexdigest()[:12]}"
                        f" token={'{{ .Token }}' in s} link={'ConfirmationURL' in s} says_supabase={'supabase' in s.lower()}")
                  continue
              if k == "smtp_pass" or any(x in k for x in SECRET) and not isinstance(v, bool):
                  print(f"{k:58} <present: {v is not None and v != ''}>")
                  continue
              print(f"{k:58} {v!r}")
          PY

  auth-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Production Gate 3 settings against supabase/auth-identitas.json (BOB-26)
        env:
          REF: ${{ env.PRODUCTION_SUPABASE_PROJECT_REF }}
          TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS -f -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/$REF/config/auth" > /tmp/auth.json
          if python3 -c "import json,sys;sys.exit(0 if json.load(open('supabase/auth-identitas.json'))['production_applied'] else 1)"; then
            python3 scripts/auth-identitas-banding.py /tmp/auth.json production
          else
            python3 scripts/auth-identitas-banding.py /tmp/auth.json production --report-only
          fi
          rm -f /tmp/auth.json
      - name: Production Auth settings (allow-listed, non-secret)
        env:
          REF: ${{ env.PRODUCTION_SUPABASE_PROJECT_REF }}
          TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          req = urllib.request.Request(f"https://api.supabase.com/v1/projects/{os.environ['REF']}/config/auth",
                                       headers={"Authorization": "Bearer " + os.environ["TOKEN"]})
          d = json.load(urllib.request.urlopen(req, timeout=30))
          PREFIXES = ("password_", "mailer_", "sessions_", "rate_limit_", "smtp_", "security_", "refresh_token_",
                      "mfa_", "external_email_enabled", "disable_signup", "site_url", "uri_allow_list", "jwt_exp")
          SECRET = ("secret", "_key", "hmac", "token_hash")
          for k in sorted(d):
              if not k.startswith(PREFIXES):
                  continue
              v = d.get(k)
              if k.endswith("_content"):
                  s = v or ""
                  print(f"{k:58} len={len(s)} sha256={hashlib.sha256(s.encode()).hexdigest()[:12]}"
                        f" token={'{{ .Token }}' in s} link={'ConfirmationURL' in s} says_supabase={'supabase' in s.lower()}")
                  continue
              if k == "smtp_pass" or any(x in k for x in SECRET) and not isinstance(v, bool):
                  print(f"{k:58} <present: {v is not None and v != ''}>")
                  continue
              print(f"{k:58} {v!r}")
          PY

  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Mail domain records (public DNS)
        run: |
          set -u
          command -v dig >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils >/dev/null)
          for q in "TXT pintarselalu.com" "TXT _dmarc.pintarselalu.com" "MX pintarselalu.com" \
                   "TXT default._domainkey.pintarselalu.com" "TXT staging.pintarselalu.com"; do
            echo "== $q"; dig +short $q || true
          done
      # The Stellar -> Stellar Business upgrade moves the account to another server
      # (new IP and hostname). Both Supabase projects send sign-in email through
      # pintarselalu.com:465, so these are read before and after the move.
      - name: Hosting records and the SMTP endpoint (before/after a server move)
        run: |
          set -u
          command -v dig >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils >/dev/null)
          for q in "NS pintarselalu.com" "A pintarselalu.com" "A mail.pintarselalu.com" \
                   "CNAME app.pintarselalu.com" "CNAME staging.pintarselalu.com"; do
            echo "== $q"; dig +short $q || true
          done
          echo "== TLS certificate on pintarselalu.com:465"
          echo | timeout 20 openssl s_client -connect pintarselalu.com:465 -servername pintarselalu.com 2>/dev/null \
            | openssl x509 -noout -subject -issuer -enddate -ext subjectAltName 2>/dev/null || echo "no certificate read"
          echo "== SMTP greeting on pintarselalu.com:465 (no login)"
          printf 'QUIT\r\n' | timeout 20 openssl s_client -connect pintarselalu.com:465 -servername pintarselalu.com -quiet 2>/dev/null \
            | head -2 || echo "no greeting"
