# Z9 ruling 84 (Bob, 19:59Z): a THROWAWAY DIAGNOSTIC, never merged. The strict selftest job's runner, local stack,
# Mailpit and env, running only what C3W-C32/C36/C310 need, with the C3W world's step results printed (names, results,
# refusal codes; c1.* settings by name, EMPTY or set). No secrets, keys, emails or names are printed.
name: ci
on:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  NODE_VERSION: 22
jobs:
  selftest:
    name: z9 diagnostic · C3W-C32/C36/C310 (strict job's stack and env)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - id: stack
        uses: ./.github/actions/local-stack
      - name: Mailpit sink (BOB-25)
        run: |
          docker run -d --name mailpit -p 127.0.0.1:54325:1025 -p 127.0.0.1:54324:8025 axllent/mailpit:v1.31.3 \
            --enable-chaos --smtp-auth-accept-any --smtp-auth-allow-insecure --disable-version-check
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:54324/api/v1/info >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:54324/api/v1/info >/dev/null
      - name: Clocks and runner
        env:
          SUPABASE_DB_URL: ${{ steps.stack.outputs.db-url }}
        run: |
          echo "runner UTC $(date -u +%FT%TZ); Jakarta $(TZ=Asia/Jakarta date +%FT%T); nproc $(nproc)"
          psql -X -At "$SUPABASE_DB_URL" -c "select 'db now ' || now()::text || '; TimeZone ' || current_setting('TimeZone')"
      - name: A · the three ids alone, with the diagnostic
        id: a
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.stack.outputs.api-url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.stack.outputs.anon-key }}
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3999
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.stack.outputs.service-role-key }}
          SUPABASE_DB_URL: ${{ steps.stack.outputs.db-url }}
          CARD_PEPPER: synthetic-card-pepper-fable01-32plus
          CARD_EMAIL_DOMAIN: cards.synthetic.pintar.test
          CERT_SECRET_KEY_V1: synthetic-certificate-key-fable04-32plus
          PINTAR_SMTP_HOST: 127.0.0.1
          PINTAR_SMTP_PORT: "54325"
          PINTAR_SMTP_USER: noreply@pintarselalu.test
          PINTAR_SMTP_PASSWORD: sink-accepts-any
          PINTAR_BUILD_SHA: ${{ github.sha }}
          SELFTEST_APP_PORT: 3999
        run: npx tsx selftest/run.ts --only=C3W-C32,C3W-C36,C3W-C310 2>&1 | grep -E "C1DIAG|^C3W-|^FAILED|TALLY|could not|ERROR" | cut -c1-4000
      - name: B · the c1 world's families in the strict job's order (C1W-*, C2W-*, C3W-*), with the diagnostic
        id: b
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.stack.outputs.api-url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.stack.outputs.anon-key }}
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3999
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.stack.outputs.service-role-key }}
          SUPABASE_DB_URL: ${{ steps.stack.outputs.db-url }}
          CARD_PEPPER: synthetic-card-pepper-fable01-32plus
          CARD_EMAIL_DOMAIN: cards.synthetic.pintar.test
          CERT_SECRET_KEY_V1: synthetic-certificate-key-fable04-32plus
          PINTAR_SMTP_HOST: 127.0.0.1
          PINTAR_SMTP_PORT: "54325"
          PINTAR_SMTP_USER: noreply@pintarselalu.test
          PINTAR_SMTP_PASSWORD: sink-accepts-any
          PINTAR_BUILD_SHA: ${{ github.sha }}
          SELFTEST_APP_PORT: 3999
        run: npx tsx selftest/run.ts '--only=C1W-*,C2W-*,C3W-*' 2>&1 | grep -E "C1DIAG|^C1W-|^C2W-|^C3W-|^FAILED|TALLY|could not" | cut -c1-4000
