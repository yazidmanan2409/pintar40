# PINTAR CI — the automated layer of the verification contract (doc 16 §1–5;
# FABLE-01 §1). Every job runs from `npm ci` on a clean checkout. The
# `selftest` job runs the whole manifest strictly (no skips) against the
# local Supabase stack and receives the results of the migration and red-case
# jobs as evidence for F01-R04.
name: ci

on:
  push:
    # D-025 (supersedes the lane half of P-03): CI starts automatically only on
    # main, where the coordinator merges. A lane dispatches this workflow itself,
    # exactly once per hand-off, on its head commit. The deploy still requires a
    # green run on the exact commit it ships; the coordinator dispatches one on
    # main when the release commit has none. Documentation-only pushes do not
    # start CI, except the frozen documents that baseline parity guards.
    branches: [main]
    paths:
      - "**"
      - "!docs/coordination/**"
      - "!docs/audit/**"
      - "!docs/deployment/**"
      - "!docs/onboarding/**"
  pull_request:
  # A phase is not done until this workflow is green on a pushed commit, and
  # until now it could only run on main or on a pull request — so work on a
  # branch had no way to be verified without opening one first. Additive: the
  # two triggers above are unchanged.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  check:
    name: install · lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Production build (placeholder public env; nothing secret)
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3999
          PINTAR_BUILD_SHA: ${{ github.sha }}
        run: npm run build

  migrations-clean:
    name: migrations · clean database + seed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Apply every migration to a clean database, then the synthetic seed
        id: stack
        uses: ./.github/actions/local-stack
      - name: Recorded migration history equals the repository's (one linear series)
        env:
          DB_URL: ${{ steps.stack.outputs.db-url }}
        run: |
          psql -At -c "select version from supabase_migrations.schema_migrations order by version" "$DB_URL" > applied.txt
          ls supabase/migrations | sed -E 's/^([0-9]{14})_.*/\1/' | sort > repo.txt
          diff -u repo.txt applied.txt

  migrations-upgrade-path:
    name: migrations · previous schema → HEAD (upgrade path)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Resolve the previous released schema
        id: base
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A manual run has no `before`, so without this the whole job would
          # skip every step and report success over nothing. Fall back to the
          # merge base with the default branch, which is what a pull request
          # from this branch would compare against anyway.
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags origin main:refs/remotes/origin/main 2>/dev/null || true
            BASE_SHA="$(git merge-base HEAD refs/remotes/origin/main 2>/dev/null || true)"
            echo "no event base; using the merge base with main: ${BASE_SHA:-none}"
          fi
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "has-base=false" >> "$GITHUB_OUTPUT"; echo "no previous commit reachable — first push"; exit 0
          fi
          if ! git ls-tree -d "$BASE_SHA" supabase/migrations | grep -q .; then
            echo "has-base=false" >> "$GITHUB_OUTPUT"; echo "previous commit $BASE_SHA has no migrations directory"; exit 0
          fi
          echo "has-base=true" >> "$GITHUB_OUTPUT"
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          git worktree add --detach base "$BASE_SHA"
          echo "previous schema: $BASE_SHA ($(ls base/supabase/migrations | wc -l) migrations)"
          # Cost: this job is the most expensive in the workflow because it
          # stands up a second Supabase stack. When no migration changed since
          # the base there is nothing for it to upgrade THROUGH, so the stack is
          # skipped and the byte-identical check below still runs. The job keeps
          # reporting -- it does not become a silent pass -- and says which it
          # did. A workflow-level `paths:` filter was considered and rejected:
          # it would stop the job existing on a doc-only push, which is a
          # different thing from it running and finding nothing to do.
          if git diff --quiet "$BASE_SHA" HEAD -- supabase/migrations; then
            echo "stack-needed=false" >> "$GITHUB_OUTPUT"
            echo "no migration changed since the base — skipping the upgrade stack"
          else
            echo "stack-needed=true" >> "$GITHUB_OUTPUT"
            echo "migrations changed: $(git diff --name-only "$BASE_SHA" HEAD -- supabase/migrations | wc -l) file(s)"
          fi
      - name: Forward-only — every previously applied migration is byte-identical in HEAD
        if: steps.base.outputs.has-base == 'true'
        run: |
          status=0
          for f in base/supabase/migrations/*.sql; do
            n=$(basename "$f")
            if [ ! -f "supabase/migrations/$n" ]; then echo "::error::applied migration $n removed from HEAD"; status=1; continue; fi
            cmp -s "$f" "supabase/migrations/$n" || { echo "::error::applied migration $n was edited in HEAD"; status=1; }
          done
          exit $status
      - name: Start the previous schema with representative (synthetic) data
        if: steps.base.outputs.has-base == 'true' && steps.base.outputs.stack-needed == 'true'
        id: stack
        uses: ./.github/actions/local-stack
        with:
          working-directory: base
      - name: Apply HEAD's pending migrations on top of the running previous schema
        if: steps.base.outputs.has-base == 'true' && steps.base.outputs.stack-needed == 'true'
        run: npx --no-install supabase migration up --local
      - name: The db contract holds on the upgraded database
        if: steps.base.outputs.has-base == 'true' && steps.base.outputs.stack-needed == 'true'
        env:
          DB_URL: ${{ steps.stack.outputs.db-url }}
        run: |
          psql -v ON_ERROR_STOP=1 -q -1 -f selftest/db/fable01.sql "$DB_URL"
          psql -v ON_ERROR_STOP=1 -At -F ' | ' -c "select test_id, ok, detail from selftest.run_fable01()" "$DB_URL" | tee upgraded.txt
          ! grep -E '\| f \|' upgraded.txt

  red-case:
    name: red case · ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        case: [static-permissive-policy, db-table-without-rls, static-raw-evidence-read, static-duplicate-engine,
               static-second-verification-route, db-fable04-gates, db-fable05-gates, db-task1-gates,
               db-task2-gates, db-fable06-gates, static-fable06-gates, db-tour-gates, db-wp1-gates,
               db-wp7-gates, db-wp8-gates, db-r1-gates, db-bob01-gates, db-bob02-gates, db-bob03-gates, db-bob04-gates,
               db-bob06-gates]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Inject the deliberate defect
        run: |
          case "${{ matrix.case }}" in
            static-permissive-policy)
              printf -- "create policy red_case on public.persons for select to anon using (true);\n" > supabase/migrations/20990101000000_red_case.sql ;;
            db-table-without-rls)
              printf -- "create table public.red_case_no_rls (id int primary key);\ndo \$\$ begin if false then raise exception 'n/a'; end if; end \$\$;\n" > supabase/migrations/20990101000000_red_case.sql ;;
            static-raw-evidence-read)
              mkdir -p src/analytics
              printf -- "export const q = \"select mastery from assessment_results\";\n" > src/analytics/red_case.ts ;;
            static-duplicate-engine)
              mkdir -p src/app/api/rogue
              printf -- "export async function GET() {\n  const { data } = await db.rpc(\"evaluate_session\", { p_session: \"x\" });\n  return Response.json(data);\n}\n" > src/app/api/rogue/route.ts ;;
            static-second-verification-route)
              mkdir -p "src/app/verifikasi-ulang/[token]"
              printf -- "export default function P() {\n  return null;\n}\n" > "src/app/verifikasi-ulang/[token]/page.tsx" ;;
            db-fable04-gates)
              echo "the four FABLE-04 gate defects are planted in SQL against the running stack, below" ;;
            db-fable05-gates)
              echo "the five FABLE-05 gate defects are planted in SQL against the running stack, below" ;;
            db-task1-gates)
              echo "the two ADR-0018 gate defects are planted in SQL against the running stack, below" ;;
            db-task2-gates)
              echo "the three ADR-0020 gate defects are planted in SQL against the running stack, below" ;;
            db-fable06-gates)
              echo "the three FABLE-06 gate defects are planted in SQL against the running stack, below" ;;
            static-fable06-gates)
              echo "the three FABLE-06 static defects are planted as files, below" ;;
            db-tour-gates)
              echo "the eight first-login tour defects are planted in SQL against the running stack, below" ;;
            db-wp1-gates)
              echo "the eight WP1 source-bound authorization and objective-B defects are planted in SQL against the running stack, below" ;;
            db-wp1-gates)
              echo "the six authorization-boundary defects are planted in SQL against the running stack, below" ;;
            db-wp7-gates)
              echo "the fourteen feedback defects declared in selftest/plants/plants.json are planted against the running stack, below" ;;
            db-wp8-gates)
              echo "the six WP8 defects declared in selftest/plants/plants.json are planted against the running stack, below" ;;
            db-r1-gates)
              echo "the six systemic-repair defects declared in selftest/plants/plants.json are planted against the running stack, below" ;;
            db-bob01-gates)
              echo "the fifteen school-structure and intake defects declared in selftest/plants/plants.json are planted against the running stack, below" ;;
            db-bob02-gates)
              echo "the eleven lesson-package and media-preview defects declared in selftest/plants/plants.json are planted against the running stack, below" ;;
            db-bob03-gates)
              echo "the nine release-path defects declared in selftest/plants/plants.json are planted against the running stack, below" ;;
            db-bob04-gates)
              echo "the nine learning-cycle defects declared in selftest/plants/plants.json are planted against the running stack, below" ;;
            db-bob06-gates)
              echo "the six standard-report defects declared in selftest/plants/plants.json are planted against the running stack, below" ;;
          esac
      - name: Static contract must go red for the right reason
        if: matrix.case == 'static-permissive-policy'
        run: |
          set +e
          npx tsx selftest/run.ts --accept-justified-skips --only=F01-S01,F01-S02 | tee red.txt
          code=${PIPESTATUS[0]}
          set -e
          [ "$code" -ne 0 ] || { echo "::error::contract stayed green with a permissive policy present"; exit 1; }
          grep -E '^F01-S02 +FAIL' red.txt
      # INV-20's lint scans evidence-consumer paths, and there are none yet, so
      # on HEAD it passes over zero files. That makes it worthless unless it is
      # shown to be capable of failing: this case plants an analytics module
      # that reads a raw evidence table and requires the lint to catch it.
      # FABLE-06's three derived mechanisms. Each replaced a hand-maintained list
      # that was green BECAUSE IT WAS SHORT, so each must be shown capable of
      # failing -- a derived check that has never rejected anything is the same
      # unverified guarantee the lists were.
      - name: The FABLE-06 derived checks must each catch their own defect
        if: matrix.case == 'static-fable06-gates'
        run: |
          set -e
          # 1. a route the application serves with no output-level coverage.
          #    The hand-maintained fetch list would never have noticed.
          mkdir -p src/app/redcase && printf 'export default function R() { return <p>red</p>; }\n' > src/app/redcase/page.tsx
          set +e; npx tsx selftest/run.ts --accept-justified-skips --only=F06-S02 | tee r1.txt; code=${PIPESTATUS[0]}; set -e
          [ "$code" -ne 0 ] || { echo "::error::F06-S02 stayed green with an uncovered route served"; exit 1; }
          grep -E '^F06-S02 +FAIL' r1.txt
          grep -F '/redcase' r1.txt
          rm -rf src/app/redcase

          # 2. an enum interpolated into a JSX text position -- the leak the
          #    source scan skips by design and the output scan cannot reach on
          #    an authenticated route.
          mkdir -p src/app/redcase2 && printf 'export default function R({s}:{s:{status:string}}) { return <p>{s.status}</p>; }\n' > src/app/redcase2/page.tsx
          set +e; npx tsx selftest/run.ts --accept-justified-skips --only=F06-S03 | tee r2.txt; code=${PIPESTATUS[0]}; set -e
          [ "$code" -ne 0 ] || { echo "::error::F06-S03 stayed green with an enum rendered in a text position"; exit 1; }
          grep -E '^F06-S03 +FAIL' r2.txt
          grep -F 's.status' r2.txt
          rm -rf src/app/redcase2

          # 3. a `proves` string that names no artefact -- the manifest's own
          #    metadata, which is what a gate reads.
          node -e "const f='selftest/manifest.json';const m=require('./'+f);for(const t of m.tests){if(t.id==='F06-S03'){t.proves='INV checks are correct';}}require('fs').writeFileSync(f,JSON.stringify(m,null,2));"
          set +e; npx tsx selftest/run.ts --accept-justified-skips --only=F06-S04 | tee r3.txt; code=${PIPESTATUS[0]}; set -e
          [ "$code" -ne 0 ] || { echo "::error::F06-S04 stayed green with a proves string naming no artefact"; exit 1; }
          grep -E '^F06-S04 +FAIL' r3.txt
          git checkout -- selftest/manifest.json

          # 4. a credential-bearing seed with no fail-closed guard (L3-F01). The
          #    seed set is derived from the directory, so a rogue seed that
          #    inserts into auth.users without synthetic_fixtures_permitted()
          #    must make F06-S07 fail and name the file.
          printf "insert into auth.users (id, email, encrypted_password) values (gen_random_uuid(), 'rogue@synthetic.pintar.test', 'x');\n" > supabase/seed/zz_rogue_fixture.sql
          set +e; npx tsx selftest/run.ts --accept-justified-skips --only=F06-S07 | tee r4.txt; code=${PIPESTATUS[0]}; set -e
          [ "$code" -ne 0 ] || { echo "::error::F06-S07 stayed green with a guardless credential seed present"; exit 1; }
          grep -E '^F06-S07 +FAIL' r4.txt
          grep -F 'zz_rogue_fixture.sql' r4.txt
          rm -f supabase/seed/zz_rogue_fixture.sql

          # 5. BOB-16: a reader that returns Google Sheets' stored N.0 as it is.
          #    BOB02-X01 must go red on the Google Sheets copy of the sample.
          node -e 'const fs=require("fs");const f="src/lib/xlsx.ts";const s=fs.readFileSync(f,"utf8");const t=s.split("\n").filter(l=>!(l.includes("jenis === null") && l.includes("teks.replace"))).join("\n");if(t===s)process.exit(3);fs.writeFileSync(f,t)'
          set +e; npx tsx selftest/run.ts --accept-justified-skips --only=BOB02-X01 | tee r5.txt; code=${PIPESTATUS[0]}; set -e
          [ "$code" -ne 0 ] || { echo "::error::BOB02-X01 stayed green with a reader that keeps N.0"; exit 1; }
          grep -E '^BOB02-X01 +FAIL' r5.txt
          grep -F "contoh-gsheets.xlsx's Bab sheet does not hold the cells" r5.txt
          git checkout -- src/lib/xlsx.ts

          # 6. BOB-07: a server action that sends the database's words back in a
          #    redirect. BOB07-K01 must go red and name the file.
          mkdir -p src/app/redcase3
          printf '"use server";\nexport async function a() { const { error } = await x(); back("s", { ok: false, detail: error.message }); }\n' > src/app/redcase3/actions.ts
          set +e; npx tsx selftest/run.ts --accept-justified-skips --only=BOB07-K01 | tee r6.txt; code=${PIPESTATUS[0]}; set -e
          [ "$code" -ne 0 ] || { echo "::error::BOB07-K01 stayed green with database words sent back in a redirect"; exit 1; }
          grep -E '^BOB07-K01 +FAIL' r6.txt
          grep -F 'src/app/redcase3/actions.ts:2 lets .message leave the server' r6.txt
          rm -rf src/app/redcase3

          # 7. BOB-09: a picker that treats the hidden Reguler as a Bagian.
          #    BOB09-K01 must go red and name the hidden node it was offered.
          node -e 'const fs=require("fs");const f="src/lib/struktur-kontrak.ts";const s=fs.readFileSync(f,"utf8");const t=s.replace("  DEPARTMENT: \"BAGIAN\",\n","  DEPARTMENT: \"BAGIAN\",\n  PROGRAMME: \"BAGIAN\",\n");if(t===s)process.exit(3);fs.writeFileSync(f,t)'
          set +e; npx tsx selftest/run.ts --accept-justified-skips --only=BOB09-K01 | tee r7.txt; code=${PIPESTATUS[0]}; set -e
          [ "$code" -ne 0 ] || { echo "::error::BOB09-K01 stayed green with the hidden Reguler offered as a place"; exit 1; }
          grep -E '^BOB09-K01 +FAIL' r7.txt
          grep -F 'the intake offers a hidden node: ["SD · Reguler","SMA · Reguler"]' r7.txt
          git checkout -- src/lib/struktur-kontrak.ts
      - name: The INV-20 lint must catch a planted raw-evidence read
        if: matrix.case == 'static-raw-evidence-read'
        run: |
          set +e
          npx tsx selftest/run.ts --accept-justified-skips --only=F02-S01 | tee red.txt
          code=${PIPESTATUS[0]}
          set -e
          [ "$code" -ne 0 ] || { echo "::error::the INV-20 lint stayed green with an analytics path reading a raw evidence table"; exit 1; }
          grep -E '^F02-S01 +FAIL' red.txt
          grep -F 'assessment_results' red.txt
      # INV-26 is the rule the phase prompt names outright: "a second
      # implementation of assembly, the sanitizer, scoring or the safety gate
      # fails the build". A rule nobody has watched fail is a rule nobody
      # knows works, so this plants a route that scores a session without
      # going through the engine and requires F03-S01 to catch it by name.
      - name: The INV-26 check must catch a second engine
        if: matrix.case == 'static-duplicate-engine'
        run: |
          set +e
          npx tsx selftest/run.ts --accept-justified-skips --only=F03-S01 | tee red.txt
          code=${PIPESTATUS[0]}
          set -e
          [ "$code" -ne 0 ] || { echo "::error::the INV-26 check stayed green with a second scorer present"; exit 1; }
          grep -E '^F03-S01 +FAIL' red.txt
          grep -F 'evaluate_session' red.txt

      # INV-38 says one canonical verification URL shape and a redirect at most.
      # A second page that also verifies is the defect the invariant names, and
      # a check that has never been watched fail is a check nobody knows works.
      - name: The INV-38 check must catch a second verification route
        if: matrix.case == 'static-second-verification-route'
        run: |
          set +e
          npx tsx selftest/run.ts --accept-justified-skips --only=F04-S01 | tee red.txt
          code=${PIPESTATUS[0]}
          set -e
          [ "$code" -ne 0 ] || { echo "::error::INV-38 stayed green with a second verification route present"; exit 1; }
          grep -E '^F04-S01 +FAIL' red.txt
          grep -F 'verifikasi-ulang' red.txt

      - name: Start stack with the defective migration applied
        if: matrix.case == 'db-table-without-rls'
        id: stack
        uses: ./.github/actions/local-stack
      - name: DB contract must go red on F01-T13 (schema lint)
        if: matrix.case == 'db-table-without-rls'
        env:
          DB_URL: ${{ steps.stack.outputs.db-url }}
        run: |
          psql -v ON_ERROR_STOP=1 -q -1 -f selftest/db/fable01.sql "$DB_URL"
          psql -v ON_ERROR_STOP=1 -At -F ' | ' -c "select test_id, ok, detail from selftest.run_fable01()" "$DB_URL" | tee red.txt
          grep -E '^F01-T13 \| f \|' red.txt

      # FABLE-04 §14's four database red cases. They share ONE stack on purpose:
      # the phase's cost discipline says not to add a full stack bring-up per
      # red case when an existing job can carry it. Each defect is still planted
      # and proven individually -- inside its own transaction, which is rolled
      # back before the next one, so no defect can mask or rescue another.
      - name: Start a clean seeded stack for the FABLE-04 gate defects
        if: matrix.case == 'db-fable04-gates'
        id: gates
        uses: ./.github/actions/local-stack
      - name: Each planted FABLE-04 defect must turn its own gate red
        if: matrix.case == 'db-fable04-gates'
        env:
          DB_URL: ${{ steps.gates.outputs.db-url }}
        run: |
          set -e
          for f in selftest/db/fable0*.sql; do psql -v ON_ERROR_STOP=1 -q -1 -f "$f" "$DB_URL"; done

          red() {   # red <test id> <expected substring> <sql file>
            psql -v ON_ERROR_STOP=1 -At -F ' | ' -f "$3" "$DB_URL" | tee "out-$1.txt"
            grep -E "^$1 \| f \|" "out-$1.txt" || { echo "::error::$1 stayed green with the defect planted"; exit 1; }
            grep -F "$2" "out-$1.txt" || { echo "::error::$1 went red but not for '$2'"; exit 1; }
          }

          # 1. a client-executable SECURITY DEFINER RPC with no exposure class
          cat > /tmp/rc1.sql <<'SQL'
          begin;
          create function public.red_case_unregistered(p_x uuid) returns int
          language sql security definer set search_path = public, pg_temp as $f$ select 1 $f$;
          revoke all on function public.red_case_unregistered(uuid) from public, anon;
          grant execute on function public.red_case_unregistered(uuid) to authenticated;
          select test_id, case when ok then 't' else 'f' end, detail from selftest.run_fable01() where test_id = 'F01-T13';
          rollback;
          SQL
          red F01-T13 '"unclassified_client_rpcs": 1' /tmp/rc1.sql

          # 2. a LEARNER RPC that never reaches an ownership check
          cat > /tmp/rc2.sql <<'SQL'
          begin;
          create function public.red_case_learner(p_session uuid) returns int
          language plpgsql security definer set search_path = public, pg_temp as $f$ begin return 1; end $f$;
          revoke all on function public.red_case_learner(uuid) from public, anon;
          grant execute on function public.red_case_learner(uuid) to authenticated;
          insert into public.client_rpc_registry values ('red_case_learner', 'LEARNER', 'planted defect');
          select test_id, case when ok then 't' else 'f' end, detail from selftest.run_fable01() where test_id = 'F01-T13';
          rollback;
          SQL
          red F01-T13 '"learner_rpcs_guarded_ok": false' /tmp/rc2.sql

          # 3. a scoring path reading integrity signals
          cat > /tmp/rc3.sql <<'SQL'
          begin;
          do $d$
          declare src text; orig text;
          begin
            orig := pg_get_functiondef('public.session_outcome(uuid)'::regprocedure);
            src := regexp_replace(orig, E'\nbegin\n',
                     E'\nbegin\n  perform 1 from public.integrity_signals where session_id = p_session;\n');
            if src = orig then raise exception 'the plant did not change session_outcome'; end if;
            execute src;
          end $d$;
          select test_id, case when ok then 't' else 'f' end, detail from selftest.run_fable04() where test_id = 'F04-T07';
          rollback;
          SQL
          red F04-T07 'integrity_signals' /tmp/rc3.sql

          # 4. a certificate payload missing a protected field
          cat > /tmp/rc4.sql <<'SQL'
          begin;
          do $d$
          declare src text; orig text;
          begin
            orig := pg_get_functiondef('public.certificate_prepare(uuid,smallint)'::regprocedure);
            src := replace(orig, E'    ''plp_release_id'', v_release,\n', '');
            if src = orig then raise exception 'the plant did not change the payload builder'; end if;
            execute src;
          end $d$;
          select test_id, case when ok then 't' else 'f' end, detail from selftest.run_fable04() where test_id = 'F04-T09';
          rollback;
          SQL
          red F04-T09 'plp_release_id' /tmp/rc4.sql

      # FABLE-05 §10.6's five red cases. One stack, same discipline as the
      # FABLE-04 leg: each defect is planted inside its own transaction and
      # rolled back before the next, so no defect can mask or rescue another.
      # A probe that never fails proves nothing.
      - name: Start a clean seeded stack for the FABLE-05 gate defects
        if: matrix.case == 'db-fable05-gates'
        id: gates05
        uses: ./.github/actions/local-stack
      - name: Each planted FABLE-05 defect must turn its own gate red
        if: matrix.case == 'db-fable05-gates'
        env:
          DB_URL: ${{ steps.gates05.outputs.db-url }}
        run: |
          set -e
          for f in selftest/db/fable0*.sql; do psql -v ON_ERROR_STOP=1 -q -1 -f "$f" "$DB_URL"; done
          # the suite must be green BEFORE anything is planted, or "it went red"
          # says nothing about the defect
          psql -v ON_ERROR_STOP=1 -At -F ' | ' -c "select test_id, case when ok then 't' else 'f' end, detail from selftest.run_fable05()" "$DB_URL" | tee base.txt
          grep -E ' \| f \| ' base.txt && { echo "::error::the FABLE-05 suite is already red before any defect was planted"; exit 1; } || true

          red() {   # red <test id> <expected substring> <sql file>
            psql -v ON_ERROR_STOP=1 -At -F ' | ' -f "$3" "$DB_URL" | tee "out-$1.txt"
            grep -E "^$1 \| f \|" "out-$1.txt" || { echo "::error::$1 stayed green with the defect planted"; exit 1; }
            grep -F "$2" "out-$1.txt" || { echo "::error::$1 went red but not for '$2'"; exit 1; }
          }

          # 1. a client-executable SECURITY DEFINER RPC with no exposure class.
          #    FABLE-05 adds eleven of them; the registry rule has to keep biting.
          cat > /tmp/f5-1.sql <<'SQL'
          begin;
          create function public.red_case_studio(p_course uuid) returns int
          language sql security definer set search_path = public, pg_temp as $f$ select 1 $f$;
          revoke all on function public.red_case_studio(uuid) from public, anon;
          grant execute on function public.red_case_studio(uuid) to authenticated;
          select test_id, case when ok then 't' else 'f' end, detail from selftest.run_fable05() where test_id = 'F05-T21';
          rollback;
          SQL
          red F05-T21 'unclassified_client_rpcs is 1' /tmp/f5-1.sql

          # 2. a canonical read path that admits a second institution's content:
          #    drop the PLATFORM_CANONICAL conjunct from the one predicate every
          #    relaxation reads, and school-to-school sharing becomes expressible.
          cat > /tmp/f5-2.sql <<'SQL'
          begin;
          create or replace function public.release_is_distributed_to(p_release uuid, p_institution uuid)
          returns boolean language sql stable security definer set search_path = public, pg_temp as $f$
            select exists (
              select 1 from public.plp_releases r
                join public.release_distributions d
                  on d.plp_release_id = r.id and d.institution_id = p_institution
               where r.id = p_release and d.status = 'ACTIVE')
          $f$;
          select test_id, case when ok then 't' else 'f' end, detail from selftest.run_fable05() where test_id = 'F05-T08';
          rollback;
          SQL
          red F05-T08 'school-to-school distribution row took effect' /tmp/f5-2.sql

          # 3. a revision that copies an empirical value -- the fabricated
          #    measurement doc 02 forbids by name.
          cat > /tmp/f5-3.sql <<'SQL'
          begin;
          do $d$
          declare src text; orig text; n int;
          begin
            -- the source items carry no empirical value, because nothing has
            -- computed one -- so the plant must give one to a source item too,
            -- or "the copy has none" would be true for the wrong reason
            perform selftest.canonical_package();
            update public.items i set empirical_difficulty = 0.42, empirical_discrimination = 0.31,
                   empirical_evidence_count = 128
              from public.lessons l, public.modules m, public.courses c, public.institutions o
             where i.lesson_id = l.id and l.module_id = m.id and m.course_id = c.id
               and c.id = m.course_id and o.id = c.institution_id
               and o.tenant_kind = 'PLATFORM_CANONICAL' and c.supersedes_course_id is null;
            get diagnostics n = row_count;
            if n = 0 then raise exception 'the plant found no canonical item to mark'; end if;

            orig := pg_get_functiondef('public.create_course_revision(uuid)'::regprocedure);
            src := replace(orig,
              E'       objective_ids, is_safety_critical, parallel_group, predicted_difficulty,',
              E'       objective_ids, is_safety_critical, parallel_group, predicted_difficulty, empirical_difficulty,');
            if src = orig then raise exception 'the plant did not change the column list'; end if;
            src := replace(src,
              E'           v_it.is_safety_critical, v_pg, v_it.predicted_difficulty,',
              E'           v_it.is_safety_critical, v_pg, v_it.predicted_difficulty, v_it.empirical_difficulty,');
            execute src;
          end $d$;
          select test_id, case when ok then 't' else 'f' end, detail from selftest.run_fable05() where test_id = 'F05-T12';
          rollback;
          SQL
          red F05-T12 'inherited an empirical value' /tmp/f5-3.sql

          # 4. a release move that crosses a lineage boundary it should not:
          #    remove the lineage check and an unrelated canonical package
          #    becomes a legal "correction".
          cat > /tmp/f5-4.sql <<'SQL'
          begin;
          do $d$
          declare src text; orig text;
          begin
            orig := pg_get_functiondef('public.move_learning_assignment_release(uuid,uuid,text)'::regprocedure);
            src := replace(orig, 'where c.course_id = v_target.course_id) then', 'where true) then');
            if src = orig then raise exception 'the plant did not neutralise the lineage check'; end if;
            execute src;
          end $d$;
          select test_id, case when ok then 't' else 'f' end, detail from selftest.run_fable05() where test_id = 'F05-T14';
          rollback;
          SQL
          red F05-T14 'outside the lineage was accepted' /tmp/f5-4.sql

          # 5. publishing while Blocked: remove the readiness gate from the
          #    trigger and an ERROR finding stops stopping anything.
          cat > /tmp/f5-5.sql <<'SQL'
          begin;
          create or replace function public.enforce_release_publish_readiness() returns trigger
          language plpgsql security definer set search_path = public, pg_temp as $f$
          begin
            return new;
          end $f$;
          select test_id, case when ok then 't' else 'f' end, detail from selftest.run_fable05() where test_id = 'F05-T22';
          rollback;
          SQL
          red F05-T22 'Blocked package was published' /tmp/f5-5.sql

      # ADR-0018's two red cases. Same discipline as the two legs above: one
      # stack, each defect planted inside its own transaction and rolled back
      # before the next, and the suite proven green before anything is planted.
      # The task names both of these outright -- "plant a relaxation admitting a
      # second institution's item and require negative 3 or 4 to fail BY NAME;
      # plant a two-owner paper and require negative 7 to fail by name".
      - name: Start a clean seeded stack for the ADR-0018 gate defects
        if: matrix.case == 'db-task1-gates'
        id: gatesT1
        uses: ./.github/actions/local-stack
      - name: Each planted ADR-0018 defect must turn its own gate red
        if: matrix.case == 'db-task1-gates'
        env:
          DB_URL: ${{ steps.gatesT1.outputs.db-url }}
        run: |
          set -e
          for f in selftest/db/fable0*.sql; do psql -v ON_ERROR_STOP=1 -q -1 -f "$f" "$DB_URL"; done
          psql -v ON_ERROR_STOP=1 -At -F ' | ' -c "select test_id, case when ok then 't' else 'f' end, detail from selftest.run_quick_canonical()" "$DB_URL" | tee baseT1.txt
          grep -E ' \| f \| ' baseT1.txt && { echo "::error::the Task 1 suite is already red before any defect was planted"; exit 1; } || true

          red() {   # red <test id> <expected substring> <sql file>
            psql -v ON_ERROR_STOP=1 -At -F ' | ' -f "$3" "$DB_URL" | tee "out-$1.txt"
            grep -E "^$1 \| f \|" "out-$1.txt" || { echo "::error::$1 stayed green with the defect planted"; exit 1; }
            grep -F "$2" "out-$1.txt" || { echo "::error::$1 went red but not for '$2'"; exit 1; }
          }

          # 1. eligibility that follows MEMBERSHIP instead of AUTHORIZATION.
          #    The accessor keeps its caller gate and loses the distribution
          #    predicate, so any school reaches any other school's items --
          #    exactly the cross-tenant relaxation negative 3 exists to catch.
          cat > /tmp/t1-1.sql <<'SQL'
          begin;
          create or replace function public.authorized_canonical_items()
          returns table (consuming_institution_id uuid, item_id uuid, lesson_id uuid, module_id uuid,
                         course_id uuid, parallel_group uuid, bank_type public.bank_type,
                         owner_institution_id uuid)
          language sql stable security definer set search_path = public, pg_temp as $f$
            select mine.institution_id, i.id, l.id, m.id, c.id, i.parallel_group, i.bank_type, i.institution_id
              from (select distinct d.institution_id
                      from public.release_distributions d
                     where d.status = 'ACTIVE'
                       and public.is_member_of_institution(d.institution_id)) mine
              join public.courses c on true
              join public.modules m on m.course_id = c.id
              join public.lessons l on l.module_id = m.id
              join public.items i on i.lesson_id = l.id
          $f$;
          select test_id, case when ok then 't' else 'f' end, detail from selftest.run_quick_canonical() where test_id = 'QAC-T04';
          rollback;
          SQL
          red QAC-T04 "of School C's item(s)" /tmp/t1-1.sql

          # 2. the single-owner boundary, neutered. ADR-0018 says the boundary
          #    is asserted rather than merely unimplemented; a guard nobody has
          #    watched fail is a guard nobody knows is there.
          cat > /tmp/t1-2.sql <<'SQL'
          begin;
          create or replace function public.enforce_ad_hoc_single_owner(p_definition uuid)
          returns void language plpgsql stable security definer set search_path = public, pg_temp as $f$
          begin
            return;
          end $f$;
          select test_id, case when ok then 't' else 'f' end, detail from selftest.run_quick_canonical() where test_id = 'QAC-T08';
          rollback;
          SQL
          red QAC-T08 'was not refused at the boundary' /tmp/t1-2.sql

          # 3. the release resolution without its PUBLISHED clause -- the F1
          #    defect Claude 1's second reading found, 0063 repaired and 0064 narrowed. The
          #    clause is removed from the LIVE function text rather than the
          #    file, so what is proven is that this exact clause is what stops
          #    a learner sitting an assessment against an unsealed release.
          cat > /tmp/t1-3.sql <<'SQL'
          begin;
          do $d$
          declare orig text; src text;
          begin
            orig := pg_get_functiondef('public.start_learning_session(uuid)'::regprocedure);
            src := replace(orig, E'\n       and r.status in (''PUBLISHED'', ''SUPERSEDED'')', '');
            if src = orig then raise exception 'the plant did not remove the sealed-and-published clause'; end if;
            execute src;
          end $d$;
          select test_id, case when ok then 't' else 'f' end, detail from selftest.run_quick_canonical() where test_id = 'QAC-T11';
          rollback;
          SQL
          red QAC-T11 'against an INGESTED release' /tmp/t1-3.sql

      # ADR-0020's three red cases, named outright by Task 2 §9: "plant an
      # evaluation path that writes an audit row without the evaluation actor
      # and require the property to name it; plant a persona row pointing at a
      # real person and require negative 3 to fail by name; plant an
      # `if evaluator then allow` in an authorization path and require negative
      # 8 to fail". Same discipline as every leg above: one stack, each defect
      # inside its own transaction, rolled back before the next, and the suite
      # proven green before anything is planted.
      - name: Start a clean seeded stack for the ADR-0020 gate defects
        if: matrix.case == 'db-task2-gates'
        id: gatesT2
        uses: ./.github/actions/local-stack
      - name: Each planted ADR-0020 defect must turn its own gate red
        if: matrix.case == 'db-task2-gates'
        env:
          DB_URL: ${{ steps.gatesT2.outputs.db-url }}
        run: |
          set -e
          for f in selftest/db/fable0*.sql; do psql -v ON_ERROR_STOP=1 -q -1 -f "$f" "$DB_URL"; done
          psql -v ON_ERROR_STOP=1 -At -F ' | ' -c "select test_id, case when ok then 't' else 'f' end, detail from selftest.run_evaluation()" "$DB_URL" | tee baseT2.txt
          grep -E ' \| f \| ' baseT2.txt && { echo "::error::the Task 2 suite is already red before any defect was planted"; exit 1; } || true

          red() {   # red <test id> <expected substring> <sql file>
            psql -v ON_ERROR_STOP=1 -At -F ' | ' -f "$3" "$DB_URL" | tee "out-$1.txt"
            grep -E "^$1 \| f \|" "out-$1.txt" || { echo "::error::$1 stayed green with the defect planted"; exit 1; }
            grep -F "$2" "out-$1.txt" || { echo "::error::$1 went red but not for '$2'"; exit 1; }
          }

          # 1. an evaluation path that writes an audit row with no evaluation
          #    actor. This is audit laundering made concrete: the persona's
          #    action becomes indistinguishable from a genuine learner's, which
          #    is the whole evidential value of the dual-identity trail.
          cat > /tmp/t2-1.sql <<'SQL'
          begin;
          create or replace function public.audit_write(p_action text, p_target_table text, p_target_id text,
                                                        p_institution_id uuid, p_summary jsonb default '{}'::jsonb)
          returns bigint language plpgsql security definer set search_path = public, pg_temp as $f$
          declare v_id bigint; v_person uuid;
          begin
            select a.person_id into v_person from public.accounts a where a.auth_user_id = auth.uid();
            insert into public.audit_log (actor_auth_uid, actor_person_id, action, target_table, target_id,
                                          institution_id, summary, build_sha,
                                          evaluation_actor_person_id, evaluation_session_id)
            values (auth.uid(), v_person, p_action, p_target_table, p_target_id, p_institution_id,
                    coalesce(p_summary,'{}'::jsonb), null, null, null)
            returning id into v_id;
            return v_id;
          end $f$;
          select test_id, case when ok then 't' else 'f' end, detail from selftest.run_evaluation() where test_id = 'EVAL-P01';
          rollback;
          SQL
          red EVAL-P01 'the action reads as genuine' /tmp/t2-1.sql

          # 2. the allow-list guard neutered, so a persona row may point at a
          #    real person. An allow-list that admits is not an allow-list, and
          #    this is the control against targeting an actual learner.
          cat > /tmp/t2-2.sql <<'SQL'
          begin;
          create or replace function public.enforce_evaluation_persona()
          returns trigger language plpgsql security definer set search_path = public, pg_temp as $f$
          begin
            if tg_op = 'DELETE' then return old; end if;
            return new;
          end $f$;
          select test_id, case when ok then 't' else 'f' end, detail from selftest.run_evaluation() where test_id = 'EVAL-N03';
          rollback;
          SQL
          red EVAL-N03 'admitted to the allow-list' /tmp/t2-2.sql

          # 3. `if evaluator then allow` inside an authorization path -- the one
          #    thing ADR-0020 §3.1 forbids outright. Planted into the LIVE
          #    can_in_institution body rather than the file, so what is proven
          #    is that an evaluation override there is what makes the DEAN
          #    persona stop being refused what a DEAN is refused (INV-19).
          cat > /tmp/t2-3.sql <<'SQL'
          begin;
          do $d$
          declare orig text; src text;
          begin
            orig := pg_get_functiondef('public.can_in_institution(text, uuid)'::regprocedure);
            src := replace(orig, E'begin\n',
              E'begin\n  if exists (select 1 from public.evaluation_sessions s where s.persona_auth_user_id = auth.uid() and s.ended_at is null) then return true; end if;\n');
            if src = orig then raise exception 'the plant did not reach can_in_institution body'; end if;
            execute src;
          end $d$;
          select test_id, case when ok then 't' else 'f' end, detail from selftest.run_evaluation() where test_id = 'EVAL-N08';
          rollback;
          SQL
          red EVAL-N08 'holds CAN_DRAFT' /tmp/t2-3.sql
      # FABLE-06's three DATABASE gates. Each guards a boundary the phase moved:
      # what a learner may see of a question (F06-P01), whether a refusal also
      # says the thing exists (F06-N01), and whether INV-19 is read-only in the
      # API and not only in the UI (F06-N02). All three were green the day they
      # were written, which says nothing until each has been watched reject its
      # own defect. Same discipline as every leg above: one stack, each defect
      # inside its own transaction, rolled back before the next, and the suite
      # proven green before anything is planted.
      - name: Start a clean seeded stack for the FABLE-06 gate defects
        if: matrix.case == 'db-fable06-gates'
        id: gatesF06
        uses: ./.github/actions/local-stack
      - name: Each planted FABLE-06 defect must turn its own gate red
        if: matrix.case == 'db-fable06-gates'
        env:
          DB_URL: ${{ steps.gatesF06.outputs.db-url }}
        run: |
          set -e
          for f in selftest/db/fable0*.sql; do psql -v ON_ERROR_STOP=1 -q -1 -f "$f" "$DB_URL"; done
          psql -v ON_ERROR_STOP=1 -At -F ' | ' -c "select id, case when ok then 't' else 'f' end, detail from selftest.run_fable06()" "$DB_URL" | tee baseF06.txt
          grep -E ' \| f \| ' baseF06.txt && { echo "::error::the FABLE-06 suite is already red before any defect was planted"; exit 1; } || true

          red() {   # red <test id> <expected substring> <sql file>
            psql -v ON_ERROR_STOP=1 -At -F ' | ' -f "$3" "$DB_URL" | tee "out-$1.txt"
            grep -E "^$1 \| f \|" "out-$1.txt" || { echo "::error::$1 stayed green with the defect planted"; exit 1; }
            grep -F "$2" "out-$1.txt" || { echo "::error::$1 went red but not for '$2'"; exit 1; }
          }

          # 1. the learner projection carries the teaching text that explains why
          #    an option is wrong. This is the leak the assertion is built to
          #    catch, and it is built to catch it by the SECRET'S OWN TEXT read
          #    out of the database rather than by a guess at what the key is
          #    called -- so the plant renames nothing and still has to be found.
          cat > /tmp/f06-1.sql <<'SQL'
          begin;
          create or replace function public.sanitized_item(p_presented_item uuid)
          returns jsonb language plpgsql stable security definer set search_path = public, pg_temp as $f$
          declare v_session uuid; v jsonb;
          begin
            select p.session_id into v_session from public.presented_items p where p.id = p_presented_item;
            if v_session is null or not public.session_is_mine(v_session) then
              raise exception 'that item is not part of a session of yours';
            end if;
            select sp.muatan into v from public.session_paper(v_session) sp
             where sp.presented_item_id = p_presented_item;
            return v || jsonb_build_object('opsi',
              (select jsonb_agg(jsonb_build_object('body', o.body, 'rationale', o.rationale) order by o.label)
                 from public.item_options o
                 join public.presented_items pi on pi.item_id = o.item_id
                where pi.id = p_presented_item));
          end $f$;
          select id, case when ok then 't' else 'f' end, detail from selftest.run_fable06() where id = 'F06-P01';
          rollback;
          SQL
          red F06-P01 'RATIONALE verbatim' /tmp/f06-1.sql

          # 2. the existence oracle restored: the projection still discloses
          #    nothing, but the REFUSAL now says whether the item is real. A
          #    check that only asserted "the call was refused" would pass on
          #    this, which is why it compares the two refusals to each other.
          cat > /tmp/f06-2.sql <<'SQL'
          begin;
          create or replace function public.sanitized_item(p_presented_item uuid)
          returns jsonb language plpgsql stable security definer set search_path = public, pg_temp as $f$
          declare v_session uuid; v jsonb;
          begin
            select p.session_id into v_session from public.presented_items p where p.id = p_presented_item;
            if v_session is null then
              raise exception 'no such presented item';
            end if;
            if not public.session_is_mine(v_session) then
              raise exception 'that item is not part of a session of yours';
            end if;
            select sp.muatan into v from public.session_paper(v_session) sp
             where sp.presented_item_id = p_presented_item;
            return v;
          end $f$;
          select id, case when ok then 't' else 'f' end, detail from selftest.run_fable06() where id = 'F06-N01';
          rollback;
          SQL
          red F06-N01 'existence is an oracle' /tmp/f06-2.sql

          # 3. INV-19 broken in the API while the UI is untouched: one endpoint
          #    in the derived dean-denied set stops enforcing its capability and
          #    starts accepting a dean. Planted by NEUTERING the live check
          #    rather than by granting the capability -- granting it would take
          #    the endpoint OUT of the derived set, which is the vacuity this
          #    gate's floor guard exists for and not the property under test.
          #    The capability literal stays in the body, which under the OLD
          #    prosrc-derived population was the only way this plant could be
          #    seen at all. It is kept because a neutered check is still a real
          #    regression -- but after L3-F02 it is NOT evidence that a DELETED
          #    check is caught; 3b below is.
          cat > /tmp/f06-3.sql <<'SQL'
          begin;
          do $d$
          declare orig text; src text;
          begin
            orig := pg_get_functiondef('public.open_briefing(uuid)'::regprocedure);
            src := replace(orig, 'if not public.can_in_institution(''CAN_ASSIGN_LEARNING'', v_inst)',
                                 'if false and public.can_in_institution(''CAN_ASSIGN_LEARNING'', v_inst)');
            if src = orig then raise exception 'the plant did not reach the open_briefing body'; end if;
            execute src;
          end $d$;
          select id, case when ok then 't' else 'f' end, detail from selftest.run_fable06() where id = 'F06-N02';
          rollback;
          SQL
          red F06-N02 'open_briefing (ACCEPTED' /tmp/f06-3.sql

          # 3b. L3-F02: the plant the mechanism above could NOT catch. Layer-3
          #     DELETED save_certificate_template's capability check outright.
          #     The old derivation read capability names out of pg_proc.prosrc,
          #     so the endpoint left the population it was supposed to fail in,
          #     the floor of 18 against a set of 21 absorbed the loss, and the
          #     whole 173-entry contract stayed green with a DEAN able to write.
          #     The population is now declared in client_rpc_registry, which
          #     `create or replace` does not touch. Plant 3 above is kept, but it
          #     is NOT evidence for this case: it deliberately leaves the
          #     capability literal in the body.
          cat > /tmp/f06-3b.sql <<'SQL'
          begin;
          do $d$
          declare orig text; src text;
          begin
            orig := pg_get_functiondef('public.save_certificate_template(uuid,uuid,uuid,text,text)'::regprocedure);
            src := replace(orig,
              '  if not public.can_in_institution(''CAN_PUBLISH'', p_institution) then' || chr(10) ||
              '    raise exception ''the certificate template manager requires CAN_PUBLISH in the owning institution'';' || chr(10) ||
              '  end if;' || chr(10), '');
            if src = orig then raise exception 'the plant did not reach the save_certificate_template body'; end if;
            execute src;
          end $d$;
          select id, case when ok then 't' else 'f' end, detail from selftest.run_fable06() where id = 'F06-N02';
          rollback;
          SQL
          red F06-N02 'ACCEPTED' /tmp/f06-3b.sql

          # 3c. L3-F02, the cardinality trick: three guards deleted at once. The
          #     old floor of 18 against 21 passed exactly this. Membership, not
          #     cardinality, is the closure now.
          cat > /tmp/f06-3c.sql <<'SQL'
          begin;
          do $d$
          declare orig text; src text;
          begin
            orig := pg_get_functiondef('public.run_mcq_quality(uuid)'::regprocedure);
            src := replace(orig,
              '  if not public.can_in_institution(''CAN_DRAFT'', v_inst) then' || chr(10) ||
              '    raise exception ''running the MCQ quality pass requires CAN_DRAFT in the owning institution'';' || chr(10) ||
              '  end if;' || chr(10), '');
            if src = orig then raise exception 'the plant did not reach run_mcq_quality'; end if;
            execute src;
          end $d$;
          select id, case when ok then 't' else 'f' end, detail from selftest.run_fable06() where id = 'F06-N02';
          rollback;
          SQL
          red F06-N02 'run_mcq_quality (ACCEPTED' /tmp/f06-3c.sql

          # 3d. L3-F02: a DECLARATION stricter than the implementation. The
          #     endpoint still refuses a dean, so nothing about INV-19 changes --
          #     but the actor the declaration excludes is let in, which is the
          #     registry telling the truth about a contract the code does not keep.
          cat > /tmp/f06-3d.sql <<'SQL'
          begin;
          update public.client_rpc_registry set authorization_requirement = 'CAN_PUBLISH'
           where function_name = 'run_mcq_quality';
          select id, case when ok then 't' else 'f' end, detail from selftest.run_fable06() where id = 'F06-N02';
          rollback;
          SQL
          red F06-N02 'declared CAPABILITY CAN_PUBLISH' /tmp/f06-3d.sql

          # 3e. L3-F02: the registry escape. Removing an endpoint's declaration
          #     row takes it out of the population -- and trips the grant-derived
          #     closure that has been there since 0060, surfaced by F06-P08.
          cat > /tmp/f06-3e.sql <<'SQL'
          begin;
          delete from public.client_rpc_registry where function_name = 'save_certificate_template';
          select id, case when ok then 't' else 'f' end, detail from selftest.run_fable06() where id = 'F06-P08';
          rollback;
          SQL
          red F06-P08 'no exposure class' /tmp/f06-3e.sql

          # 3f. L3-F03: the guard 0085 added to the four authoring endpoints,
          #     watched by the test that proves it rather than only by the
          #     migration's own terminal block, which runs once.
          cat > /tmp/f06-3f.sql <<'SQL'
          begin;
          do $d$
          declare orig text; src text;
          begin
            orig := pg_get_functiondef('public.validate_course_content(uuid)'::regprocedure);
            src := replace(orig,
              '  if not public.can_in_institution(''CAN_DRAFT'', v_inst) then' || chr(10) ||
              '    raise exception ''validating course content requires CAN_DRAFT in the owning institution'';' || chr(10) ||
              '  end if;' || chr(10), '');
            if src = orig then raise exception 'the plant did not reach validate_course_content'; end if;
            execute src;
          end $d$;
          select id, case when ok then 't' else 'f' end, detail from selftest.run_fable06() where id = 'F06-N06';
          rollback;
          SQL
          red F06-N06 'accepted a DEAN holding no capability' /tmp/f06-3f.sql

          # 3g. Q-12: the learner doorway must add no authority. It returns what
          #     may_start_assessment() accepts; stop deferring to that predicate
          #     and a learner of another tenant sees someone else's class work.
          cat > /tmp/f06-3g.sql <<'SQL'
          begin;
          do $d$
          declare orig text; src text;
          begin
            orig := pg_get_functiondef('public.my_open_assessments()'::regprocedure);
            src := replace(orig, 'and (select s.ok from public.may_start_assessment(aa.id) s)', '');
            if src = orig then raise exception 'the plant did not reach my_open_assessments'; end if;
            execute src;
          end $d$;
          select id, case when ok then 't' else 'f' end, detail from selftest.run_fable06() where id = 'Q12-N01';
          rollback;
          SQL
          red Q12-N01 'a learner of another institution discovered it' /tmp/f06-3g.sql

          # 3h. UX-1 Slice 2: the orientation window must not become a doorway.
          #     Authorization boundary -- stop delegating to may_start_assessment
          #     and a learner of another tenant reads someone else's assignment.
          cat > /tmp/f06-3h.sql <<'SQL'
          begin;
          do $d$
          declare orig text; src text;
          begin
            orig := pg_get_functiondef('public.assessment_orientation(uuid)'::regprocedure);
            src := replace(orig, 'and (select e.ok from public.may_start_assessment(aa.id) e)', '');
            if src = orig then raise exception 'the plant did not reach assessment_orientation'; end if;
            execute src;
          end $d$;
          select id, case when ok then 't' else 'f' end, detail from selftest.run_fable06() where id = 'UX1-S2-ORIENT-01';
          rollback;
          SQL
          red UX1-S2-ORIENT-01 'a learner of another institution read the orientation' /tmp/f06-3h.sql

          # 3i. The distinction itself: orientation that starts a session to
          #     answer itself has spent the single attempt it was meant to let
          #     the learner think about.
          cat > /tmp/f06-3i.sql <<'SQL'
          begin;
          create or replace function public.assessment_orientation(p_assessment_assignment uuid)
          returns table (mode public.assessment_mode, title text, item_count smallint, allows_pause boolean,
                         hesitation_window_seconds integer, opens_at timestamptz, closes_at timestamptz,
                         attempt_limit smallint, attempts_used integer)
          language plpgsql security definer set search_path = public, pg_temp as $f$
          declare v_s uuid;
          begin
            v_s := public.start_learning_session(p_assessment_assignment);
            return query select st.mode, 'x'::text, st.item_count::smallint, st.allows_pause,
                                st.hesitation_window_seconds, null::timestamptz, st.authoritative_deadline,
                                1::smallint, 1
                           from public.session_state(v_s) st;
          end $f$;
          select id, case when ok then 't' else 'f' end, detail from selftest.run_fable06() where id = 'UX1-S2-ORIENT-01';
          rollback;
          SQL
          red UX1-S2-ORIENT-01 'looking changed the session count' /tmp/f06-3i.sql

          # 4. the provenance constraint as 0082 wrote it -- catalogue version and
          #    report id required, template id and template version not. Found by
          #    the second eye (G1) and repaired by 0083; planted here so the
          #    repair cannot be quietly dropped by a later migration.
          cat > /tmp/f06-4.sql <<'SQL'
          begin;
          alter table public.briefings drop constraint briefings_ready_carries_provenance;
          alter table public.briefings
            add constraint briefings_ready_carries_provenance
            check (state in ('COLLECTING','GENERATING')
                   or (catalogue_version is not null and generated_report_id is not null));
          select id, case when ok then 't' else 'f' end, detail from selftest.run_fable06() where id = 'F06-N04';
          rollback;
          SQL
          red F06-N04 'template_version (G1)' /tmp/f06-4.sql

          # 5. the synthetic-fixture boundary forced fail-open (L3-F01). The
          #    predicate every credential seed consults is redefined to a
          #    constant true; F06-N05 must catch that clearing the marker no
          #    longer refuses.
          cat > /tmp/f06-5.sql <<'SQL'
          begin;
          create or replace function public.synthetic_fixtures_permitted() returns boolean
            language sql stable security definer set search_path=public,pg_temp as $f$ select true $f$;
          select id, case when ok then 't' else 'f' end, detail from selftest.run_fable06() where id='F06-N05';
          rollback;
          SQL
          red F06-N05 'fail-open again' /tmp/f06-5.sql

      - name: Start a clean seeded stack for the first-login tour gate defects
        if: matrix.case == 'db-tour-gates'
        id: gatesTour
        uses: ./.github/actions/local-stack
      - name: Each planted tour defect must turn its own gate red
        if: matrix.case == 'db-tour-gates'
        env:
          DB_URL: ${{ steps.gatesTour.outputs.db-url }}
        run: |
          set -e
          for f in selftest/db/fable0*.sql; do psql -v ON_ERROR_STOP=1 -q -1 -f "$f" "$DB_URL"; done

          # THE CONTROL RUNS INSIDE A TRANSACTION AND IS ROLLED BACK, which the
          # first version of this job did not do -- and CI caught it.
          # `run_fable06()` adds a second CLASS node to the bootstrap tenant, and
          # a bare `psql -c` COMMITS it. `fable04.sql:407` then selects that
          # tenant's class with an unordered `limit 1`, so plant 8 below --
          # which is the only plant in this workflow that drives `run_fable04()`
          # -- was arbitrarily handed either the class `boot-guru` is scoped to
          # or the one F06 had just created, and on the second it went red for
          # "the educator was refused" instead of for the title. Red for the
          # wrong reason is exactly what `red()`'s second grep exists to catch.
          #
          # The harness has no reason to persist suite state, so it no longer
          # does. The unordered `limit 1` is a KNOWN RESIDUAL of the db suite
          # and is left where it is: it belongs to whoever owns fable04, not to
          # a terminology change, and fresh replay remains the authoritative
          # form.
          cat > /tmp/tour-base.sql <<'SQL'
          begin;
          select id, case when ok then 't' else 'f' end, detail from selftest.run_fable06();
          rollback;
          SQL
          psql -v ON_ERROR_STOP=1 -At -F ' | ' -f /tmp/tour-base.sql "$DB_URL" | tee baseTour.txt
          grep -E ' \| f \| ' baseTour.txt && { echo "::error::the suite is already red before any tour defect was planted"; exit 1; } || true

          red() {   # red <test id> <expected substring> <sql file>
            psql -v ON_ERROR_STOP=1 -At -F ' | ' -f "$3" "$DB_URL" | tee "out-$1.txt"
            grep -E "^$1 \| f \|" "out-$1.txt" || { echo "::error::$1 stayed green with the defect planted"; exit 1; }
            grep -F "$2" "out-$1.txt" || { echo "::error::$1 went red but not for '$2'"; exit 1; }
          }

          # 1. THE SHARED DEVICE, opened. The own-row policy is replaced with
          #    one that admits any authenticated reader -- which is the exact
          #    shape a "simplify the policy" edit would take, and it does not
          #    trip the USING (true) lint because it still names a predicate.
          cat > /tmp/tour-1.sql <<'SQL'
          begin;
          drop policy person_tour_state_select_own on public.person_tour_state;
          create policy person_tour_state_select_own on public.person_tour_state
            for select to authenticated using (public.current_person_id() is not null);
          select id, case when ok then 't' else 'f' end, detail from selftest.run_fable06() where id='TOUR-N01';
          rollback;
          SQL
          red TOUR-N01 'not theirs' /tmp/tour-1.sql

          # 2. THE DERIVATION REPLACED BY A COALESCE. person_id is taken from
          #    the caller when the caller supplies one. This is the single most
          #    likely wrong edit on this table and the one RLS cannot catch,
          #    because every write arrives through a definer function running as
          #    the owner, where RLS does not apply.
          cat > /tmp/tour-2.sql <<'SQL'
          begin;
          create or replace function public.enforce_tour_state_write()
          returns trigger language plpgsql security definer set search_path = public, pg_temp as $f$
          declare v_person uuid; v_limit smallint;
          begin
            if tg_op = 'DELETE' then raise exception 'tour state is never deleted'; end if;
            if tg_op = 'INSERT' then
              v_person := public.current_person_id();
              if v_person is null then raise exception 'no authenticated person'; end if;
              new.person_id := coalesce(new.person_id, v_person);
              new.created_at := now(); new.updated_at := now(); return new;
            end if;
            if new.auto_shown_count < old.auto_shown_count then raise exception 'never uncounted'; end if;
            if old.completed_at is not null and new.completed_at is distinct from old.completed_at then
              raise exception 'stays completed'; end if;
            if old.suppressed_at is not null and new.suppressed_at is distinct from old.suppressed_at then
              raise exception 'stays suppressed'; end if;
            select r.auto_presentation_limit into v_limit from public.tour_registry r
             where r.tour_key = new.tour_key and r.tour_version = new.tour_version;
            if new.auto_shown_count > v_limit then raise exception 'over the declared limit'; end if;
            new.updated_at := now(); return new;
          end $f$;
          select id, case when ok then 't' else 'f' end, detail from selftest.run_fable06() where id='TOUR-N01';
          rollback;
          SQL
          red TOUR-N01 'session holder' /tmp/tour-2.sql

          # 3. SUPPRESSION MADE REVOCABLE. The one guard that stops a deliberate
          #    replay from restoring automatic presentation is removed, and
          #    nothing else changes.
          cat > /tmp/tour-3.sql <<'SQL'
          begin;
          create or replace function public.enforce_tour_state_write()
          returns trigger language plpgsql security definer set search_path = public, pg_temp as $f$
          declare v_person uuid; v_limit smallint;
          begin
            if tg_op = 'DELETE' then raise exception 'tour state is never deleted'; end if;
            if tg_op = 'INSERT' then
              v_person := public.current_person_id();
              if v_person is null then raise exception 'no authenticated person'; end if;
              new.person_id := v_person; new.created_at := now(); new.updated_at := now(); return new;
            end if;
            if new.person_id <> old.person_id or new.tour_key <> old.tour_key
               or new.tour_version <> old.tour_version then raise exception 'identity is immutable'; end if;
            if new.auto_shown_count < old.auto_shown_count then raise exception 'never uncounted'; end if;
            if old.completed_at is not null and new.completed_at is distinct from old.completed_at then
              raise exception 'stays completed'; end if;
            select r.auto_presentation_limit into v_limit from public.tour_registry r
             where r.tour_key = new.tour_key and r.tour_version = new.tour_version;
            if new.auto_shown_count > v_limit then raise exception 'over the declared limit'; end if;
            new.updated_at := now(); return new;
          end $f$;
          select id, case when ok then 't' else 'f' end, detail from selftest.run_fable06() where id='TOUR-N02';
          rollback;
          SQL
          red TOUR-N02 'un-dismissed' /tmp/tour-3.sql

          # 4. A FOURTH AUTOMATIC PRESENTATION, through an off-by-one. `<`
          #    becomes `<=` in the one expression that decides whether to show
          #    the tour again -- the product ruling lost to a character.
          cat > /tmp/tour-4.sql <<'SQL'
          begin;
          create or replace function public.my_tour_state(p_tour_key text)
          returns table (tour_key text, tour_version integer, should_auto_present boolean,
                         auto_shown_count smallint, auto_presentation_limit smallint,
                         completed boolean, suppressed boolean, last_shown_at timestamptz)
          language sql stable security definer set search_path = public, pg_temp as $f$
            select r.tour_key, r.tour_version,
                   (public.current_person_id() is not null and s.completed_at is null
                    and s.suppressed_at is null
                    and coalesce(s.auto_shown_count, 0::smallint) <= r.auto_presentation_limit),
                   coalesce(s.auto_shown_count, 0::smallint), r.auto_presentation_limit,
                   s.completed_at is not null, s.suppressed_at is not null, s.last_shown_at
              from public.tour_registry r
              left join public.person_tour_state s on s.tour_key = r.tour_key
                   and s.tour_version = r.tour_version and s.person_id = public.current_person_id()
             where r.tour_key = p_tour_key and r.tour_version = public.current_tour_version(p_tour_key)
               and public.current_person_id() is not null
          $f$;
          select id, case when ok then 't' else 'f' end, detail from selftest.run_fable06() where id='TOUR-P01';
          rollback;
          SQL
          red TOUR-P01 'FOURTH' /tmp/tour-4.sql

          # 5. THE VERSION MADE CLIENT-DECLARABLE. If the application can write
          #    tour_registry it can make a tour new whenever it likes, which is
          #    the derived-from-deployment failure arriving by the back door.
          cat > /tmp/tour-5.sql <<'SQL'
          begin;
          grant insert on public.tour_registry to authenticated;
          create policy tour_registry_insert on public.tour_registry
            for insert to authenticated with check (public.current_person_id() is not null);
          select id, case when ok then 't' else 'f' end, detail from selftest.run_fable06() where id='TOUR-N02';
          rollback;
          SQL
          red TOUR-N02 'write grant on tour_registry' /tmp/tour-5.sql

          # 6. TOUR STATE REACHING A CALCULATOR. A catalogue calculator is
          #    rewritten to count tour rows: presentation state becoming a
          #    reported number, which is the boundary this contract exists to
          #    hold.
          cat > /tmp/tour-6.sql <<'SQL'
          begin;
          create or replace function public.calc_class_participants(p_node uuid, p_institution uuid, p_catalogue text)
          returns jsonb language sql stable security definer set search_path = public, pg_temp as $f$
            select jsonb_build_object('value', (select count(*) from public.person_tour_state), 'sample', 1)
          $f$;
          select id, case when ok then 't' else 'f' end, detail from selftest.run_fable06() where id='TOUR-N03';
          rollback;
          SQL
          red TOUR-N03 'reading tour state' /tmp/tour-6.sql

          # 7. AN EVIDENCE-SHAPED COLUMN ARRIVING BY ALTER TABLE. Nothing reads
          #    it yet, which is exactly why a column-shape assertion is the
          #    thing that catches it -- the day something does read it is too
          #    late.
          cat > /tmp/tour-7.sql <<'SQL'
          begin;
          alter table public.person_tour_state add column session_id uuid;
          select id, case when ok then 't' else 'f' end, detail from selftest.run_fable06() where id='TOUR-N03';
          rollback;
          SQL
          red TOUR-N03 'evidence-shaped column' /tmp/tour-7.sql

          # 8. THE QUICK-ASSESSMENT TITLE REVERTED. 0090's rename undone in the
          #    generated label only; F04-T04 owns that assertion and must say so.
          cat > /tmp/tour-8.sql <<'SQL'
          begin;
          do $f$ declare s text; begin
            s := pg_get_functiondef('public.launch_quick_assessment(uuid,uuid,integer,integer)'::regprocedure);
            s := replace(s, 'v_label := ''Uji Cepat', 'v_label := ''Kuis Cepat');
            execute s;
          end $f$;
          select test_id, case when ok then 't' else 'f' end, detail from selftest.run_fable04() where test_id='F04-T04';
          rollback;
          SQL
          red F04-T04 'losing the label' /tmp/tour-8.sql

      - name: Local stack (WP1 authorization-boundary gates)
        if: matrix.case == 'db-wp1-gates'
        id: gatesWp1
        uses: ./.github/actions/local-stack
      - name: Each planted boundary defect must turn F06-P10 red for its own reason
        if: matrix.case == 'db-wp1-gates'
        env:
          DB_URL: ${{ steps.gatesWp1.outputs.db-url }}
        run: |
          set -e
          for f in selftest/db/fable0*.sql; do psql -v ON_ERROR_STOP=1 -q -1 -f "$f" "$DB_URL"; done

          # Control inside a transaction and rolled back, for the reason
          # db-tour-gates records above: run_fable06() commits a second CLASS
          # node into the bootstrap tenant, and a committed one changes what the
          # plants below are measured against.
          cat > /tmp/wp1-base.sql <<'SQL'
          begin;
          -- EVERY CASE THIS JOB PLANTS AGAINST, not only the one it started
          -- with. The plants below reach F06-P11, F06-P12 and F06-P13 too, and
          -- a control that did not cover them would let "already red" be read
          -- as "the plant worked".
          select id, case when ok then 't' else 'f' end, detail from selftest.run_fable06()
           where id in ('F06-P09','F06-P10','F06-P11','F06-P12','F06-P13');
          rollback;
          SQL
          psql -v ON_ERROR_STOP=1 -At -F ' | ' -f /tmp/wp1-base.sql "$DB_URL" | tee baseWp1.txt
          grep -E ' \| f \| ' baseWp1.txt && { echo "::error::a WP1 case is already red before any defect was planted"; exit 1; } || true
          [ "$(grep -cE '^F06-P(09|1[0-3]) \| t \|' baseWp1.txt)" = "5" ] \
            || { echo "::error::the control did not report all five WP1 cases green; it is not a control"; exit 1; }

          red() {   # red <test id> <expected substring> <sql file>
            psql -v ON_ERROR_STOP=1 -At -F ' | ' -f "$3" "$DB_URL" | tee "out-$1.txt"
            grep -E "^$1 \| f \|" "out-$1.txt" || { echo "::error::$1 stayed green with the defect planted"; exit 1; }
            grep -F "$2" "out-$1.txt" || { echo "::error::$1 went red but not for '$2'"; exit 1; }
          }
          p10() { printf 'select id, case when ok then %s else %s end, detail from selftest.run_fable06() where id=%s;\nrollback;\n' "'t'" "'f'" "'F06-P10'" >> "$1"; }
          # the same, for a plant that reads a different case. p10 predates the
          # source-bound work, when F06-P10 was the only case this job drove.
          case_of() { printf 'select id, case when ok then %s else %s end, detail from selftest.run_fable06() where id=%s;\nrollback;\n' "'t'" "'f'" "'$2'" >> "$1"; }

          # 1. THE DEFECT ITSELF, restored verbatim: audience in the tenant, and
          #    the node never compared to anything. This is the state of
          #    metric_evaluate before 0091 and the single most important plant
          #    here -- if F06-P10 survives it, the test is decorative.
          cat > /tmp/wp1-1.sql <<'SQL'
          begin;
          create or replace function public.metric_evaluate(p_metric_id text, p_node uuid, p_institution uuid, p_catalogue_version text default null)
          returns jsonb language plpgsql stable security definer set search_path = public, pg_temp as $f$
          declare v_cat text; d public.metric_definitions; v_out jsonb; v_permitted boolean; v_me uuid;
          begin
            v_cat := coalesce(p_catalogue_version, public.current_metric_catalogue());
            if v_cat is null then raise exception 'no live metric catalogue'; end if;
            v_me := public.current_person_id();
            select * into d from public.metric_definitions m where m.catalogue_version = v_cat and m.metric_id = p_metric_id;
            if d.metric_id is null then return jsonb_build_object('status','unavailable','statement_key','laporan.metrik.tidak_dikenal'); end if;
            v_permitted := public.is_system_admin()
              or exists (select 1 from public.role_assignments ra
                          where ra.person_id = v_me and ra.institution_id = p_institution and ra.revoked_at is null
                            and now() >= ra.valid_from and now() < ra.valid_until and ra.role = any(d.allowed_audiences))
              or (d.scope = 'LEARNER_IN_INSTITUTION' and v_me is not null and p_node = v_me and 'STUDENT' = any(d.allowed_audiences));
            if not v_permitted then return jsonb_build_object('status','not_permitted','statement_key','laporan.metrik.bukan_untuk_anda'); end if;
            if d.deprecated then return jsonb_build_object('metric_id',p_metric_id,'catalogue_version',v_cat,'status','deprecated','label_key',d.label_key,'statement_key',coalesce(d.deprecation_note_key,'laporan.metrik.diganti')); end if;
            execute format('select public.%I($1, $2, $3)', 'calc_' || d.calculation_key) into v_out using p_node, p_institution, v_cat;
            if coalesce((v_out ->> 'sample')::numeric, 0) < d.minimum_sample then
              return jsonb_build_object('metric_id',p_metric_id,'catalogue_version',v_cat,'status','below_minimum','label_key',d.label_key,'statement_key','laporan.metrik.belum_cukup_data','have',coalesce((v_out->>'sample')::numeric,0),'needed',d.minimum_sample); end if;
            return jsonb_build_object('metric_id',p_metric_id,'catalogue_version',v_cat,'status','ok','scope',d.scope,'label_key',d.label_key,'meaning_key',d.meaning_key,'allowed_visualizations',to_jsonb(d.allowed_visualizations),'value',v_out->'value','sample',v_out->'sample');
          end $f$;
          SQL
          p10 /tmp/wp1-1.sql
          red F06-P10 'A3 sibling department' /tmp/wp1-1.sql

          # 2. REMOVED, AND THE REMOVAL IS THE POINT. This planted a classifier
          #    that trusted the catalogue's declared scope instead of reading
          #    the calculator -- a defect in `metric_computes_tenant_wide`,
          #    which this commit DELETES. Inference is gone, so there is no
          #    classifier left to plant a wrong one into; plants 7 to 14 below
          #    aim at the declaration that replaced it and at the boundary that
          #    makes a wrong declaration harmless.
          #
          #    A plant aimed at something that no longer exists does not fail,
          #    it PASSES: `create or replace` would have made an orphan function
          #    nobody calls, and F06-P10 would have stayed green while this job
          #    reported success. That is why plants 7 onward begin by asserting
          #    the shape they land on.

          # 3. THE TWO HALVES COLLECTED FROM TWO ASSIGNMENTS. Audience from one
          #    row, containment from another. Every individual check still
          #    passes; the conjunction is what fails, and only a reader wearing
          #    two hats can show it.
          cat > /tmp/wp1-3.sql <<'SQL'
          begin;
          create or replace function public.audience_on_node(p_audiences public.app_role[], p_node uuid)
          returns boolean language plpgsql stable security definer set search_path = public, pg_temp as $f$
          declare v_person uuid;
          begin
            if p_audiences is null or p_node is null then return false; end if;
            v_person := public.current_person_id();
            if v_person is null then return false; end if;
            return public.node_in_my_scope(p_node)
               and exists (select 1 from public.role_assignments ra
                            where ra.person_id = v_person and ra.revoked_at is null
                              and now() >= ra.valid_from and now() < ra.valid_until
                              and ra.role = any (p_audiences));
          exception when others then return false;
          end $f$;
          SQL
          p10 /tmp/wp1-3.sql
          red F06-P10 'two hats' /tmp/wp1-3.sql

          # 4. THE SHELF REOPENED. The evaluator stays repaired and yesterday's
          #    institution-wide report is handed over anyway -- a boundary with
          #    a second door.
          cat > /tmp/wp1-4.sql <<'SQL'
          begin;
          drop policy generated_reports_select on public.generated_reports;
          create policy generated_reports_select on public.generated_reports for select to authenticated
            using (public.is_member_of_institution(institution_id));
          SQL
          p10 /tmp/wp1-4.sql
          red F06-P10 'off the shelf' /tmp/wp1-4.sql

          # 5. A NAMED LEARNER CONTAINED BY THE TENANT RATHER THAN BY THE TREE,
          #    which is the person-shaped version of the original defect.
          #
          #    RE-AIMED. This planted `audience_over_learner`, 0091's boolean
          #    form -- which this commit DROPS, because the engine now needs the
          #    NODE that authorized the reader in order to bind it as the
          #    boundary. The plant kept applying cleanly to a function nothing
          #    calls and F06-P10 stayed green, which is the same way a plant
          #    stops planting: not by failing, but by passing. It now lands on
          #    `audience_scope_over_learner` and is read by F06-P12, because
          #    since MC-2 the head of department reaches a named learner through
          #    the audited path rather than the metric route.
          cat > /tmp/wp1-5.sql <<'SQL'
          begin;
          create or replace function public.audience_scope_over_learner(
            p_audiences public.app_role[], p_learner uuid, p_institution uuid)
          returns uuid language plpgsql stable security definer set search_path = public, pg_temp as $f$
          declare v_person uuid; v_node uuid;
          begin
            if p_audiences is null or p_learner is null or p_institution is null then return null; end if;
            v_person := public.current_person_id();
            if v_person is null then return null; end if;
            select ra.scope_node_id into v_node from public.role_assignments ra
             where ra.person_id = v_person and ra.institution_id = p_institution
               and ra.revoked_at is null and now() >= ra.valid_from and now() < ra.valid_until
               and ra.role = any (p_audiences) and ra.scope_node_id is not null
             limit 1;
            return v_node;
          end $f$;
          SQL
          case_of /tmp/wp1-5.sql F06-P12
          red F06-P12 'sibling department' /tmp/wp1-5.sql

          # 6. THE REPORT NODE FORWARDED UNREAD AGAIN, so an artefact row is
          #    written naming another school's node even though every metric in
          #    it was refused.
          cat > /tmp/wp1-6.sql <<'SQL'
          begin;
          create or replace function public.generate_report(p_template uuid, p_scope_node uuid, p_catalogue_version text default null)
          returns jsonb language plpgsql security definer set search_path = public, pg_temp as $f$
          declare t public.report_templates; v_cat text; v_entries jsonb := '[]'::jsonb;
                  v_row record; v_one jsonb; v_id uuid; n_ok int; n_omitted int;
          begin
            select * into t from public.report_templates where id = p_template;
            if t.id is null then raise exception 'no such report template'; end if;
            v_cat := coalesce(p_catalogue_version, public.current_metric_catalogue());
            if not public.is_member_of_institution(t.institution_id) then
              raise exception 'that report belongs to another institution'; end if;
            for v_row in select m.metric_id, m.ordinal, m.visualization from public.report_template_metrics m
                          where m.template_id = p_template order by m.ordinal loop
              v_one := public.metric_evaluate(v_row.metric_id, p_scope_node, t.institution_id, v_cat);
              v_entries := v_entries || jsonb_build_array(v_one || jsonb_build_object('ordinal', v_row.ordinal, 'visualization', v_row.visualization));
            end loop;
            select count(*) filter (where e ->> 'status' = 'ok'), count(*) filter (where e ->> 'status' <> 'ok')
              into n_ok, n_omitted from jsonb_array_elements(v_entries) e;
            insert into public.generated_reports (institution_id, standard_report, template_id, template_version,
              catalogue_version, scope_node_id, generated_by_person_id, body)
            values (t.institution_id, t.standard_report, t.id, t.template_version, v_cat, p_scope_node,
              public.current_person_id(), jsonb_build_object('title_key', t.title_key, 'branding', t.branding,
                'entries', v_entries, 'shown', n_ok, 'omitted', n_omitted)) returning generated_reports.id into v_id;
            return jsonb_build_object('generated_report_id', v_id, 'catalogue_version', v_cat, 'template_version',
              t.template_version, 'title_key', t.title_key, 'branding', t.branding, 'entries', v_entries,
              'shown', n_ok, 'omitted', n_omitted);
          end $f$;
          SQL
          p10 /tmp/wp1-6.sql
          red F06-P10 'another school' /tmp/wp1-6.sql

          # THE SIGNATURE AND SHAPE THESE PLANTS LAND ON, asserted first. A plant
          # aimed at something that has moved stops planting and starts passing,
          # and the failure then reads as "the protection broke" rather than "the
          # plant missed". This fails HERE, naming the cause.
          psql -v ON_ERROR_STOP=1 -At -c "select to_regclass('public.scoped_official_sessions') is not null and to_regclass('public.metric_calculator_scope') is not null" "$DB_URL" | grep -qx t \
            || { echo "::error::the scoped source or the governing-scope contract is gone; re-aim these plants before trusting this job"; exit 1; }

          # ── the boundary ──────────────────────────────────────────────────
          # 7. THE NARROWING REMOVED FROM THE SOURCE. The calculator is still
          #    pointed at the scoped view and the view no longer narrows -- which
          #    is the whole architecture undone in one line, and the one edit a
          #    future author is most likely to make while "simplifying".
          cat > /tmp/wp1-1.sql <<'SQL'
          begin;
          create or replace view public.scoped_official_sessions as select s.* from public.official_sessions s;
          SQL
          case_of /tmp/wp1-1.sql F06-P11
          red F06-P11 'returned 2, expected 1' /tmp/wp1-1.sql

          # 8. THE BOUNDARY SILENTLY FALLING BACK TO TENANT-WIDE. The binding is
          #    still read and the tenant is still checked; only the `jalur`
          #    containment is gone, so every bound read widens to the whole
          #    school. This is the shape the fallback actually takes in practice
          #    -- the first version of this plant made an UNBOUND read permissive
          #    instead, which F06-P11 could not see because the engine always
          #    binds something before it dispatches. A plant aimed at a state the
          #    test never reaches is a plant that passes.
          cat > /tmp/wp1-2.sql <<'SQL'
          begin;
          create or replace function public.row_in_metric_boundary(
            p_institution uuid, p_node uuid, p_person uuid)
          returns boolean language plpgsql stable set search_path = public, pg_temp as $f$
          declare v_node uuid; v_person uuid; v_binst uuid;
          begin
            if p_institution is null then return false; end if;
            v_person := public.metric_boundary_person();
            if v_person is not null then return p_person is not null and p_person = v_person; end if;
            v_node := public.metric_boundary_node();
            if v_node is null then return false; end if;
            select n.institution_id into v_binst from public.org_nodes n where n.id = v_node;
            return v_binst is not null and v_binst = p_institution;
          end $f$;
          SQL
          case_of /tmp/wp1-2.sql F06-P11
          red F06-P11 'returned 2, expected 1' /tmp/wp1-2.sql

          # ── the contract ──────────────────────────────────────────────────
          # 9. A CALCULATOR DECLARED AT THE WRONG SCOPE. class.participants is
          #    relabelled TENANT, so the engine binds the institution root and a
          #    department-scoped reader is refused outright. The declaration
          #    decides refusal, so the failure is a refusal rather than a leak --
          #    which is the property worth pinning.
          cat > /tmp/wp1-3.sql <<'SQL'
          begin;
          update public.metric_calculator_scope set governing_scope = 'TENANT'
           where calculation_key = 'class_participants';
          SQL
          case_of /tmp/wp1-3.sql F06-P11
          red F06-P11 'returned -1, expected 1' /tmp/wp1-3.sql

          # 10. A DECLARATION REMOVED ALTOGETHER. An undeclared calculator is an
          #    unknown boundary, and an unknown boundary must be a refusal.
          cat > /tmp/wp1-4.sql <<'SQL'
          begin;
          delete from public.metric_calculator_scope where calculation_key = 'class_participants';
          SQL
          case_of /tmp/wp1-4.sql F06-P13
          red F06-P13 'no governing-scope declaration' /tmp/wp1-4.sql

          # 11. A CALCULATOR REACHING PAST ITS BOUNDARY to raw evidence. MC-2
          #    declares only the scoped sources, so the closure guard owns this.
          cat > /tmp/wp1-5.sql <<'SQL'
          begin;
          create or replace function public.calc_class_participants(
            p_node uuid, p_institution uuid, p_catalogue text)
          returns jsonb language sql stable set search_path = public, pg_temp
          begin atomic
            select jsonb_build_object('value', count(distinct s.person_id), 'sample', count(distinct s.person_id))
              from official_sessions s
             where s.institution_id = p_institution and s.class_node_id = p_node;
          end;
          SQL
          case_of /tmp/wp1-5.sql F06-P13
          red F06-P13 'does not declare' /tmp/wp1-5.sql

          # ── objective B ───────────────────────────────────────────────────
          # 12. THE ROLE SET WIDENED TO INCLUDE THE INSTITUTION ADMIN, which is
          #    the rank-shaped wrong implementation the ROLE_SET declaration
          #    exists to exclude.
          cat > /tmp/wp1-6.sql <<'SQL'
          begin;
          create or replace function public.management_learner_roles()
          returns public.app_role[] language sql immutable parallel safe
          set search_path = public, pg_temp as $f$
            select array['HEAD_OF_DEPARTMENT','DEAN','INSTITUTION_ADMIN']::public.app_role[]
          $f$;
          SQL
          case_of /tmp/wp1-6.sql F06-P12
          red F06-P12 'institution admin' /tmp/wp1-6.sql

          # 13. THE ACT GOES UNRECORDED. Everything else is correct; the audit
          #    line is renamed. An auditable read that writes nothing is the one
          #    failure a test of the payload alone would never see.
          cat > /tmp/wp1-7.sql <<'SQL'
          begin;
          do $d$
          declare s text;
          begin
            s := pg_get_functiondef('public.management_learner_detail(uuid,uuid)'::regprocedure);
            s := replace(s, '''learner_detail.opened''', '''learner_detail.unrecorded''');
            execute s;
          end $d$;
          SQL
          case_of /tmp/wp1-7.sql F06-P12
          red F06-P12 'audit row(s) for 3 opens' /tmp/wp1-7.sql

          # 14. THE METRIC ROUTE REOPENED to Management, which would put an
          #    unaudited door beside the audited one and make the record a
          #    formality.
          cat > /tmp/wp1-8.sql <<'SQL'
          begin;
          insert into public.metric_catalogue (version, note) values ('MC-99','red case');
          update public.metric_catalogue set superseded_by = 'MC-99' where version = 'MC-2';
          insert into public.metric_definitions
            (catalogue_version, metric_id, label_key, meaning_key, scope, evidence_class, minimum_sample,
             allowed_visualizations, allowed_audiences, calculation_key, deprecated, deprecation_note_key)
          select 'MC-99', d.metric_id, d.label_key, d.meaning_key, d.scope, d.evidence_class,
                 d.minimum_sample, d.allowed_visualizations,
                 case when d.metric_id = 'learner.result'
                      then array['STUDENT','EDUCATOR','HEAD_OF_DEPARTMENT','DEAN','INSTITUTION_ADMIN']::public.app_role[]
                      else d.allowed_audiences end,
                 d.calculation_key, d.deprecated, d.deprecation_note_key
            from public.metric_definitions d where d.catalogue_version = 'MC-2';
          insert into public.readiness_tiers
            (catalogue_version, tier_key, ordinal, min_mastery, max_mastery, requires_safety_gate, applies_without_post_test)
          select 'MC-99', t.tier_key, t.ordinal, t.min_mastery, t.max_mastery, t.requires_safety_gate, t.applies_without_post_test
            from public.readiness_tiers t where t.catalogue_version = 'MC-2';
          insert into public.metric_sources (catalogue_version, source_relation, why)
          select 'MC-99', s.source_relation, s.why from public.metric_sources s where s.catalogue_version = 'MC-2';
          -- carried forward because `publish_metric_catalogue` does NOT carry
          -- them and a version without them is refused by
          -- assert_question_health_observes_only. That gap is a recorded
          -- residual; here it just has to be worked around so the plant plants
          -- the thing it means to.
          insert into public.question_health_thresholds
            (catalogue_version, signal_key, min_evidence, low_watermark, high_watermark, unwired_reason_key)
          select 'MC-99', q.signal_key, q.min_evidence, q.low_watermark, q.high_watermark, q.unwired_reason_key
            from public.question_health_thresholds q where q.catalogue_version = 'MC-2';
          SQL
          case_of /tmp/wp1-8.sql F06-P12
          red F06-P12 'metric route' /tmp/wp1-8.sql

      # WP7B's eight anonymity gates. The claim -- that no ordinary authorized
      # path can produce a respondent -> answer pair -- is worth exactly as much
      # as this suite's ability to notice when it stops being true. So each of
      # the eight ways it could stop being true is planted here and the test
      # that must catch it is named. One stack, each defect inside its own
      # transaction, rolled back before the next, and the whole suite proven
      # green before anything is planted.
      - name: Local stack (WP7B anonymity gates)
        if: matrix.case == 'db-wp7-gates'
        id: gatesWp7
        uses: ./.github/actions/local-stack
      # WP8's gates: the onboarding repair, the standing client-write
      # reachability assertion, and report configuration. Same harness, same
      # declarations, same four things every plant has to prove.
      - name: Local stack (WP8 gates)
        if: matrix.case == 'db-wp8-gates'
        id: gatesWp8
        uses: ./.github/actions/local-stack
      - name: Each planted WP8 defect must turn its own F08 test red
        if: matrix.case == 'db-wp8-gates'
        env:
          DB_URL: ${{ steps.gatesWp8.outputs.db-url }}
        run: node scripts/dev/plants.mjs run --gate=db-wp8-gates

      # The systemic repair's gates: an answer is never lost to a finish (R1),
      # and a provisioned person can sign in while a stranger cannot provision
      # themselves (F-01..F-03). Same harness, same four proofs.
      - name: Local stack (systemic-repair gates)
        if: matrix.case == 'db-r1-gates'
        id: gatesR1
        uses: ./.github/actions/local-stack
      - name: Each planted systemic-repair defect must turn its own F09 test red
        if: matrix.case == 'db-r1-gates'
        env:
          DB_URL: ${{ steps.gatesR1.outputs.db-url }}
        run: node scripts/dev/plants.mjs run --gate=db-r1-gates
      # NEW-1 lives on a connection that never set app.seed_intent, which no
      # in-suite test can reproduce, so its plant is driven here against the
      # fresh-connection test F09-C01: green before, red with the defect
      # restored (for the declared reason), green again after restoration.
      - name: NEW-1 restored must turn the fresh-connection test F09-C01 red
        if: matrix.case == 'db-r1-gates'
        env:
          SUPABASE_DB_URL: ${{ steps.gatesR1.outputs.db-url }}
        run: |
          set -euo pipefail
          for f in selftest/db/fable0*.sql; do psql -v ON_ERROR_STOP=1 -q -1 -f "$f" "$SUPABASE_DB_URL"; done
          npx tsx selftest/run.ts --accept-justified-skips --only=F09-C01 | tee c01-before.txt
          psql -At -c "select pg_get_functiondef('public.handle_new_auth_user()'::regprocedure)" "$SUPABASE_DB_URL" > orig.sql
          printf ';\n' >> orig.sql
          psql -v ON_ERROR_STOP=1 -q -f selftest/plants/f02-2-fresh.sql "$SUPABASE_DB_URL"
          set +e; npx tsx selftest/run.ts --accept-justified-skips --only=F09-C01 | tee c01-planted.txt; code=${PIPESTATUS[0]}; set -e
          psql -v ON_ERROR_STOP=1 -q -f orig.sql "$SUPABASE_DB_URL"
          test "$code" != "0" || { echo "::error::F09-C01 stayed green with NEW-1 restored"; exit 1; }
          grep -q "NEW-1 is open" c01-planted.txt || { echo "::error::F09-C01 went red for the wrong reason"; exit 1; }
          npx tsx selftest/run.ts --accept-justified-skips --only=F09-C01 | tee c01-after.txt
          echo "F09-C01: green, red for the declared reason with NEW-1 restored, green after restoration"

      # BOB-01's gates: who may build a school's Bagian, Tingkat and Kelas, the
      # stable code on every refusal, and the intake's M5a place and year rules.
      # Same harness, same four proofs, against F10.
      - name: Local stack (school-structure gates)
        if: matrix.case == 'db-bob01-gates'
        id: gatesBob01
        uses: ./.github/actions/local-stack
      - name: Each planted school-structure defect must turn its own F10 test red
        if: matrix.case == 'db-bob01-gates'
        env:
          DB_URL: ${{ steps.gatesBob01.outputs.db-url }}
        run: node scripts/dev/plants.mjs run --gate=db-bob01-gates
      # The structure race lives across two committed connections, which the
      # one-transaction harness cannot hold, so its plant is driven here against
      # F10-C01: green before, red with the stale-row defect (for the declared
      # reason), green again after restoration.
      - name: The stale-row defect must turn the race test F10-C01 red
        if: matrix.case == 'db-bob01-gates'
        env:
          SUPABASE_DB_URL: ${{ steps.gatesBob01.outputs.db-url }}
        run: |
          set -euo pipefail
          for f in selftest/db/fable0*.sql selftest/db/fable10.sql; do psql -v ON_ERROR_STOP=1 -q -1 -f "$f" "$SUPABASE_DB_URL"; done
          npx tsx selftest/run.ts --accept-justified-skips --only=F10-C01 | tee c01-before.txt
          psql -At -c "select pg_get_functiondef('public.create_kelas(uuid,text,text)'::regprocedure)" "$SUPABASE_DB_URL" > orig.sql
          printf ';\n' >> orig.sql
          psql -v ON_ERROR_STOP=1 -q -f selftest/plants/bob01-c01.sql "$SUPABASE_DB_URL"
          set +e; npx tsx selftest/run.ts --accept-justified-skips --only=F10-C01 | tee c01-planted.txt; code=${PIPESTATUS[0]}; set -e
          psql -v ON_ERROR_STOP=1 -q -f orig.sql "$SUPABASE_DB_URL"
          test "$code" != "0" || { echo "::error::F10-C01 stayed green with the stale-row defect planted"; exit 1; }
          grep -q "a Kelas was created under a Tingkat being deactivated" c01-planted.txt || { echo "::error::F10-C01 went red for the wrong reason"; exit 1; }
          npx tsx selftest/run.ts --accept-justified-skips --only=F10-C01 | tee c01-after.txt
          echo "F10-C01: green, red for the declared reason with the stale row planted, green after restoration"

      # BOB-02's gates: the sample workbook materialised whole, the structured
      # package's confirmation, coded problems, who may prepare or confirm, and
      # media upload authority. Same harness, same four proofs, against F11.
      - name: Local stack (lesson-package gates)
        if: matrix.case == 'db-bob02-gates'
        id: gatesBob02
        uses: ./.github/actions/local-stack
      - name: Each planted lesson-package defect must turn its own F11 test red
        if: matrix.case == 'db-bob02-gates'
        env:
          DB_URL: ${{ steps.gatesBob02.outputs.db-url }}
        run: node scripts/dev/plants.mjs run --gate=db-bob02-gates

      # BOB-03's gates: the release path from an approved course to a published
      # release, its author, readiness at the seal, versions and refusals.
      # Same harness, same four proofs, against F12.
      - name: Local stack (release-path gates)
        if: matrix.case == 'db-bob03-gates'
        id: gatesBob03
        uses: ./.github/actions/local-stack
      - name: Each planted release-path defect must turn its own F12 test red
        if: matrix.case == 'db-bob03-gates'
        env:
          DB_URL: ${{ steps.gatesBob03.outputs.db-url }}
        run: node scripts/dev/plants.mjs run --gate=db-bob03-gates

      # BOB-04's gates: the whole learning cycle -- a course carrying its two
      # tests, one assignment making both, the draw following the marks, INV-24
      # at assignment, refusals by code. Same harness, same four proofs, on F13.
      - name: Local stack (learning-cycle gates)
        if: matrix.case == 'db-bob04-gates'
        id: gatesBob04
        uses: ./.github/actions/local-stack
      - name: Each planted learning-cycle defect must turn its own F13 test red
        if: matrix.case == 'db-bob04-gates'
        env:
          DB_URL: ${{ steps.gatesBob04.outputs.db-url }}
        run: node scripts/dev/plants.mjs run --gate=db-bob04-gates

      # BOB-06's gates: every school carries PINTAR's standard class and school
      # reports from creation, and PINTAR's rows and the provisioning pass are
      # nobody else's. Same harness, same four proofs, on F14.
      - name: Local stack (standard-report gates)
        if: matrix.case == 'db-bob06-gates'
        id: gatesBob06
        uses: ./.github/actions/local-stack
      - name: Each planted standard-report defect must turn its own F14 test red
        if: matrix.case == 'db-bob06-gates'
        env:
          DB_URL: ${{ steps.gatesBob06.outputs.db-url }}
        run: node scripts/dev/plants.mjs run --gate=db-bob06-gates

      - name: Each planted anonymity defect must turn its own F07 test red
        if: matrix.case == 'db-wp7-gates'
        env:
          DB_URL: ${{ steps.gatesWp7.outputs.db-url }}
        # The defects themselves live in selftest/plants/, declared once in
        # selftest/plants/plants.json and run by the same harness a developer
        # runs against a clone of the golden database. They used to be
        # heredocs here as well, and the two copies drifted over nothing more
        # than this file's indentation.
        run: node scripts/dev/plants.mjs run --gate=db-wp7-gates

  baseline-parity:
    name: baseline · frozen documents are what they say they are
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth 0 because assertions 4 and 5 compare this commit's manifest
      # against the previous one; a shallow clone silently skips them, which is
      # the failure mode this whole job exists to end.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Every frozen baseline document matches BASELINE-MANIFEST.json
        run: node scripts/baseline-parity.mjs

  selftest:
    name: selftest contract (strict, local stack)
    needs: [check, migrations-clean, migrations-upgrade-path, red-case]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - id: stack
        uses: ./.github/actions/local-stack
      - name: Build against the local stack and run the whole manifest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.stack.outputs.api-url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.stack.outputs.anon-key }}
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3999
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.stack.outputs.service-role-key }}
          SUPABASE_DB_URL: ${{ steps.stack.outputs.db-url }}
          CARD_PEPPER: synthetic-card-pepper-fable01-32plus
          CARD_EMAIL_DOMAIN: cards.synthetic.pintar.test
          # Not a secret: a CI-only signing key, exactly as CARD_PEPPER above.
          # The certificates it signs exist for the length of one job.
          CERT_SECRET_KEY_V1: synthetic-certificate-key-fable04-32plus
          PINTAR_BUILD_SHA: ${{ github.sha }}
          SELFTEST_APP_PORT: 3999
          SELFTEST_CI_UPSTREAM: >-
            {"check":"${{ needs.check.result }}",
             "migrations-clean":"${{ needs.migrations-clean.result }}",
