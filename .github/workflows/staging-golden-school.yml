# STAGING ONLY. The Golden School's first steps (docs/recovery/GOLDEN-SCHOOL-CONTRACT.md §5, GS-02 and GS-03): the
# staging Platform Operator signs in as a person does under Gate 3 (audit/staging/masuk.mjs: activation by the emailed
# code the first time, the password after), records the school's first administrator and gives «Admin sekolah» at its
# root through PINTAR's own screens; the administrator then signs in the same way (their activation: ONE code email;
# staging allows 30 an hour, D-092, shared). Runs audit/staging/golden-school.mjs once per edit of
# .github/staging-golden-school-request.txt on the coordinator's branch; the request's last line names the school's
# slug ("slug: <slug>"), a school founded first by found-school.yml (C1, GS-01).
#
# NEVER: production (staging's ref and database URL are checked first; production's keys are never read); any direct
# write to the database (it is read in read-only transactions); a service-role key or a server-made session; any change
# to the product, its sign-in or settings.

name: staging · Golden School, first administrator (GS-02, GS-03)

on:
  push:
    branches:
      - claude/awesome-rubin-bqxp6p
    paths:
      - .github/staging-golden-school-request.txt

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

env:
  STAGING_SUPABASE_PROJECT_REF: keijhmdtsgrfvnvocfvk
  PRODUCTION_SUPABASE_PROJECT_REF: trtlvibiybwixfumjrrx
  STAGING_ORIGIN: https://staging.pintarselalu.com
  OPERATOR_EMAIL: goldenschool+operator@pintarselalu.com

jobs:
  gs00:
    # GS-00 (CR-60): staging runs main's code and main's migrations, read by machine inside this run; red stops the walk
    name: GS-00 · staging runs main's commit and migrations
    uses: ./.github/workflows/environment-facts.yml
    with:
      scope: staging
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}

  first-admin:
    name: the school's first administrator, appointed by the operator and signing in like a person
    needs: [gs00]
    # Batch 0 (B0-A): Playwright 1.55 has no browser build for ubuntu-latest = Ubuntu 26.04
    # («Playwright does not support chromium on ubuntu26.04-x64», run 41377378758); pinned to 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The school named by the request
        run: |
          set -euo pipefail
          slug=$(tail -n 1 .github/staging-golden-school-request.txt | sed -n 's/^slug: *\([a-z0-9][a-z0-9-]*\) *$/\1/p')
          [ -n "$slug" ] || { echo "::error::the request's last line is not 'slug: <slug>'"; exit 1; }
          echo "GS_SLUG=$slug" >> "$GITHUB_ENV"
          echo "school: $slug"
      - name: Playwright (the audit harness's version)
        working-directory: audit/staging
        run: |
          npm init -y >/dev/null
          npm i --no-save --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Staging's database URL (checked, never printed)
        env:
          STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [ "$STAGING_SUPABASE_PROJECT_REF" != "$PRODUCTION_SUPABASE_PROJECT_REF" ]
          case "$STAGING_SUPABASE_DB_URL" in *"$PRODUCTION_SUPABASE_PROJECT_REF"*) echo "::error::the database URL names production"; exit 1;; esac
          case "$STAGING_SUPABASE_DB_URL" in *"$STAGING_SUPABASE_PROJECT_REF"*) echo "the database URL names staging's project";; *) echo "::error::the database URL does not name staging's project"; exit 1;; esac
      - name: The first administrator (the operator and the administrator each signed in as Gate 3 has it)
        working-directory: audit/staging
        env:
          STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
          GS_MAILBOX_PASSWORD: ${{ secrets.GS_MAILBOX_PASSWORD }}
          OUT_DIR: ${{ github.workspace }}/out
          # read by ../perf/lib.mjs at import (its server-made session is never used here, and no key is given)
          SUPABASE_URL: https://${{ env.STAGING_SUPABASE_PROJECT_REF }}.supabase.co
        run: node golden-school.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: staging-golden-school
          path: out/
          if-no-files-found: ignore
