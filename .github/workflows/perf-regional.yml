# STAGING ONLY. W6.2 and W6.8 measured FROM INDONESIA (owner, 8 Nov: «Arrange controlled W6.2 and W6.8 measurements
# from Indonesia. Preserve the existing performance targets.»). The same harness as the runs of record, unchanged:
#   where    the machine's place on the network: Vercel's edge for each page (x-vercel-id), and the time to first
#            byte of staging's pages and of Supabase's API, three times each.
#   journey  W6.2 (U-PERF, a first screen in ≤ 3 s): audit/perf/journey.mjs, as perf-staging.yml's journey job.
#   browser  W6.8 (D-031, an answer saved at p95 ≤ 1 s): audit/perf/l1-browser.mjs in shards, as perf-l1.yml's browser
#            mode, with the database sampled and D-031 judged by the same l1-metrics.mjs and l1-merge.mjs.
#            Seed its learners first with perf-l1.yml mode=seed (a fresh label, e.g. ID1, total 50, kelas 2).
#
# RUNS ONLY ON A MACHINE IN INDONESIA that the owner provides and registers to this repository as a self-hosted runner
# with the labels «indonesia» and «ubuntu-24.04» (an Ubuntu 24.04 host: Playwright 1.55's browser build, R0-PIN-01).
# docs/completion-4.0/acceptance/W62-W68-REGIONAL.md says how. Dispatch only; nothing here runs on a push or a PR.
#
# NEVER production: staging's ref and database URL are checked first; production's keys are never read.

name: perf · staging from Indonesia (W6.2, W6.8)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "where (the network place), journey (W6.2) or browser (W6.8)"
        type: choice
        options: [where, journey, browser]
        default: where
      reps:
        description: "journey: repetitions per role (the first may include cold starts)"
        type: number
        default: 3
      label:
        description: "browser: the Tingkat «Tingkat Beban <label>» seeded by perf-l1.yml mode=seed"
        default: "ID1"
      shards:
        description: "browser: parallel jobs (one per registered runner; 5 × 10 = the record's 50)"
        default: "5"
      per_shard:
        description: "browser: learners per job at most"
        default: "10"
      start_in_min:
        description: "browser: minutes from now to T0"
        default: "12"
      sample_min:
        description: "browser: minutes after T0 the database is sampled"
        default: "15"

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

env:
  STAGING_SUPABASE_PROJECT_REF: keijhmdtsgrfvnvocfvk
  PRODUCTION_SUPABASE_PROJECT_REF: trtlvibiybwixfumjrrx
  STAGING_ORIGIN: https://staging.pintarselalu.com
  ADMIN_EMAIL: uji-kinerja-admin@example.co

jobs:
  where:
    if: ${{ inputs.mode == 'where' }}
    runs-on: [self-hosted, indonesia, ubuntu-24.04]
    timeout-minutes: 5
    steps:
      - name: Where this machine meets staging
        run: |
          set -euo pipefail
          echo "machine: $(hostname) · $(uname -sr) · $(lsb_release -ds 2>/dev/null || true) · TZ $(date +%Z)"
          printf '%-26s %-4s %-9s %-9s %s\n' url http ttfb_s total_s x-vercel-id
          for url in "$STAGING_ORIGIN/masuk" "$STAGING_ORIGIN/" "https://$STAGING_SUPABASE_PROJECT_REF.supabase.co/auth/v1/health"; do
            for i in 1 2 3; do
              out=$(curl -sS -o /dev/null -D /tmp/h -w '%{http_code} %{time_starttransfer} %{time_total}' "$url")
              id=$(grep -i '^x-vercel-id:' /tmp/h | cut -d' ' -f2 | tr -d '\r' || true)
              read -r code ttfb total <<<"$out"
              printf '%-26s %-4s %-9s %-9s %s\n' "${url#https://}" "$code" "$ttfb" "$total" "${id:-none}"
            done
          done
          echo
          echo "x-vercel-id reads edge::function::request: the first part is the Vercel edge this machine reached, the"
          echo "second the function region (sin1 = Singapore, beside Supabase). A machine in Indonesia reaches an edge in"
          echo "the region; from GitHub's US runners it reads iad1 or similar (batch-8/evidence/w69-bukti-pemeriksaan.md §2d)."

  journey:
    if: ${{ inputs.mode == 'journey' }}
    runs-on: [self-hosted, indonesia, ubuntu-24.04]
    timeout-minutes: 20
    env:
      STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GURU_EMAIL: uji-kinerja-guru@example.com
      GS_MAILBOX_PASSWORD: ${{ secrets.GS_MAILBOX_PASSWORD }}
      REPS: ${{ inputs.reps }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright (the audit harness's version)
        working-directory: audit/perf
        run: |
          npm init -y >/dev/null
          npm i --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Staging's keys (masked)
        run: |
          set -euo pipefail
          [ "$STAGING_SUPABASE_PROJECT_REF" != "$PRODUCTION_SUPABASE_PROJECT_REF" ]
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os, sys, urllib.request
          ref = os.environ['STAGING_SUPABASE_PROJECT_REF']
          req = urllib.request.Request(f'https://api.supabase.com/v1/projects/{ref}/api-keys?reveal=true',
                                       headers={'Authorization': 'Bearer ' + os.environ['STAGING_SUPABASE_ACCESS_TOKEN']})
          keys = json.load(urllib.request.urlopen(req, timeout=30))
          for name, var in (('service_role', 'SERVICE_KEY'), ('anon', 'ANON_KEY')):
              k = next(k['api_key'] for k in keys if k.get('name') == name and (k.get('api_key') or '').startswith('eyJ'))
              print('::add-mask::' + k, file=sys.stderr, flush=True)
              print(f'{var}={k}')
          print(f'SUPABASE_URL=https://{ref}.supabase.co')
          PY
      - name: Which build staging is serving (read-only)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          def get(path):
              req = urllib.request.Request('https://api.vercel.com' + path, headers={'Authorization': 'Bearer ' + os.environ['VERCEL_TOKEN']})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          p = get('/v9/projects/pintar40-staging')
          d = get(f'/v6/deployments?projectId={p["id"]}&limit=1&state=READY&target=production').get('deployments', [])
          m = (d[0].get('meta') or {}) if d else {}
          print(f'staging serves {(m.get("githubCommitSha") or "?")[:7]} ({m.get("githubCommitRef")})' if d else 'no ready deployment found')
          PY
      - name: The journey, timed (W6.2's harness, unchanged)
        working-directory: audit/perf
        run: node journey.mjs

  plan:
    if: ${{ inputs.mode == 'browser' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      t0: ${{ steps.p.outputs.t0 }}
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - id: p
        env:
          SHARDS: ${{ inputs.shards }}
          START_IN: ${{ inputs.start_in_min }}
          SAMPLE: ${{ inputs.sample_min }}
        run: |
          set -euo pipefail
          [[ "$SHARDS" =~ ^[0-9]+$ ]] && [ "$SHARDS" -ge 1 ] && [ "$SHARDS" -le 10 ] || { echo "::error::shards 1..10"; exit 1; }
          [[ "$START_IN" =~ ^[0-9]+$ ]] && [ "$START_IN" -ge 5 ] && [ "$START_IN" -le 60 ] || { echo "::error::start_in_min 5..60"; exit 1; }
          [[ "$SAMPLE" =~ ^[0-9]+$ ]] && [ "$SAMPLE" -ge 5 ] && [ "$SAMPLE" -le 60 ] || { echo "::error::sample_min 5..60"; exit 1; }
          echo "t0=$(date -u -d "+${START_IN} minutes" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "shards=$(python3 -c "import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$SHARDS")" >> "$GITHUB_OUTPUT"

  browser:
    if: ${{ inputs.mode == 'browser' }}
    needs: plan
    runs-on: [self-hosted, indonesia, ubuntu-24.04]
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: psql (the harness reads its learners read-only)
        run: command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null)
      - name: Playwright and Chromium (the audit harness's version)
        working-directory: audit/perf
        run: |
          npm init -y >/dev/null
          npm i --no-save --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Staging's keys (masked) and database URL (checked, never printed)
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
        run: bash audit/perf/staging-keys.sh
      - name: One shard of the wave, in the real app (W6.8's harness, unchanged)
        working-directory: audit/perf
        env:
          STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
          SHARD: ${{ matrix.shard }}
          LABEL: ${{ inputs.label }}
          SHARDS: ${{ inputs.shards }}
          PER_SHARD: ${{ inputs.per_shard }}
          T0: ${{ needs.plan.outputs.t0 }}
          OUT_DIR: ${{ github.workspace }}/out
        run: node l1-browser.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: l1-shard-${{ matrix.shard }}
          path: out/
          if-no-files-found: ignore

  metrics:
    if: ${{ inputs.mode == 'browser' }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Staging's keys (masked) and database URL (checked, never printed)
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
        run: bash audit/perf/staging-keys.sh
      - name: The database's figures before, during and after
        working-directory: audit/perf
        env:
          T0: ${{ needs.plan.outputs.t0 }}
          SAMPLE_MIN: ${{ inputs.sample_min }}
          OUT_DIR: ${{ github.workspace }}/out
        run: node l1-metrics.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: l1-metrics
          path: out/
          if-no-files-found: ignore

  verdict:
    if: ${{ always() && inputs.mode == 'browser' }}
    needs: [browser, metrics]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          path: in
      - name: D-031's criteria (the same judge as perf-l1.yml)
        working-directory: audit/perf
        env:
          IN_DIR: ${{ github.workspace }}/in
          L1_MODE: browser
        run: node l1-merge.mjs
