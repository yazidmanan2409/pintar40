# STAGING ONLY. The Batch 4 administration journey on deployed staging (owner, 3 Nov: «BATCH 4 PROMOTION GATE», D-153):
# in a Golden School that GS-01 to GS-21 have walked, every Batch 4 administration action by the screens, each act's
# audit row read back: the Dekan's name and username corrected and put back, a learner's class card turned into an
# email account, that person's address corrected before activation and their activation, a transfer found by name,
# requested, accepted and executed by another Golden School, what waits, stuck sends, the paged schools and a profile
# photo (audit/staging/golden-school-pentadbiran.mjs).
# Runs once per edit of .github/staging-golden-school-pentadbiran-request.txt on the coordinator's branch; the request's
# last line names the school ("slug: <slug>") and a line "other: <slug>" names the receiving Golden School.
#
# NEVER: production (staging's ref and database URL are checked first; production's keys are never read); any direct
# write to the database (it is read in read-only transactions); a service-role key or a server-made session; Dr Gladys's
# school (both slugs must be sekolah-uji-* Golden Schools).

name: staging · Golden School, the Batch 4 administration journey (D-153)

on:
  push:
    branches:
      - claude/awesome-rubin-bqxp6p
    paths:
      - .github/staging-golden-school-pentadbiran-request.txt

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

env:
  STAGING_SUPABASE_PROJECT_REF: keijhmdtsgrfvnvocfvk
  PRODUCTION_SUPABASE_PROJECT_REF: trtlvibiybwixfumjrrx
  STAGING_ORIGIN: https://staging.pintarselalu.com

jobs:
  gs00:
    name: GS-00 · staging runs main's commit and migrations
    uses: ./.github/workflows/environment-facts.yml
    with:
      scope: staging
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}

  pentadbiran:
    name: the Batch 4 administration by the screens, each act's audit row read back
    needs: [gs00]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The school named by the request
        run: |
          set -euo pipefail
          f=.github/staging-golden-school-pentadbiran-request.txt
          slug=$(tail -n 1 "$f" | sed -n 's/^slug: *\([a-z0-9][a-z0-9-]*\) *$/\1/p')
          [ -n "$slug" ] || { echo "::error::the request's last line is not 'slug: <slug>'"; exit 1; }
          case "$slug" in sekolah-uji-*) ;; *) echo "::error::the school is not a Golden School test school"; exit 1;; esac
          other=$(sed -n 's/^other: *\([a-z0-9][a-z0-9-]*\) *$/\1/p' "$f" | tail -n 1)
          echo "GS_SLUG=$slug" >> "$GITHUB_ENV"
          echo "GS_OTHER_SLUG=$other" >> "$GITHUB_ENV"
          # owner, 7 Nov («DIMAS TRANSFER»): a line "lanjut: <transfer id>" runs only golden-school-pindah-lanjut.mjs, the
          # receiving school's «Laksanakan» on that already accepted transfer and the read-back, never the whole walk
          lanjut=$(tail -n 3 "$f" | sed -n 's/^lanjut: *\([0-9a-f-]\{36\}\) *$/\1/p' | tail -n 1)
          echo "GS_LANJUT_PINDAH=$lanjut" >> "$GITHUB_ENV"
          echo "school: $slug; another school: ${other:-none}; continue transfer: ${lanjut:-none}"
      - name: Playwright (the audit harness's version)
        working-directory: audit/staging
        run: |
          npm init -y >/dev/null
          npm i --no-save --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Staging's database URL (checked, never printed)
        env:
          STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [ "$STAGING_SUPABASE_PROJECT_REF" != "$PRODUCTION_SUPABASE_PROJECT_REF" ]
          case "$STAGING_SUPABASE_DB_URL" in *"$PRODUCTION_SUPABASE_PROJECT_REF"*) echo "::error::the database URL names production"; exit 1;; esac
          case "$STAGING_SUPABASE_DB_URL" in *"$STAGING_SUPABASE_PROJECT_REF"*) echo "the database URL names staging's project";; *) echo "::error::the database URL does not name staging's project"; exit 1;; esac
      - name: The Batch 4 administration (every write a press of PINTAR's buttons)
        working-directory: audit/staging
        env:
          STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
          GS_MAILBOX_PASSWORD: ${{ secrets.GS_MAILBOX_PASSWORD }}
          OUT_DIR: ${{ github.workspace }}/out
          # read by ../perf/lib.mjs at import (its server-made session is never used here, and no key is given)
          SUPABASE_URL: https://${{ env.STAGING_SUPABASE_PROJECT_REF }}.supabase.co
        run: |
          if [ -n "${GS_LANJUT_PINDAH:-}" ]; then node golden-school-pindah-lanjut.mjs; else node golden-school-pentadbiran.mjs; fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: staging-golden-school-pentadbiran
          path: out/
          if-no-files-found: ignore
