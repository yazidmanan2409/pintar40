<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 736" role="img" aria-labelledby="d05-judul d05-isi" class="diagram">
  <title id="d05-judul">D-05 · Dari hasil asesmen ke langkah mengajar berikutnya</title>
  <desc id="d05-isi">Murid mengumpulkan Uji Penguasaan dan PINTAR mencatatnya. Guru menekan Mengajar, memilih kelas, lalu menekan Lihat bukti. Jika angka belum tampil, bukti belum cukup: itu bukan hasil buruk; guru belum menyimpulkan dan menunggu lebih banyak murid mengumpulkan. Jika angka sudah tampil, guru membaca Kesimpulan, lalu menekan Lihat per soal. Guru memutuskan langkah berikutnya: mengajarkan ulang satu bagian, meminta murid tertentu membaca lagi, memeriksa lagi dengan Uji Cepat, atau melanjutkan ke materi berikutnya. PINTAR tidak memutuskan untuk guru. PINTAR mencatat bukti baru, dan siklusnya berulang pada asesmen berikutnya.</desc>
  <defs>
    <marker id="d05-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#44585C"/></marker>
    <marker id="d05-pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#754700"/></marker>
  </defs>
  <style>
    .t { font-family: "Plus Jakarta Sans", "Segoe UI", Arial, sans-serif; font-size: 13px; fill: #16262A; }
    .b { font-weight: 800; }
    .lab { font-family: "Plus Jakarta Sans", "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 800; fill: #075056; }
    .lab-a { fill: #754700; }
    .lab-w { fill: #FFFFFF; }
    .k { font-size: 12px; fill: #44585C; }
    .g { stroke: #44585C; stroke-width: 1.4; fill: none; }
    .ga { stroke: #754700; stroke-width: 1.4; fill: none; }
    .pintar { fill: #FFFFFF; stroke: #075056; stroke-width: 1.4; }
    .guru { fill: #E4F0EF; stroke: #075056; stroke-width: 1.4; }
    .putus { fill: #075056; }
    .periksa { fill: #FFFFFF; stroke: #44585C; stroke-width: 1.4; }
    .amber { fill: #FDF2D8; stroke: #D99A1C; stroke-width: 1.4; }
  </style>

  <!-- 1 · PINTAR mencatat -->
  <rect class="pintar" x="40" y="2" width="420" height="50" rx="3"/>
  <text class="lab" x="54" y="21">PINTAR</text>
  <text class="t" x="54" y="41">Murid mengumpulkan Uji Penguasaan; PINTAR mencatatnya.</text>
  <path class="g" d="M250,52 V70" marker-end="url(#d05-p)"/>

  <!-- 2 · Guru membuka Lihat bukti -->
  <rect class="guru" x="40" y="72" width="420" height="50" rx="12"/>
  <text class="lab" x="54" y="91">Guru</text>
  <text class="t" x="54" y="111">Tekan <tspan class="b">Mengajar</tspan>, pilih kelas, tekan <tspan class="b">Lihat bukti</tspan>.</text>
  <path class="g" d="M250,122 V140" marker-end="url(#d05-p)"/>

  <!-- 3 · Periksa -->
  <path class="periksa" d="M250,142 L350,187 L250,232 L150,187 z"/>
  <text class="t b" x="250" y="183" text-anchor="middle">Angka sudah</text>
  <text class="t b" x="250" y="200" text-anchor="middle">tampil?</text>

  <!-- Belum → pengecualian -->
  <path class="ga" d="M350,187 H476" marker-end="url(#d05-pa)"/>
  <text class="t k" x="362" y="179">Belum</text>
  <rect class="amber" x="478" y="134" width="176" height="122" rx="8"/>
  <text class="lab lab-a" x="492" y="154">Bukti belum cukup</text>
  <text class="t" x="492" y="174">Layar menulis «Belum</text>
  <text class="t" x="492" y="191">cukup data…». Itu bukan</text>
  <text class="t" x="492" y="208">hasil buruk.</text>
  <text class="t" x="492" y="228">Jangan menyimpulkan</text>
  <text class="t" x="492" y="245">dulu.</text>
  <path class="ga" d="M566,134 V27 H462" stroke-dasharray="4 3" marker-end="url(#d05-pa)"/>
  <text class="t k" x="574" y="66">setelah lebih</text>
  <text class="t k" x="574" y="81">banyak murid</text>
  <text class="t k" x="574" y="96">mengumpulkan</text>

  <!-- Ya -->
  <path class="g" d="M250,232 V250" marker-end="url(#d05-p)"/>
  <text class="t k" x="260" y="246">Ya</text>

  <!-- 4 · Baca Kesimpulan -->
  <rect class="guru" x="40" y="252" width="420" height="70" rx="12"/>
  <text class="lab" x="54" y="271">Guru</text>
  <text class="t" x="54" y="291">Baca «Kesimpulan»: Pemahaman dan Kenaikan, lalu</text>
  <text class="t" x="54" y="309">per bagian, pemahaman keliru, dan sebaran hasil.</text>
  <path class="g" d="M250,322 V340" marker-end="url(#d05-p)"/>

  <!-- 5 · Lihat per soal -->
  <rect class="guru" x="40" y="342" width="420" height="70" rx="12"/>
  <text class="lab" x="54" y="361">Guru</text>
  <text class="t" x="54" y="381">Tekan <tspan class="b">Lihat per soal</tspan>: soal yang sulit, pilihan salah</text>
  <text class="t" x="54" y="399">yang sering dipilih, murid yang mungkin perlu bantuan.</text>
  <path class="g" d="M250,412 V430" marker-end="url(#d05-p)"/>

  <!-- 6 · Guru memutuskan -->
  <rect class="putus" x="40" y="432" width="420" height="54" rx="12"/>
  <text class="lab lab-w" x="54" y="452">Guru memutuskan</text>
  <text class="t b" x="54" y="474" style="fill:#FFFFFF">Apa langkah mengajar berikutnya?</text>
  <text class="t k" x="478" y="452">PINTAR tidak</text>
  <text class="t k" x="478" y="467">memutuskan</text>
  <text class="t k" x="478" y="482">untuk Anda.</text>

  <!-- pilihan -->
  <path class="g" d="M143,486 V504" marker-end="url(#d05-p)"/>
  <path class="g" d="M357,486 V504" marker-end="url(#d05-p)"/>
  <rect class="guru" x="40" y="506" width="206" height="48" rx="9"/>
  <text class="t" x="52" y="526">Mengajarkan ulang</text>
  <text class="t" x="52" y="543">satu bagian</text>
  <rect class="guru" x="254" y="506" width="206" height="48" rx="9"/>
  <text class="t b" x="266" y="526">Minta membaca lagi</text>
  <text class="t" x="266" y="543">untuk murid tertentu</text>
  <rect class="guru" x="40" y="560" width="206" height="48" rx="9"/>
  <text class="t" x="52" y="580">Memeriksa lagi dengan</text>
  <text class="t b" x="52" y="597">Uji Cepat</text>
  <rect class="guru" x="254" y="560" width="206" height="48" rx="9"/>
  <text class="t" x="266" y="580">Melanjutkan ke materi</text>
  <text class="t" x="266" y="597">berikutnya</text>
  <path class="g" d="M250,608 V626" marker-end="url(#d05-p)"/>

  <!-- 7 · PINTAR mencatat bukti baru -->
  <rect class="pintar" x="40" y="628" width="420" height="50" rx="3"/>
  <text class="lab" x="54" y="647">PINTAR</text>
  <text class="t" x="54" y="667">Mencatat bukti baru; hasilnya tampil lagi di <tspan class="b">Lihat bukti</tspan>.</text>
  <path class="g" d="M40,653 H16 V97 H38" stroke-dasharray="4 3" marker-end="url(#d05-p)"/>
  <text class="t k" x="11" y="380" transform="rotate(-90 11 380)" text-anchor="middle">asesmen berikutnya</text>

  <!-- legenda: setiap warna juga punya kata -->
  <g transform="translate(40,700)">
    <rect class="pintar" x="0" y="0" width="22" height="16" rx="2"/>
    <text class="t k" x="30" y="12.5">Dicatat PINTAR</text>
    <rect class="guru" x="140" y="0" width="22" height="16" rx="6"/>
    <text class="t k" x="170" y="12.5">Dilakukan guru</text>
    <rect class="putus" x="282" y="0" width="22" height="16" rx="6"/>
    <text class="t k" x="312" y="12.5">Diputuskan guru</text>
    <rect class="amber" x="438" y="0" width="22" height="16" rx="4"/>
    <text class="t k" x="468" y="12.5">Pengecualian</text>
  </g>
</svg>
