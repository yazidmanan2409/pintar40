<!-- @dsCard height=288 width=960 -->
<style>
  .sampul { position: relative; width: 960px; height: 288px; background: var(--surface-0); overflow: hidden; font-family: var(--font-sans); }
  .sampul svg { position: absolute; left: 480px; top: 0; width: 480px; height: 288px; display: block; }
  .sampul .primary { fill: var(--pintar-primary); }
  .sampul .soft { fill: var(--pintar-primary-soft); }
  .sampul .ink { fill: var(--ink-1); }
  .sampul .tile { rx: var(--radius-lg); }
  .sampul .rule { stroke: var(--line-strong); stroke-width: var(--border-hairline); }
  .sampul .cut { stroke: var(--surface-0); stroke-width: var(--border-hairline); }
  /* The wordmark alone: no tagline is ever attached to it (canonical wordmark ruling, 5 Oct). */
  .sampul .nama-blok { position: absolute; left: var(--space-8); bottom: var(--space-8); max-width: 440px; }
  .sampul .nama { display: block; margin: 0; }
  .sampul .slot-merek { display: inline-flex; align-items: baseline; gap: 8px; padding: 12px 20px; border: 1px dashed var(--line-control); border-radius: var(--radius-md); font: 600 44px/1 var(--font-sans); color: #075056; }
  .sampul .slot-merek small { font: 400 14px/1.2 var(--font-sans); color: var(--ink-2); }
</style>
<div class="sampul">
  <!--
    Blocks: pintar-primary 192×252 (space-9 × 3 wide), pintar-primary-soft 208×128 (space-9 × 2 tall),
            ink-1 128×64 (space-9 × 2 by space-9); about 30 % of the cover. One green leads, as the
            interface spends it: neutral first, one hue with a reason.
    Arrangement: one tall slab bleeding off the top with two satellites beside it, a space-4 gap,
            the shape of PINTAR's shell (a sticky column, then the work at its measure).
    Pattern: four hairline rules on a space-8 (48 px) baseline, crossing the blocks. Chosen because
            the README says "hairlines and grounds separate things" and "type and space before boxes":
            borders, not shadows. On the ground a rule is line-strong; through a block it is cut in surface-0.
    Scales: space-4 16, space-8 48, space-9 64; radius-lg 12; border-hairline 1.
  -->
  <svg viewBox="0 0 480 288" aria-hidden="true" focusable="false">
    <rect class="primary tile" x="80" y="-12" width="192" height="252"/>
    <rect class="soft tile" x="288" y="48" width="208" height="128"/>
    <rect class="ink tile" x="288" y="192" width="128" height="64"/>

    <line class="rule" x1="32" y1="72" x2="80" y2="72"/>
    <line class="cut" x1="80" y1="72" x2="272" y2="72"/>
    <line class="rule" x1="272" y1="72" x2="480" y2="72"/>

    <line class="rule" x1="32" y1="120" x2="80" y2="120"/>
    <line class="cut" x1="80" y1="120" x2="272" y2="120"/>
    <line class="rule" x1="272" y1="120" x2="480" y2="120"/>

    <line class="rule" x1="32" y1="168" x2="80" y2="168"/>
    <line class="cut" x1="80" y1="168" x2="272" y2="168"/>
    <line class="rule" x1="272" y1="168" x2="480" y2="168"/>

    <line class="rule" x1="32" y1="216" x2="80" y2="216"/>
    <line class="cut" x1="80" y1="216" x2="272" y2="216"/>
    <line class="rule" x1="272" y1="216" x2="288" y2="216"/>
    <line class="cut" x1="288" y1="216" x2="416" y2="216"/>
    <line class="rule" x1="416" y1="216" x2="480" y2="216"/>
  </svg>
  <!-- 4 Nov (D-161, D-163(a)): the wordmark slot holds the placeholder until the master exists (F-11). -->
  <div class="nama-blok">
    <span class="nama slot-merek" role="img" aria-label="Pintar (master pending F-11)">Pintar <small>(master pending F-11)</small></span>
  </div>
</div>
