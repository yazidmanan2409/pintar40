<title>Mengenal PINTAR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="PINTAR: yang mengajar tetap Anda. PINTAR membantu mengurus yang berulang.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one screen at a time on a quiet column; three tones, each with one meaning
   (teal = a statement to remember, white = what PINTAR shows, warm = explanation, process, limits).
   A single committed look, not theme-switched: the tones carry meaning. */
:root {
  color-scheme: light;
  --teal: #075056;          /* PINTAR brand anchor: statements */
  --teal-deep: #053d42;     /* depth inside the reverse screens */
  --on-teal: #f4f8f7;
  --on-teal-2: #bcd6d2;     /* secondary text on teal: 5.9:1 */
  --ink: #1f2a33;
  --ink-2: #4e5a64;
  --ink-3: #5f6a73;
  --line: rgba(31, 42, 51, 0.12);
  --line-strong: rgba(31, 42, 51, 0.24);
  --white: #ffffff;         /* evidence */
  --paper: #fbfaf7;         /* the page between surfaces */
  --warm: #f3f1ec;          /* explanation, process, limits */
  --warm-2: #ebe8e1;
  --primary: #245f55;       /* PINTAR's action colour, for this page's own controls */
  --primary-soft: #e3efec;
  --mark: #075056;          /* presentation highlight: dashed, numbered, never PINTAR's own */
  --font: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --t-hero: clamp(2.3rem, 1.5rem + 3.2vw, 4.2rem);
  --t-h1: clamp(1.75rem, 1.35rem + 1.6vw, 2.6rem);
  --t-lead: clamp(1.06rem, 1rem + 0.3vw, 1.25rem);
  --t-body: 1rem;
  --t-small: 0.875rem;
  --t-label: 0.75rem;
  --r: 14px;
  --bar: 64px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: var(--t-body); line-height: 1.55; }
img { max-width: 100%; display: block; }
a { color: var(--primary); }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; border-radius: 6px; }
.terbalik :focus-visible { outline-color: var(--on-teal); }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
a.sr:focus { position: fixed; z-index: 50; top: calc(env(safe-area-inset-top, 0px) + 8px); left: max(16px, env(safe-area-inset-left, 0px)); width: auto; height: auto; clip-path: none; padding: 12px 16px; border-radius: 10px; background: var(--teal); color: var(--on-teal); font-weight: 600; }
.label { font-family: var(--mono); font-size: var(--t-label); letter-spacing: 0.08em; text-transform: uppercase; }

/* ── the bar: wordmark, where you are, language, all questions ── */
.atas { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(251, 250, 247, 0.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
.atas-isi { max-width: 1180px; margin: 0 auto; min-height: var(--bar); display: flex; align-items: center; gap: 12px 18px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.merek { font-weight: 800; letter-spacing: 0.2em; color: var(--teal); text-decoration: none; font-size: 1.05rem; padding: 6px 0; }
.posisi { flex: 1; min-width: 0; color: var(--ink-2); font-size: var(--t-small); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.posisi b { color: var(--ink); font-weight: 600; }
.bahasa { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; padding: 3px; gap: 2px; }
.bahasa button { font: 600 var(--t-small)/1 var(--font); border: 0; background: transparent; color: var(--ink-2); min-height: 36px; min-width: 44px; padding: 0 12px; border-radius: 999px; cursor: pointer; }
.bahasa button[aria-pressed="true"] { background: var(--teal); color: var(--on-teal); }
.tombol { font: 600 var(--t-small)/1.2 var(--font); display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--white); color: var(--ink); cursor: pointer; text-decoration: none; }
.tombol:hover { background: var(--warm); }
.tombol.utama { background: var(--primary); border-color: var(--primary); color: #fff; }
.tombol.utama:hover { background: #1e5148; }
.tombol svg { width: 18px; height: 18px; flex: none; }

/* ── a screen ── */
main { min-height: calc(100vh - var(--bar) - 69px); }
.layar { display: none; }
.layar.aktif { display: flex; flex-direction: column; min-height: calc(100vh - var(--bar) - 69px); min-height: calc(100dvh - var(--bar) - 69px); animation: muncul 220ms ease-out; }
.layar.aktif > .isi:last-child { flex: 1; width: 100%; align-content: center; }
@keyframes muncul { from { opacity: 0.001; } to { opacity: 1; } }
.isi { max-width: 1180px; margin: 0 auto; padding-block: clamp(28px, 5vw, 64px) clamp(40px, 6vw, 80px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: clamp(20px, 3vw, 32px); }
.nada-putih { background: var(--white); }
.nada-hangat { background: var(--warm); }
.terbalik { background: radial-gradient(1100px 620px at 88% -10%, #0b636a 0%, rgba(11, 99, 106, 0) 70%), var(--teal); color: var(--on-teal); }
.pita { background: var(--teal); color: var(--on-teal); }
.pita .isi { padding-block: 22px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
.pita .label { color: var(--on-teal-2); }
.pita p { margin: 0; font-size: var(--t-lead); font-weight: 600; text-wrap: balance; }
@media (max-width: 480px) and (max-height: 760px) { .pita .isi { padding-block: 10px; row-gap: 2px; } .pita p { font-size: var(--t-body); } }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: var(--t-h1); line-height: 1.12; letter-spacing: -0.02em; font-weight: 800; max-width: 22ch; }
.lead { margin: 0; font-size: var(--t-lead); color: var(--ink-2); max-width: 62ch; }
.dua { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.3fr); gap: clamp(20px, 4vw, 48px); align-items: start; }
.dua > * { min-width: 0; }
@media (max-width: 880px) { .dua { grid-template-columns: minmax(0, 1fr); } }
.kepala { display: grid; gap: 14px; }

/* ── opening and closing: typography only ── */
.pembuka .isi, .penutup .isi { padding-block: clamp(36px, 6vw, 84px); gap: clamp(24px, 4vw, 44px); }
.pernyataan { margin: 0; font-size: var(--t-hero); line-height: 1.04; letter-spacing: -0.03em; font-weight: 800; max-width: 18ch; }
.pernyataan .sub { display: block; margin-top: 0.35em; font-size: 0.5em; line-height: 1.2; color: var(--on-teal-2); font-weight: 600; letter-spacing: -0.015em; max-width: 30ch; }
.pernyataan em { font-style: normal; text-decoration: underline; text-decoration-color: var(--on-teal-2); text-decoration-thickness: 0.07em; text-underline-offset: 0.12em; }
.pengantar { margin: 0; color: var(--on-teal-2); font-size: var(--t-lead); max-width: 56ch; }
@media (prefers-reduced-motion: no-preference) {
  .layar.aktif .masuk-1 { animation: naik 420ms ease-out both; }
  .layar.aktif .masuk-2 { animation: naik 420ms 140ms ease-out both; }
  .layar.aktif .masuk-3 { animation: naik 420ms 280ms ease-out both; }
}
@keyframes naik { from { opacity: 0.001; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.tanya { display: grid; gap: 14px; }
.tanya h2 { font-size: var(--t-lead); font-weight: 700; color: var(--on-teal); }
.daftar-tanya { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 10px; }
.daftar-tanya a { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; padding: 14px 18px; border-radius: var(--r); background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(188, 214, 210, 0.35); color: var(--on-teal); text-decoration: none; font-weight: 600; }
.daftar-tanya a:hover { background: rgba(255, 255, 255, 0.13); }
.daftar-tanya a svg { width: 18px; height: 18px; flex: none; opacity: 0.8; }
.mulai-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.terbalik .tombol.utama { background: var(--on-teal); color: var(--teal); border-color: var(--on-teal); }
.terbalik .tombol.utama:hover { background: #fff; }
.terbalik .tombol:not(.utama) { background: transparent; color: var(--on-teal); border-color: rgba(188, 214, 210, 0.6); }
.terbalik .tombol:not(.utama):hover { background: rgba(255, 255, 255, 0.08); }
.penutup .pernyataan { max-width: none; font-size: clamp(2.5rem, 1.4rem + 4.4vw, 5.2rem); }
.pernyataan .baris { display: block; }
.penutup .pernyataan .sub { font-size: 0.42em; margin-top: 0.7em; }
.kontak { display: grid; gap: 10px; color: var(--on-teal-2); }
.kontak strong { color: var(--on-teal); font-size: var(--t-lead); }
.kontak .baris { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.alamat { font: 600 var(--t-lead)/1.3 var(--font); color: var(--on-teal); user-select: all; }

/* ── evidence frames: what PINTAR shows ── */
.bingkai { margin: 0; display: grid; gap: 0; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line-strong); background: var(--white); box-shadow: 0 1px 0 var(--line), 0 18px 40px -28px rgba(7, 80, 86, 0.45); }
.bingkai-kepala { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; align-items: center; padding: 9px 14px; background: var(--warm); border-bottom: 1px solid var(--line); }
.bingkai-kepala .label { color: var(--ink-2); }
.bingkai-kepala .contoh { color: var(--teal); }
.bingkai picture { display: block; background: var(--paper); padding: clamp(0px, 1.5vw, 14px) 0; }
.bingkai img { width: 100%; max-width: var(--w, 100%); height: auto; margin: 0 auto; }
figcaption { padding: 12px 14px; font-size: var(--t-small); color: var(--ink-2); border-top: 1px solid var(--line); background: var(--white); }
.pilih { display: inline-flex; flex-wrap: wrap; gap: 6px; padding: 4px; border-radius: 999px; background: var(--warm); border: 1px solid var(--line); }
.pilih button { font: 600 var(--t-small)/1.2 var(--font); border: 0; min-height: 40px; padding: 8px 14px; border-radius: 999px; background: transparent; color: var(--ink-2); cursor: pointer; }
.pilih button[aria-selected="true"] { background: var(--white); color: var(--ink); box-shadow: 0 1px 2px rgba(31, 42, 51, 0.15); }

/* ── explanation panels: warm, labelled ── */
.penjelasan { display: grid; gap: 12px; padding: 18px 20px; border-radius: var(--r); background: var(--warm); border: 1px solid var(--line); }
.nada-hangat .penjelasan { background: var(--white); }
.penjelasan > .label { color: var(--teal); }
.penjelasan p { margin: 0; }
.perlu { display: grid; gap: 6px; padding: 14px 16px; border-left: 3px solid var(--line-strong); background: var(--white); border-radius: 0 10px 10px 0; font-size: var(--t-small); color: var(--ink-2); }
.nada-hangat .perlu { background: var(--paper); }
.perlu b { color: var(--ink); }
.lakukan { margin: 0; display: flex; gap: 10px; align-items: flex-start; font-weight: 600; }
.lakukan::before { content: ""; flex: none; width: 10px; height: 10px; margin-top: 8px; border-radius: 50%; background: var(--teal); }
details { border-top: 1px solid var(--line); }
details:last-of-type { border-bottom: 1px solid var(--line); }
summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 12px; align-items: center; min-height: 52px; padding: 10px 2px; font-weight: 600; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font: 500 1.4rem/1 var(--font); color: var(--teal); }
details[open] summary::after { content: "–"; }
details > div { padding: 0 2px 16px; color: var(--ink-2); display: grid; gap: 8px; max-width: 62ch; }
.direncanakan { font-family: var(--mono); font-size: var(--t-label); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); border: 1px dashed var(--line-strong); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }

/* ── the connected route (screen 2) and setup steps (screen 7) ── */
.alur { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; counter-reset: alur; }
.alur li { position: relative; display: grid; gap: 10px; align-content: start; padding: 26px 20px 26px 0; }
.alur li + li { padding-left: 20px; border-left: 1px solid var(--line-strong); }
.alur .tahap { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: clamp(1.06rem, 0.9rem + 0.5vw, 1.3rem); color: var(--ink); }
.alur .tahap i { flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--teal); color: var(--on-teal); font: 500 var(--t-small)/1 var(--mono); font-style: normal; }
.alur p { margin: 0; font-size: var(--t-body); color: var(--ink-2); }
.alur .siapa { font-family: var(--mono); font-size: var(--t-label); color: var(--teal); letter-spacing: 0.05em; text-transform: uppercase; }
@media (max-width: 880px) { .alur { grid-template-columns: minmax(0, 1fr); } .alur li, .alur li + li { padding: 14px 0 14px 18px; border-left: 2px solid var(--teal); } }
.peran { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.peran li { padding: 8px 14px; border-radius: 999px; background: var(--white); border: 1px solid var(--line); font-size: var(--t-small); font-weight: 600; }
.langkah4 { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.langkah4 li { display: grid; gap: 10px; align-content: start; padding: clamp(18px, 2vw, 26px); border-radius: var(--r); background: var(--white); border: 1px solid var(--line); }
.langkah4 .no { font: 800 clamp(1.6rem, 1.2rem + 1vw, 2.2rem)/1 var(--font); color: var(--teal); letter-spacing: -0.02em; }
.langkah4 h3 { font-size: clamp(1.06rem, 0.95rem + 0.4vw, 1.25rem); }
.langkah4 p { margin: 0; font-size: var(--t-body); color: var(--ink-2); }
@media (max-width: 980px) { .langkah4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .langkah4 { grid-template-columns: minmax(0, 1fr); } }

/* ── the class report (screen 5) ── */
.laporan { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); grid-template-areas: "lap langkah" "lap jelas" "lap redup" "lap saklar" "lap ."; grid-template-rows: auto auto auto auto 1fr; gap: 14px clamp(18px, 3vw, 36px); align-items: start; }
.laporan > * { min-width: 0; }
.laporan > .bingkai { grid-area: lap; } .laporan > .langkah-baca { grid-area: langkah; } .laporan > .penjelasan { grid-area: jelas; } .laporan > .saklar { grid-area: saklar; }
@media (max-width: 880px) { .laporan { grid-template-columns: minmax(0, 1fr); grid-template-areas: "langkah" "lap" "redup" "jelas" "saklar"; grid-template-rows: none; } .jendela { max-height: 58vh; } }
.jendela { position: relative; max-height: min(76vh, 820px); overflow: auto; overscroll-behavior: contain; background: var(--paper); }
.jendela:focus-visible { outline-offset: -3px; }
.bukti-wadah { position: relative; }
.gulir-bukti { overflow: auto; overscroll-behavior: contain; background: var(--paper); }
.gulir-bukti:focus-visible { outline-offset: -3px; }
.lagi { position: absolute; left: 0; right: 0; bottom: 0; margin: 0; padding: 40px 12px 12px; display: flex; justify-content: center; pointer-events: none; background: linear-gradient(to bottom, rgba(251, 250, 247, 0), rgba(251, 250, 247, 0.96) 72%); }
.lagi span { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; font: 600 var(--t-small)/1.2 var(--font); color: var(--teal); background: var(--white); border: 1px solid var(--line-strong); border-radius: 999px; padding: 7px 14px; box-shadow: 0 6px 16px -10px rgba(7, 80, 86, 0.5); }
.lagi svg { width: 16px; height: 16px; flex: none; }
figcaption a { font-weight: 600; white-space: nowrap; }
.kanvas { position: relative; }
.sorot { position: absolute; border: 2.5px dashed var(--mark); border-radius: 12px; pointer-events: none; box-shadow: 0 0 0 9999px rgba(251, 250, 247, 0.4); }
.sorot + .sorot { box-shadow: none; }
.sorot span { position: absolute; top: -13px; left: 10px; background: var(--mark); color: var(--on-teal); font: 500 var(--t-label)/1 var(--mono); padding: 5px 7px; border-radius: 6px; }
@media (prefers-reduced-motion: no-preference) { .sorot { transition: top 260ms ease, height 260ms ease; } }
.langkah-baca { display: grid; gap: 8px; }
.langkah-baca button { text-align: left; font: 600 var(--t-body)/1.35 var(--font); display: flex; gap: 12px; align-items: center; min-height: 52px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--white); color: var(--ink); cursor: pointer; }
.langkah-baca button i { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 500 var(--t-small)/1 var(--mono); font-style: normal; border: 1.5px dashed var(--mark); color: var(--mark); }
.langkah-baca button[aria-selected="true"] { border-color: var(--teal); background: var(--primary-soft); }
.langkah-baca button[aria-selected="true"] i { background: var(--mark); color: var(--on-teal); border-style: solid; }
.redup { margin: 0; font-size: var(--t-small); color: var(--ink-2); grid-area: redup; }
.saklar { display: flex; gap: 12px; align-items: center; min-height: 48px; cursor: pointer; font-weight: 600; }
.saklar input { appearance: none; flex: none; width: 46px; height: 28px; border-radius: 999px; background: var(--warm-2); border: 1px solid var(--line-strong); position: relative; cursor: pointer; margin: 0; }
.saklar input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--white); box-shadow: 0 1px 2px rgba(31, 42, 51, 0.3); }
.saklar input:checked { background: var(--teal); border-color: var(--teal); }
.saklar input:checked::after { left: 21px; }
.saklar input:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }

/* ── access by information (screen 8) ── */
.akses { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.akses li { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.6fr); gap: 8px 24px; padding: 16px 18px; border-radius: var(--r); background: var(--white); border: 1px solid var(--line); }
.akses h3 { font-size: 1.02rem; }
.akses p { margin: 0; color: var(--ink-2); font-size: var(--t-small); }
.akses .siapa { color: var(--ink); font-size: var(--t-body); font-weight: 500; }
@media (max-width: 700px) { .akses li { grid-template-columns: minmax(0, 1fr); } }
.bukti-tetap { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 10px; }
.bukti-tetap li { padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line-strong); font-size: var(--t-small); color: var(--ink-2); background: transparent; }
.bukti-tetap b { display: block; color: var(--ink); font-size: var(--t-body); margin-bottom: 2px; }

/* ── roadmap (screen 9): now solid, later outlined ── */
.peta { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.peta li { display: grid; gap: 12px; align-content: start; padding: clamp(20px, 2.2vw, 30px); border-radius: var(--r); min-height: 15rem; }
.peta .kini { background: var(--teal); color: var(--on-teal); }
.peta .kini p { color: var(--on-teal-2); }
.peta .nanti { border: 1.5px dashed var(--line-strong); background: transparent; }
.peta .versi { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.peta .versi b { font: 800 clamp(1.8rem, 1.3rem + 1.4vw, 2.6rem)/1 var(--font); letter-spacing: -0.03em; }
.peta h3 { font-size: clamp(1.06rem, 0.95rem + 0.4vw, 1.25rem); }
.peta p { margin: 0; font-size: var(--t-body); color: var(--ink-2); }
.peta .status { font-family: var(--mono); font-size: var(--t-label); letter-spacing: 0.05em; text-transform: uppercase; }
.peta .kini .status { color: var(--on-teal); border: 1px solid rgba(188, 214, 210, 0.6); border-radius: 999px; padding: 2px 8px; }
@media (max-width: 980px) { .peta { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .peta { grid-template-columns: minmax(0, 1fr); } }

/* ── screen 6: the finding first ── */
